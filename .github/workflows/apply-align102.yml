name: Integrate aligned home instruments
on:
  push:
    branches: [feature/hetu-rebrand-root-app]
    paths: [.github/workflows/apply-align102.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply presentation-only changes
        shell: bash
        run: |
          set -euo pipefail
          python3 design/alignment102/apply.py
          python3 tools/test_ui_audit_invariants.py
          git diff --check
          test -z "$(git diff --name-only -- .github tests/ui-runtime-baseline.json native)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-app
          git commit -m 'ui: unify home instruments on shared baseline slots (test.102)'
          git push origin HEAD:feature/hetu-rebrand-root-app
          mkdir -p export
          git archive HEAD | gzip > export/source.tar.gz
          git rev-parse HEAD > export/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Hetu-Alignment102-Source
          path: export/
          retention-days: 1
