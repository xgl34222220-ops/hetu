name: Apply all-node latency and local app icon fix

on:
  push:
    branches:
      - feature/compose-luoshu-ui

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply all-node latency and local app icon fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compose-luoshu-ui
          fetch-depth: 0
      - name: Patch all-node latency and local icons
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          # 1) Make global latency testing use the same provider-aware URL/expected status as a manual node test.
          repo_path = Path('android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyDashboardRepository.kt')
          text = repo_path.read_text()
          old = '''    /** Reuse the controller's complete global test: group-native batch testing plus individual fallback for every uncovered real node. */
              suspend fun globalDelay(): Map<String, Long> = controller.globalDelay()
          '''
          new = '''    /**
               * Test every real leaf node with the same provider/group URL that a manual node test uses.
               * This avoids the old mismatch where "全部测速" used generic probe URLs while tapping one
               * node used the provider's own health-check URL, which could falsely mark an entire provider
               * as timed out. A failed fresh probe keeps Mihomo's last positive history instead of replacing
               * a known-good value with a false timeout.
               */
              suspend fun globalDelay(): Map<String, Long> = withContext(Dispatchers.IO) {
                  val raw = api.proxies()
                  val providers = remoteProviders(api.proxyProviders())
                  val providerByNode = HashMap<String, DashboardProviderUi>()
                  providers.forEach { provider -> provider.nodes.forEach { node -> providerByNode.putIfAbsent(node, provider) } }

                  val leaves = LinkedHashSet<String>()
                  val previous = HashMap<String, Long>()
                  val names = raw.keys()
                  while (names.hasNext()) {
                      val name = names.next()
                      if (name == "GLOBAL") continue
                      val item = raw.optJSONObject(name) ?: continue
                      if (item.optJSONArray("all") != null) continue
                      val type = item.optString("type", "").lowercase()
                      if (type in setOf("direct", "reject", "rejectdrop", "pass", "compatible")) continue
                      leaves += name
                      latestDelay(item)?.takeIf { it > 0L }?.let { previous[name] = it }
                  }

                  val groupProbe = HashMap<String, Pair<String, String>>()
                  val groupNames = raw.keys()
                  while (groupNames.hasNext()) {
                      val groupName = groupNames.next()
                      val group = raw.optJSONObject(groupName) ?: continue
                      val all = group.optJSONArray("all") ?: continue
                      val url = group.optString("testUrl", "")
                      val expected = group.optString("expectedStatus", "200-399").ifBlank { "200-399" }
                      if (url.isBlank()) continue
                      for (i in 0 until all.length()) {
                          val node = all.optString(i)
                          if (node.isNotBlank()) groupProbe.putIfAbsent(node, url to expected)
                      }
                  }

                  val result = LinkedHashMap<String, Long>()
                  for (chunk in leaves.toList().chunked(6)) {
                      val measured = coroutineScope {
                          chunk.map { node ->
                              async {
                                  val provider = providerByNode[node]
                                  val fallback = groupProbe[node]
                                  val value = try {
                                      when {
                                          provider != null -> api.delay(node, provider.testUrl, provider.expectedStatus)
                                          fallback != null -> api.delay(node, fallback.first, fallback.second)
                                          else -> api.delay(node)
                                      }
                                  } catch (cancel: CancellationException) {
                                      throw cancel
                                  } catch (_: Exception) {
                                      -1L
                                  }
                                  node to if (value > 0L) value else (previous[node] ?: -1L)
                              }
                          }.awaitAll()
                      }
                      measured.forEach { (name, value) -> result[name] = value }
                  }
                  result
              }
          '''
          # Normalize indentation in literal because workflow YAML adds spaces to heredoc body only visually, not content.
          old = old.replace('\n              ', '\n    ').replace('    /**', '    /**', 1)
          new = new.replace('\n              ', '\n    ').replace('\n                  ', '\n        ').replace('\n                      ', '\n            ').replace('\n                          ', '\n                ').replace('\n                              ', '\n                    ').replace('\n                                  ', '\n                        ').replace('\n                                      ', '\n                            ').replace('\n                                          ', '\n                                ')
          text = replace_once(text, old, new, 'provider-aware global delay')
          repo_path.write_text(text)

          # 2) Add an explicit one-tap "全部测速" action in the Nodes panel.
          v3_path = Path('android-app/app/src/main/java/io/github/xgl34222220/bichen/LuoShuProxyV3Activity.kt')
          text = v3_path.read_text()
          old = '''                            V3Heading("策略组", if (refreshing) "正在测试全部节点…" else "点策略组展开节点", Modifier.weight(1f))
                                      V3SmallAction(Icons.Rounded.Sort, if (sort == V3Sort.Config) "配置" else "延迟") { sort = if (sort == V3Sort.Config) V3Sort.Delay else V3Sort.Config }
          '''
          new = '''                            V3Heading("策略组", if (refreshing) "正在测试全部节点…" else "点策略组展开节点", Modifier.weight(1f))
                                      V3SmallAction(Icons.Rounded.Speed, if (refreshing) "测速中" else "全部测速") { if (!refreshing) refreshTab() }
                                      Spacer(Modifier.width(6.dp))
                                      V3SmallAction(Icons.Rounded.Sort, if (sort == V3Sort.Config) "配置" else "延迟") { sort = if (sort == V3Sort.Config) V3Sort.Delay else V3Sort.Config }
          '''
          old = old.replace('\n                                      ', '\n                            ')
          new = new.replace('\n                                      ', '\n                            ')
          text = replace_once(text, old, new, 'all latency action')
          v3_path.write_text(text)

          # 3) Use the real PackageManager-provided local icon on the per-app ad-block/bypass page.
          app_path = Path('android-app/app/src/main/java/io/github/xgl34222220/bichen/CompactMainActivity.kt')
          text = app_path.read_text()
          text = replace_once(
              text,
              'import androidx.compose.ui.graphics.luminance\nimport androidx.compose.ui.graphics.vector.ImageVector',
              'import androidx.compose.ui.graphics.luminance\nimport androidx.compose.ui.graphics.asImageBitmap\nimport androidx.compose.ui.graphics.vector.ImageVector\nimport androidx.compose.ui.layout.ContentScale',
              'app icon imports',
          )
          old = '''                    Surface(shape = RoundedCornerShape(15.dp), color = tokens.elevatedCardBackground) {
                                      Box(Modifier.size(44.dp), contentAlignment = Alignment.Center) {
                                          Text(app.label.take(1), fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary)
                                      }
                                  }
          '''
          new = '''                    if (app.icon != null) {
                                      androidx.compose.foundation.Image(
                                          bitmap = app.icon.asImageBitmap(),
                                          contentDescription = null,
                                          modifier = Modifier.size(44.dp).clip(RoundedCornerShape(13.dp)),
                                          contentScale = ContentScale.Fit,
                                      )
                                  } else {
                                      Surface(shape = RoundedCornerShape(13.dp), color = tokens.elevatedCardBackground, modifier = Modifier.size(44.dp)) {
                                          Box(contentAlignment = Alignment.Center) {
                                              Icon(Icons.Rounded.Android, null, tint = MaterialTheme.colorScheme.primary, modifier = Modifier.size(22.dp))
                                          }
                                      }
                                  }
          '''
          old = old.replace('\n                                      ', '\n                        ').replace('\n                                          ', '\n                            ')
          new = new.replace('\n                                      ', '\n                        ').replace('\n                                          ', '\n                            ').replace('\n                                              ', '\n                                ')
          text = replace_once(text, old, new, 'local app icon rendering')
          app_path.write_text(text)
          PY

          rm -f .github/workflows/apply-all-node-icons-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix all-node latency and local app icons"
          git push origin HEAD:feature/compose-luoshu-ui
