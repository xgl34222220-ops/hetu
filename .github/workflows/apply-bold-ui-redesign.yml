name: Apply visible Bichen UI redesign

on:
  push:
    branches:
      - feature/compose-luoshu-ui

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Fix visible Bichen UI redesign workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compose-luoshu-ui
          fetch-depth: 0
      - name: Apply major launcher redesign
        run: python3 tools/apply_bold_ui_redesign.py
      - name: Commit redesign
        run: |
          rm -f tools/apply_bold_ui_redesign.py .github/workflows/apply-bold-ui-redesign.yml .github/workflows/quick-uiux-apk.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make Bichen UI visibly product-specific"
          git push origin HEAD:feature/compose-luoshu-ui
