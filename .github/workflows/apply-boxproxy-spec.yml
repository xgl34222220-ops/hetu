name: Apply BoxProxy UI UX spec

on:
  push:
    branches: ['feature/compose-luoshu-ui']

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run BoxProxy spec patch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compose-luoshu-ui
          fetch-depth: 1
      - name: Apply BoxProxy architecture
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_between(text, start_marker, end_marker, replacement, start_at=0):
              start = text.index(start_marker, start_at)
              end = text.index(end_marker, start)
              return text[:start] + replacement + text[end:]

          # ---- Runtime network metrics: LAN interface + cached WAN identity ----
          p = Path('android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyRuntimeInspector.kt')
          s = p.read_text()
          if 'import android.os.SystemClock' not in s:
              s = s.replace('import android.content.Context\n', 'import android.content.Context\nimport android.os.SystemClock\n', 1)

          old_snapshot = '''internal data class ProxyRuntimeSnapshot(\n    val running: Boolean = false,\n    val pid: Int = 0,\n    val elapsedSeconds: Long = 0L,\n    val processTicks: Long = 0L,\n    val systemTicks: Long = 0L,\n    val rssBytes: Long = 0L,\n    val lanAddress: String = "—",\n)'''
          new_snapshot = '''internal data class ProxyRuntimeSnapshot(\n    val running: Boolean = false,\n    val pid: Int = 0,\n    val elapsedSeconds: Long = 0L,\n    val processTicks: Long = 0L,\n    val systemTicks: Long = 0L,\n    val rssBytes: Long = 0L,\n    val lanAddress: String = "—",\n    val lanInterface: String = "—",\n    val wanAddress: String = "—",\n    val wanCountryCode: String = "",\n    val wanRegion: String = "—",\n)'''
          if old_snapshot in s:
              s = s.replace(old_snapshot, new_snapshot, 1)

          marker = '    private val prefs = app.getSharedPreferences("bichen", Context.MODE_PRIVATE)\n'
          if 'wanCacheAt' not in s:
              s = s.replace(marker, marker + '''    @Volatile private var wanCacheAt = 0L\n    @Volatile private var wanCache = Triple("—", "", "—")\n''', 1)

          sample_start = '    suspend fun sample(): ProxyRuntimeSnapshot = withContext(Dispatchers.IO) {'
          sample_end = '    suspend fun reloadConfig() = withContext(Dispatchers.IO) {'
          new_sample = '''    suspend fun sample(): ProxyRuntimeSnapshot = withContext(Dispatchers.IO) {\n        val command = """\n            P=${'$'}(cat /data/adb/bichen/proxy/run/core.pid 2>/dev/null || echo 0)\n            case "${'$'}P" in ''|*[!0-9]*) P=0;; esac\n            if [ "${'$'}P" -gt 0 ] && kill -0 "${'$'}P" >/dev/null 2>&1; then\n              UP=${'$'}(cut -d' ' -f1 /proc/uptime 2>/dev/null | cut -d. -f1)\n              START=${'$'}(awk '{print int(${'$'}22/100)}' /proc/${'$'}P/stat 2>/dev/null || echo 0)\n              case "${'$'}UP" in ''|*[!0-9]*) UP=0;; esac\n              case "${'$'}START" in ''|*[!0-9]*) START=0;; esac\n              ELAPSED=0\n              if [ "${'$'}UP" -ge "${'$'}START" ]; then ELAPSED=${'$'}((UP-START)); fi\n              PT=${'$'}(awk '{print ${'$'}14+${'$'}15}' /proc/${'$'}P/stat 2>/dev/null || echo 0)\n              ST=${'$'}(awk '/^cpu /{s=0; for(i=2;i<=NF;i++)s+=${'$'}i; print s; exit}' /proc/stat 2>/dev/null || echo 0)\n              RKB=${'$'}(awk '/^VmRSS:/{print ${'$'}2; exit}' /proc/${'$'}P/status 2>/dev/null || echo 0)\n              case "${'$'}PT" in ''|*[!0-9]*) PT=0;; esac\n              case "${'$'}ST" in ''|*[!0-9]*) ST=0;; esac\n              case "${'$'}RKB" in ''|*[!0-9]*) RKB=0;; esac\n              printf '{"running":true,"pid":%s,"elapsed":%s,"processTicks":%s,"systemTicks":%s,"rssBytes":%s}\\n' "${'$'}P" "${'$'}ELAPSED" "${'$'}PT" "${'$'}ST" "${'$'}((RKB*1024))"\n            else\n              printf '%s\\n' '{"running":false,"pid":0,"elapsed":0,"processTicks":0,"systemTicks":0,"rssBytes":0}'\n            fi\n        """.trimIndent()\n        val result = RootBridge.rootShell(app, command, 8_000L)\n        val json = if (result.ok()) runCatching { JSONObject(result.output.trim()) }.getOrNull() else null\n        val local = localNetwork()\n        val wan = publicNetwork()\n        ProxyRuntimeSnapshot(\n            running = json?.optBoolean("running", false) == true,\n            pid = json?.optInt("pid", 0) ?: 0,\n            elapsedSeconds = json?.optLong("elapsed", 0L) ?: 0L,\n            processTicks = json?.optLong("processTicks", 0L) ?: 0L,\n            systemTicks = json?.optLong("systemTicks", 0L) ?: 0L,\n            rssBytes = json?.optLong("rssBytes", 0L) ?: 0L,\n            lanAddress = local.first,\n            lanInterface = local.second,\n            wanAddress = wan.first,\n            wanCountryCode = wan.second,\n            wanRegion = wan.third,\n        )\n    }\n\n'''
          s = replace_between(s, sample_start, sample_end, new_sample)

          tail_start = s.index('    private fun localIpv4Address(): String {')
          class_end = s.rfind('\n}')
          new_tail = '''    private fun localNetwork(): Pair<String, String> {\n        return runCatching {\n            val preferred = ArrayList<Triple<Int, String, String>>()\n            val interfaces = NetworkInterface.getNetworkInterfaces() ?: return@runCatching "—" to "—"\n            while (interfaces.hasMoreElements()) {\n                val network = interfaces.nextElement()\n                if (!network.isUp || network.isLoopback) continue\n                val rank = when {\n                    network.name.startsWith("wlan", true) -> 0\n                    network.name.startsWith("eth", true) -> 1\n                    network.name.startsWith("rmnet", true) -> 2\n                    else -> 3\n                }\n                val addresses = network.inetAddresses\n                while (addresses.hasMoreElements()) {\n                    val address = addresses.nextElement()\n                    if (address is Inet4Address && !address.isLoopbackAddress && !address.isLinkLocalAddress) {\n                        preferred += Triple(rank, address.hostAddress.orEmpty(), network.name)\n                    }\n                }\n            }\n            preferred.sortedBy { it.first }.firstOrNull()?.let { it.second to it.third } ?: ("—" to "—")\n        }.getOrDefault("—" to "—")\n    }\n\n    private fun publicNetwork(): Triple<String, String, String> {\n        val now = SystemClock.elapsedRealtime()\n        if (now - wanCacheAt < 60_000L && wanCache.first != "—") return wanCache\n        val fresh = runCatching {\n            val connection = (URL("https://ipwho.is/?fields=success,ip,country_code,region").openConnection() as HttpURLConnection).apply {\n                connectTimeout = 3_000\n                readTimeout = 3_000\n                requestMethod = "GET"\n                setRequestProperty("User-Agent", "Bichen-Android")\n            }\n            try {\n                if (connection.responseCode !in 200..299) error("HTTP ${connection.responseCode}")\n                val json = JSONObject(connection.inputStream.bufferedReader().use { it.readText() })\n                if (!json.optBoolean("success", true)) error("WAN lookup failed")\n                Triple(\n                    json.optString("ip", "—").ifBlank { "—" },\n                    json.optString("country_code", ""),\n                    json.optString("region", "—").ifBlank { "—" },\n                )\n            } finally {\n                connection.disconnect()\n            }\n        }.getOrNull()\n        if (fresh != null) {\n            wanCache = fresh\n            wanCacheAt = now\n        }\n        return fresh ?: wanCache\n    }\n'''
          s = s[:tail_start] + new_tail + s[class_end:]
          p.write_text(s)

          # ---- Dashboard repository: real site latency and per-provider refresh ----
          p = Path('android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyDashboardRepository.kt')
          s = p.read_text()
          if 'import android.os.SystemClock' not in s:
              s = s.replace('import android.content.Context\n', 'import android.content.Context\nimport android.os.SystemClock\n', 1)
          if 'import java.net.HttpURLConnection' not in s:
              s = s.replace('import org.json.JSONObject\n', 'import org.json.JSONObject\nimport java.net.HttpURLConnection\nimport java.net.URL\n', 1)
          insert_at = s.index('    private fun remoteProviders')
          if 'suspend fun siteLatencies()' not in s:
              methods = '''    suspend fun siteLatencies(): Map<String, Long> = withContext(Dispatchers.IO) {\n        val sites = listOf(\n            "Baidu" to "https://www.baidu.com/",\n            "Cloudflare" to "https://cp.cloudflare.com/generate_204",\n            "Google" to "https://www.gstatic.com/generate_204",\n        )\n        coroutineScope {\n            sites.map { (name, url) -> async { name to measureSiteLatency(url) } }.awaitAll().toMap()\n        }\n    }\n\n    suspend fun refreshProvider(name: String): DashboardProviderUi? = withContext(Dispatchers.IO) {\n        try { api.updateProxyProvider(name) }\n        catch (cancel: CancellationException) { throw cancel }\n        catch (_: Exception) { }\n        remoteProviders(api.proxyProviders()).firstOrNull { it.name == name }\n    }\n\n    private fun measureSiteLatency(url: String): Long {\n        return try {\n            val started = SystemClock.elapsedRealtime()\n            val connection = (URL(url).openConnection() as HttpURLConnection).apply {\n                instanceFollowRedirects = true\n                connectTimeout = 3_000\n                readTimeout = 3_000\n                requestMethod = "GET"\n                setRequestProperty("User-Agent", "Bichen-Android")\n                setRequestProperty("Cache-Control", "no-cache")\n            }\n            try {\n                val code = connection.responseCode\n                if (code in 200..499) (SystemClock.elapsedRealtime() - started).coerceAtLeast(1L) else -1L\n            } finally {\n                runCatching { connection.inputStream?.close() }\n                connection.disconnect()\n            }\n        } catch (_: Exception) {\n            -1L\n        }\n    }\n\n'''
              s = s[:insert_at] + methods + s[insert_at:]
          p.write_text(s)

          # ---- Proxy workspace ----
          p = Path('android-app/app/src/main/java/io/github/xgl34222220/bichen/ReferenceProxyActivity.kt')
          s = p.read_text()
          imports = {
              'import android.content.Intent\n': 'import android.content.Intent\nimport android.graphics.BitmapFactory\n',
              'import androidx.compose.foundation.background\n': 'import androidx.compose.foundation.Canvas\nimport androidx.compose.foundation.Image\nimport androidx.compose.foundation.background\n',
              'import androidx.compose.ui.graphics.Brush\n': 'import androidx.compose.ui.graphics.Brush\nimport androidx.compose.ui.graphics.Path\nimport androidx.compose.ui.graphics.asImageBitmap\nimport androidx.compose.ui.graphics.drawscope.Stroke\n',
              'import androidx.compose.ui.platform.LocalContext\n': 'import androidx.compose.ui.layout.ContentScale\nimport androidx.compose.ui.platform.LocalContext\n',
              'import dev.chrisbanes.haze.rememberHazeState\n': 'import dev.chrisbanes.haze.hazeSource\nimport dev.chrisbanes.haze.rememberHazeState\nimport top.yukonga.miuix.kmp.blur.isRuntimeShaderSupported\nimport top.yukonga.miuix.kmp.blur.layerBackdrop\nimport top.yukonga.miuix.kmp.blur.rememberLayerBackdrop\n',
          }
          for old, new in imports.items():
              if new.splitlines()[0] not in s or old == 'import android.content.Intent\n':
                  if old in s and new not in s:
                      s = s.replace(old, new, 1)

          old_activity = '''class ReferenceProxyActivity : ComponentActivity() {\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        enableEdgeToEdge()\n        setContent { BichenTheme { RefProxyShell { finish() } } }\n    }\n}'''
          new_activity = '''class ReferenceProxyActivity : ComponentActivity() {\n    private var uiRevision by mutableIntStateOf(0)\n\n    override fun onCreate(savedInstanceState: Bundle?) {\n        super.onCreate(savedInstanceState)\n        enableEdgeToEdge()\n        setContent {\n            key(uiRevision) { BichenTheme { RefProxyShell { finish() } } }\n        }\n    }\n\n    override fun onResume() {\n        super.onResume()\n        uiRevision++\n    }\n}'''
          if old_activity in s:
              s = s.replace(old_activity, new_activity, 1)

          s = s.replace('Overview("策略"), Nodes("节点"), Subscriptions("订阅"), Connections("连接"), Rules("规则"), RuleSets("规则集")', 'Overview("节点"), Nodes("概览"), Subscriptions("订阅"), Connections("连接"), Rules("规则"), RuleSets("规则集")', 1)

          s = s.replace('''    val scope = rememberCoroutineScope()\n    val haze = rememberHazeState()\n''', '''    val scope = rememberCoroutineScope()\n    val haze = rememberHazeState()\n    val liquidBackdrop = rememberLayerBackdrop()\n    val liquid = isRuntimeShaderSupported()\n    val prefs = remember { context.getSharedPreferences("bichen", 0) }\n    val showPanelTab = prefs.getBoolean("showPanelTab", true)\n''', 1)

          s = s.replace('''    var providers by remember { mutableStateOf<List<DashboardProviderUi>>(emptyList()) }\n    val delays = remember { mutableStateMapOf<String, Long>() }\n''', '''    var providers by remember { mutableStateOf<List<DashboardProviderUi>>(emptyList()) }\n    var siteDelays by remember { mutableStateOf<Map<String, Long>>(emptyMap()) }\n    val delays = remember { mutableStateMapOf<String, Long>() }\n    var cpuPercent by remember { mutableFloatStateOf(0f) }\n    var lastProcessTicks by remember { mutableLongStateOf(0L) }\n    var lastSystemTicks by remember { mutableLongStateOf(0L) }\n''', 1)

          refresh_start = '    suspend fun refresh() {'
          refresh_end = '    fun toggle() {'
          new_refresh = '''    suspend fun refresh() {\n        try {\n            val next = repo.state()\n            val now = SystemClock.elapsedRealtime()\n            if (lastAt > 0L && now > lastAt && next.uploadTotal >= lastUp && next.downloadTotal >= lastDown) {\n                val elapsed = now - lastAt\n                upRate = ((next.uploadTotal - lastUp) * 1000L / elapsed).coerceAtLeast(0L)\n                downRate = ((next.downloadTotal - lastDown) * 1000L / elapsed).coerceAtLeast(0L)\n            }\n            next.groups.flatMap { it.nodes }.forEach { node ->\n                node.lastDelay?.takeIf { it > 0L }?.let { delays.putIfAbsent(node.name, it) }\n            }\n            val sampled = if (next.running) runCatching { inspector.sample() }.getOrDefault(runtime) else ProxyRuntimeSnapshot()\n            if (next.running && lastSystemTicks > 0L && sampled.systemTicks > lastSystemTicks && sampled.processTicks >= lastProcessTicks) {\n                val deltaProcess = sampled.processTicks - lastProcessTicks\n                val deltaSystem = sampled.systemTicks - lastSystemTicks\n                val cores = Runtime.getRuntime().availableProcessors().coerceAtLeast(1)\n                cpuPercent = ((deltaProcess.toDouble() / deltaSystem.toDouble()) * 100.0 * cores).toFloat().coerceIn(0f, 100f)\n            } else if (!next.running) {\n                cpuPercent = 0f\n            }\n            lastProcessTicks = sampled.processTicks\n            lastSystemTicks = sampled.systemTicks\n            runtime = sampled\n            providers = if (next.running) runCatching { repo.providers() }.getOrDefault(providers) else emptyList()\n            state = next\n            message = next.message\n            lastAt = now\n            lastUp = next.uploadTotal\n            lastDown = next.downloadTotal\n        } catch (cancel: CancellationException) {\n            throw cancel\n        } catch (error: Exception) {\n            message = error.message ?: "状态读取失败"\n        }\n    }\n\n'''
          s = replace_between(s, refresh_start, refresh_end, new_refresh)

          measure_start = '    fun quickDelay() {'
          measure_end = '    LaunchedEffect(Unit) {'
          new_measure = '''    fun measureSites() {\n        if (!state.running || testing) return\n        scope.launch {\n            testing = true\n            try {\n                siteDelays = repo.siteLatencies()\n                if (siteDelays.values.none { it > 0L }) message = "关键站点测速失败，请检查当前网络"\n            } catch (cancel: CancellationException) {\n                throw cancel\n            } catch (error: Exception) {\n                message = error.message ?: "测速失败"\n            } finally {\n                testing = false\n            }\n        }\n    }\n\n'''
          s = replace_between(s, measure_start, measure_end, new_measure)

          loop_marker = '''    LaunchedEffect(Unit) {\n        runCatching { repo.ensureIcons() }\n        refresh()\n        while (true) {\n            delay(2200)\n            refresh()\n        }\n    }\n\n'''
          if loop_marker in s:
              s = s.replace(loop_marker, loop_marker + '''    LaunchedEffect(state.running) {\n        if (!state.running) { siteDelays = emptyMap(); return@LaunchedEffect }\n        siteDelays = runCatching { repo.siteLatencies() }.getOrDefault(siteDelays)\n        while (true) {\n            delay(15_000)\n            siteDelays = runCatching { repo.siteLatencies() }.getOrDefault(siteDelays)\n        }\n    }\n\n''', 1)

          dock_start = s.index('    val dock = remember {')
          dock_end = s.index('\n\n    Box(Modifier.fillMaxSize()', dock_start)
          new_dock = '''    val dockPages = remember(showPanelTab) {\n        if (showPanelTab) listOf(RefProxyPage.Home, RefProxyPage.Panel, RefProxyPage.Tools, RefProxyPage.Settings)\n        else listOf(RefProxyPage.Home, RefProxyPage.Tools, RefProxyPage.Settings)\n    }\n    LaunchedEffect(showPanelTab) { if (!showPanelTab && page == RefProxyPage.Panel) page = RefProxyPage.Home }\n    val dock = remember(showPanelTab) {\n        dockPages.map { destination ->\n            when (destination) {\n                RefProxyPage.Home -> DockItem("首页", Icons.Rounded.Home, .94f)\n                RefProxyPage.Panel -> DockItem("面板", Icons.Rounded.Link, .96f)\n                RefProxyPage.Tools -> DockItem("工具", Icons.Rounded.GridView, .96f)\n                RefProxyPage.Settings -> DockItem("设置", Icons.Rounded.Settings, .94f)\n            }\n        }\n    }'''
          s = s[:dock_start] + new_dock + s[dock_end:]

          s = s.replace('''        Box(Modifier.fillMaxSize().padding(bottom = 88.dp)) {''', '''        Box(\n            Modifier.fillMaxSize()\n                .then(if (!liquid) Modifier.hazeSource(haze) else Modifier)\n                .then(if (liquid) Modifier.layerBackdrop(liquidBackdrop) else Modifier)\n                .padding(bottom = 88.dp),\n        ) {''', 1)

          s = s.replace('''                    delays = delays,\n                    upRate = upRate,''', '''                    siteDelays = siteDelays,\n                    upRate = upRate,''', 1)
          s = s.replace('''                    downRate = downRate,\n                    operation = operation,''', '''                    downRate = downRate,\n                    cpuPercent = cpuPercent,\n                    operation = operation,''', 1)
          s = s.replace('onDelay = ::quickDelay,', 'onDelay = ::measureSites,', 1)
          s = s.replace('''            selected = page.ordinal,\n            onSelect = { page = RefProxyPage.entries[it] },\n            hazeState = haze,\n            backdrop = null,''', '''            selected = dockPages.indexOf(page).coerceAtLeast(0),\n            onSelect = { page = dockPages[it] },\n            hazeState = haze,\n            backdrop = liquidBackdrop.takeIf { liquid },''', 1)

          home_start = s.index('@Composable\nprivate fun RefHome(')
          home_end = s.index('@Composable\nprivate fun RefActionText', home_start)
          new_home = r'''@Composable
private fun RefHome(
    state: ProxyComposeState,
    runtime: ProxyRuntimeSnapshot,
    providers: List<DashboardProviderUi>,
    siteDelays: Map<String, Long>,
    upRate: Long,
    downRate: Long,
    cpuPercent: Float,
    operation: String,
    message: String,
    testing: Boolean,
    onBack: () -> Unit,
    onRefresh: () -> Unit,
    onToggle: () -> Unit,
    onReload: () -> Unit,
    onRestart: () -> Unit,
    onDelay: () -> Unit,
    onWebUi: () -> Unit,
    onLog: () -> Unit,
) {
    val t = LocalBichenTokens.current
    val scheme = MaterialTheme.colorScheme
    val memory = runtime.rssBytes.takeIf { it > 0L } ?: state.memoryBytes

    LazyColumn(
        Modifier.fillMaxSize(),
        contentPadding = PaddingValues(horizontal = 16.dp, vertical = 8.dp),
        verticalArrangement = Arrangement.spacedBy(10.dp),
    ) {
        item {
            Row(
                Modifier.fillMaxWidth().statusBarsPadding().padding(top = 10.dp, bottom = 6.dp),
                verticalAlignment = Alignment.CenterVertically,
            ) {
                Text("代理", color = t.textPrimary, fontSize = 27.sp, lineHeight = 33.sp, fontWeight = FontWeight.Bold, modifier = Modifier.weight(1f))
                IconButton(onClick = onRefresh, modifier = Modifier.size(44.dp)) {
                    Icon(Icons.Rounded.Refresh, "刷新", tint = t.textSecondary, modifier = Modifier.size(20.dp))
                }
                IconButton(onClick = onBack, modifier = Modifier.size(44.dp)) {
                    Icon(Icons.Rounded.Close, "关闭", tint = t.textSecondary, modifier = Modifier.size(20.dp))
                }
            }
        }
        item {
            Surface(shape = RoundedCornerShape(26.dp), color = t.heroBackground, shadowElevation = 0.dp) {
                Column(Modifier.fillMaxWidth().padding(17.dp), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                    Row(verticalAlignment = Alignment.Top) {
                        Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(4.dp)) {
                            Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                Box(Modifier.size(9.dp).background(if (state.running) t.success else t.danger, CircleShape))
                                Text(if (state.running) "运行中" else "已停止", color = t.textPrimary, fontSize = 19.sp, fontWeight = FontWeight.Bold)
                                Text(if (state.running) refDuration(runtime.elapsedSeconds) else "等待启动", color = t.textSecondary, style = MaterialTheme.typography.labelMedium)
                            }
                            Text("${state.core} · ${state.mode}", color = t.textPrimary, style = MaterialTheme.typography.titleSmall)
                            Text(state.config, color = t.textSecondary, style = MaterialTheme.typography.bodySmall, maxLines = 2, overflow = TextOverflow.Ellipsis)
                        }
                        Box(
                            Modifier.size(58.dp).background(if (state.running) scheme.primary else t.controlBackground, CircleShape),
                            contentAlignment = Alignment.Center,
                        ) {
                            Icon(
                                if (state.running) Icons.Rounded.Check else Icons.Rounded.PowerSettingsNew,
                                null,
                                tint = if (state.running) Color.White else t.textMuted,
                                modifier = Modifier.size(31.dp),
                            )
                        }
                    }
                    HorizontalDivider(color = t.outline.copy(alpha = .75f))
                    Row(Modifier.fillMaxWidth()) {
                        RefActionText("重载", state.running && operation.isBlank(), onReload, Modifier.weight(1f), scheme.primary)
                        VerticalDivider(Modifier.height(32.dp), color = t.outline)
                        RefActionText(if (state.running) "停止" else "启动", operation.isBlank(), onToggle, Modifier.weight(1f), t.danger)
                        VerticalDivider(Modifier.height(32.dp), color = t.outline)
                        RefActionText("重启", state.running && operation.isBlank(), onRestart, Modifier.weight(1f), t.warning)
                    }
                }
            }
        }
        item {
            Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                RefSmallTool("WebUI", "Web 界面", Icons.Rounded.Language, onWebUi, Modifier.weight(1f))
                RefSmallTool("日志", "查看", Icons.Rounded.Article, onLog, Modifier.weight(1f))
            }
        }
        item {
            RefLatencyPanel(
                baidu = siteDelays["Baidu"],
                cloudflare = siteDelays["Cloudflare"],
                google = siteDelays["Google"],
                testing = testing,
                onClick = onDelay,
            )
        }
        item {
            Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                RefNetworkIdentityCard(runtime, state.connections.size, Modifier.weight(1f))
                RefSpeedCard(upRate, downRate, Modifier.weight(1f))
            }
        }
        item {
            Row(horizontalArrangement = Arrangement.spacedBy(10.dp)) {
                RefSubscriptionCompact(providers, Modifier.weight(1f))
                RefResourceCard(memory, cpuPercent, runtime.pid, Modifier.weight(1f))
            }
        }
        if (operation.isNotBlank() || message.isNotBlank()) {
            item { Text(operation.ifBlank { message }, color = t.textSecondary, style = MaterialTheme.typography.bodySmall, modifier = Modifier.padding(horizontal = 4.dp, vertical = 2.dp)) }
        }
    }
}

@Composable
private fun RefLatencyPanel(baidu: Long?, cloudflare: Long?, google: Long?, testing: Boolean, onClick: () -> Unit) {
    val t = LocalBichenTokens.current
    Surface(onClick = onClick, enabled = !testing, shape = RoundedCornerShape(18.dp), color = t.cardBackground, shadowElevation = 0.dp) {
        Column(Modifier.fillMaxWidth().padding(horizontal = 14.dp, vertical = 13.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
            Row(verticalAlignment = Alignment.CenterVertically) {
                Text("延迟", color = t.textPrimary, style = MaterialTheme.typography.titleMedium, modifier = Modifier.weight(1f))
                Text(if (testing) "测试中" else "全部测速", color = MaterialTheme.colorScheme.primary, style = MaterialTheme.typography.labelMedium)
                Spacer(Modifier.width(6.dp))
                if (testing) CircularProgressIndicator(Modifier.size(17.dp), strokeWidth = 2.dp)
                else Icon(Icons.Rounded.Refresh, "测速", tint = MaterialTheme.colorScheme.primary, modifier = Modifier.size(18.dp))
            }
