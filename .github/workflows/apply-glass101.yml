name: Integrate same-window glass test101
on:
  push:
    branches: [feature/hetu-rebrand-root-app]
    paths: [tools/apply_glass101.py, .github/workflows/apply-glass101.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI-only edits and verify unchanged runtime
        run: |
          set -euo pipefail
          python3 tools/apply_glass101.py
          python3 tools/test_ui_audit_invariants.py
          git diff --check
          git restore .github/workflows/build-hetu.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-app
          git commit -m 'ui: same-window frosted menu and unified sunken material (test.101)'
          git push origin HEAD:feature/hetu-rebrand-root-app
          mkdir -p export
          git archive HEAD | gzip > export/source.tar.gz
          git rev-parse HEAD > export/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Hetu101-source
          path: export/
          retention-days: 2
          if-no-files-found: error
