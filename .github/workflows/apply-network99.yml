name: Integrate optional IPv6 NAT test99
on:
  push:
    branches: [feature/hetu-rebrand-root-app]
    paths: ['maintenance/apply-network99.py', 'maintenance/network99-kernel.txt', 'maintenance/test_optional_ipv6_nat.py', 'maintenance/test99-optional-ipv6-nat.md', '.github/workflows/apply-network99.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded network regression patch
        shell: bash
        run: |
          set -euo pipefail
          cp maintenance/test_optional_ipv6_nat.py tools/test_optional_ipv6_nat.py
          cp maintenance/test99-optional-ipv6-nat.md docs/test99-optional-ipv6-nat.md
          python3 maintenance/apply-network99.py
          sh -n android-app/app/src/main/assets/hetu-root.sh
          python3 tools/test_optional_ipv6_nat.py
          python3 tools/test_network_integrity.py
          python3 tools/test_ui_audit_invariants.py
          git diff --check
          test -z "$(git diff --name-only -- .github)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-app tests tools docs
          git commit -m 'fix: optional IPv6 NAT DNS handling and faster private core discovery (test.99)'
          git push origin HEAD:feature/hetu-rebrand-root-app
