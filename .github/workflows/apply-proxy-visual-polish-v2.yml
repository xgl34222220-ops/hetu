name: Apply proxy visual polish v2

on:
  push:
    branches: ['feature/compose-luoshu-ui']

permissions:
  contents: write
  actions: read

jobs:
  polish-and-build:
    if: github.event.head_commit.message == 'Apply proxy visual polish v2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply premium panel polish
        run: python3 scripts/polish_panel_premium_test42.py

      - name: Commit premium panel polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-app/app/src/main/java/io/github/xgl34222220/bichen/ReferenceProxyActivity.kt
          if ! git diff --cached --quiet; then
            git commit -m 'Polish panel premium visual system'
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false
      - name: Reuse verified Mihomo runtime
        uses: actions/download-artifact@v4
        with:
          name: Bichen-0.4.0-test.35-Fullscreen-Strategy-Page
          path: previous-artifact
          github-token: ${{ github.token }}
          repository: xgl34222220-ops/pichen
          run-id: 35170170620
      - name: Restore native runtime
        shell: bash
        run: |
          set -euo pipefail
          PREV=$(find previous-artifact -name '*.apk' -type f | head -n 1)
          test -n "$PREV"
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a android-app/app/src/main/jniLibs/x86_64
          mkdir -p android-app/app/src/main/assets/mihomo-root/arm64-v8a android-app/app/src/main/assets/mihomo-root/x86_64
          unzip -p "$PREV" lib/arm64-v8a/libbichen_core.so > android-app/app/src/main/jniLibs/arm64-v8a/libbichen_core.so
          unzip -p "$PREV" lib/x86_64/libbichen_core.so > android-app/app/src/main/jniLibs/x86_64/libbichen_core.so
          unzip -p "$PREV" assets/mihomo-root/arm64-v8a/mihomo > android-app/app/src/main/assets/mihomo-root/arm64-v8a/mihomo
          unzip -p "$PREV" assets/mihomo-root/x86_64/mihomo > android-app/app/src/main/assets/mihomo-root/x86_64/mihomo
          unzip -p "$PREV" assets/MIHOMO-LICENSE > android-app/app/src/main/assets/MIHOMO-LICENSE
          unzip -p "$PREV" assets/mihomo-revision.txt > android-app/app/src/main/assets/mihomo-revision.txt
      - name: Build APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK and premium panel invariants
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          UI=android-app/app/src/main/java/io/github/xgl34222220/bichen/ReferenceProxyActivity.kt
          DOCK=android-app/app/src/main/java/io/github/xgl34222220/bichen/ui/BichenGlassDock.kt
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libbichen_core.so'
          unzip -l "$APK" | grep -q 'assets/mihomo-root/arm64-v8a/mihomo'
          python3 - <<'PY'
          from pathlib import Path
          s = Path('android-app/app/src/main/java/io/github/xgl34222220/bichen/ReferenceProxyActivity.kt').read_text()
          a = s.index('private fun RefPanelGlassHeader(')
          b = s.index('private fun RefPanelHeaderAction(', a)
          header = s[a:b]
          assert 'Modifier.background(shellBrush)' not in header
          assert '.shadow(7.dp, shape' not in header
          assert 'RefPanelTabs(' in header
          detail = s[s.index('private fun RefDetailNodeCard('):s.index('private fun refNodeProtocol(')]
          assert 'if (active) 1.8.dp else .8.dp' in detail
          assert 'Color(0xFFEFF6FF)' in detail
          assert 'Color(0xFF2563EB)' in detail
          assert 'Modifier.size(26.dp).clip(CircleShape)' not in detail
          assert 'Brush.verticalGradient(listOf(Color.White, Color(0xFFFAFBFD)))' in s
          PY
          grep -q 'private fun RefGroupDetailPage' "$UI"
          grep -q 'if (!panelDetailVisible)' "$UI"
          grep -q 'Shared MIUIX floating dock' "$DOCK"
          grep -q 'homeSnapshotCache' android-app/app/src/main/java/io/github/xgl34222220/bichen/BichenMainActivity.kt
      - uses: actions/upload-artifact@v4
        with:
          name: Bichen-0.4.0-test.42-Premium-Panel-Visual-System
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
