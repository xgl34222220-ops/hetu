name: Apply proxy visual polish v2

on:
  push:
    branches: ['feature/compose-luoshu-ui']

permissions:
  contents: write
  actions: read

jobs:
  polish-and-build:
    if: github.event.head_commit.message == 'Apply proxy visual polish v2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply test47 native dashboard polish
        run: |
          python3 scripts/run_native_dashboard_test47.py
          python3 scripts/fix_test47_scoped_terminal_and_imports.py

      - name: Commit test47 polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/ReferenceProxyActivity.kt \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxySubscriptionActivity.kt
          if ! git diff --cached --quiet; then
            git commit -m 'Polish Bichen dashboard lifecycle and YAML editor'
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false
      - name: Reuse verified Mihomo runtime
        uses: actions/download-artifact@v4
        with:
          name: Bichen-0.4.0-test.35-Fullscreen-Strategy-Page
          path: previous-artifact
          github-token: ${{ github.token }}
          repository: xgl34222220-ops/pichen
          run-id: 35170170620
      - name: Restore native runtime
        shell: bash
        run: |
          set -euo pipefail
          PREV=$(find previous-artifact -name '*.apk' -type f | head -n 1)
          test -n "$PREV"
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a android-app/app/src/main/jniLibs/x86_64
          mkdir -p android-app/app/src/main/assets/mihomo-root/arm64-v8a android-app/app/src/main/assets/mihomo-root/x86_64
          unzip -p "$PREV" lib/arm64-v8a/libbichen_core.so > android-app/app/src/main/jniLibs/arm64-v8a/libbichen_core.so
          unzip -p "$PREV" lib/x86_64/libbichen_core.so > android-app/app/src/main/jniLibs/x86_64/libbichen_core.so
          unzip -p "$PREV" assets/mihomo-root/arm64-v8a/mihomo > android-app/app/src/main/assets/mihomo-root/arm64-v8a/mihomo
          unzip -p "$PREV" assets/mihomo-root/x86_64/mihomo > android-app/app/src/main/assets/mihomo-root/x86_64/mihomo
          unzip -p "$PREV" assets/MIHOMO-LICENSE > android-app/app/src/main/assets/MIHOMO-LICENSE
          unzip -p "$PREV" assets/mihomo-revision.txt > android-app/app/src/main/assets/mihomo-revision.txt
      - name: Build APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK and test47 invariants
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          UI=android-app/app/src/main/java/io/github/xgl34222220/bichen/ReferenceProxyActivity.kt
          SUB=android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxySubscriptionActivity.kt
          DOCK=android-app/app/src/main/java/io/github/xgl34222220/bichen/ui/BichenGlassDock.kt
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libbichen_core.so'
          unzip -l "$APK" | grep -q 'assets/mihomo-root/arm64-v8a/mihomo'

          grep -q '"辟尘"' "$UI"
          ! grep -q '"BoxProxy"' "$UI"
          grep -q '"Mihomo Core"' "$UI"
          grep -q 'latencyAutoRefreshSeconds' "$UI"
          grep -q 'measureSitesInternal(reportError = false)' "$UI"
          grep -q 'homeLatencyRefreshRotation' "$UI"
          grep -q 'danger: Boolean = false' "$UI"
          grep -q 'stopPulseAlpha' "$UI"
          grep -q 'modifier.height(66.dp)' "$UI"
          grep -q 'Modifier.fillMaxWidth().height(4.dp)' "$UI"
          grep -q 'Modifier.width(62.dp).height(22.dp)' "$UI"
          grep -q 'fontFeatureSettings = "tnum"' "$UI"
          grep -q 'containerColor = if (terminal) Color(0xFF0B1220)' "$UI"
          ! awk '/private fun RefChoiceBottomSheet\(/,/private fun RefInfoBottomSheet\(/' "$UI" | grep -q 'terminal'

          grep -q 'DialogProperties(usePlatformDefaultWidth = false)' "$SUB"
          grep -q 'import androidx.compose.foundation.BorderStroke' "$SUB"
          grep -q 'import androidx.compose.ui.draw.shadow' "$SUB"
          grep -q 'lineHeight = 20.sp' "$SUB"
          grep -q 'navigationBarsPadding().padding(horizontal = 16.dp, vertical = 12.dp)' "$SUB"

          test "$(git rev-parse HEAD:$DOCK)" = '7efba3c815e6429fcc35df87dc91f5be968111c6'
      - uses: actions/upload-artifact@v4
        with:
          name: Bichen-0.4.0-test.47-Bichen-Native-Dashboard
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
