name: Apply reference video UI

on:
  push:
    branches: ['feature/compose-luoshu-ui']

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply reference video UI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compose-luoshu-ui
          fetch-depth: 0

      - name: Apply video-reference visual language
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_between(text, start_marker, end_marker, replacement, label, start_at=0):
              start = text.find(start_marker, start_at)
              if start < 0:
                  raise SystemExit(f'missing start: {label}')
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f'missing end: {label}')
              return text[:start] + replacement + text[end:]

          # Main ad-block UI: plain warm canvas, compact status card, list-like tools/apps.
          p = Path('android-app/app/src/main/java/io/github/xgl34222220/bichen/CompactMainActivity.kt')
          s = p.read_text()

          backdrop = '''@Composable
          private fun CompactBackdrop(dark: Boolean) {
              val tokens = LocalBichenTokens.current
              Box(Modifier.fillMaxSize().background(tokens.pageBackground))
          }

          '''
          s = replace_between(
              s,
              '@Composable\nprivate fun CompactBackdrop',
              '@Composable\nprivate fun CompactTopBar',
              backdrop.replace('          ', ''),
              'CompactBackdrop',
          )

          home_start = s.index('private fun CompactHomePage')
          hero_start = s.index('        item("hero") {', home_start)
          metrics_start = s.index('        item("metrics") {', hero_start)
          hero = '''        item("hero") {
              Surface(
                  shape = RoundedCornerShape(18.dp),
                  color = if (active) tokens.selectionBackground else tokens.cardBackground,
                  shadowElevation = 0.dp,
              ) {
                  Column(
                      Modifier.fillMaxWidth().padding(18.dp),
                      verticalArrangement = Arrangement.spacedBy(14.dp),
                  ) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(3.dp)) {
                              Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(7.dp)) {
                                  Box(
                                      Modifier.size(8.dp).background(if (active) tokens.success else tokens.warning, CircleShape),
                                  )
                                  Text(
                                      if (active) "运行中" else "未开启",
                                      color = tokens.textPrimary,
                                      fontSize = 20.sp,
                                      lineHeight = 26.sp,
                                      fontWeight = FontWeight.Bold,
                                  )
                              }
                              Text(
                                  if (vpnMode) "应用保护 · DNS 去广告" else "模块保护 · hosts 过滤",
                                  color = tokens.textSecondary,
                                  style = MaterialTheme.typography.bodySmall,
                              )
                              Text(
                                  "辟尘 ${snapshot.version}",
                                  color = tokens.textSecondary,
                                  style = MaterialTheme.typography.labelSmall,
                              )
                          }
                          Icon(
                              if (active) Icons.Rounded.CheckCircle else Icons.Rounded.Security,
                              contentDescription = null,
                              tint = scheme.primary.copy(alpha = if (active) .72f else .55f),
                              modifier = Modifier.size(58.dp),
                          )
                      }
                      HorizontalDivider(color = tokens.outline)
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          Surface(
                              onClick = { showModePicker = true },
                              modifier = Modifier.weight(1f).heightIn(min = 46.dp),
                              shape = RoundedCornerShape(12.dp),
                              color = tokens.cardBackground,
                          ) {
                              Row(
                                  Modifier.fillMaxSize().padding(horizontal = 12.dp),
                                  verticalAlignment = Alignment.CenterVertically,
                              ) {
                                  Icon(
                                      if (vpnMode) Icons.Rounded.QueryStats else Icons.Rounded.Extension,
                                      null,
                                      tint = scheme.primary,
                                      modifier = Modifier.size(18.dp),
                                  )
                                  Spacer(Modifier.width(7.dp))
                                  Text(
                                      if (vpnMode) "应用保护" else "模块保护",
                                      color = tokens.textPrimary,
                                      style = MaterialTheme.typography.labelLarge,
                                      modifier = Modifier.weight(1f),
                                  )
                                  Icon(Icons.Rounded.UnfoldMore, null, tint = tokens.textSecondary, modifier = Modifier.size(17.dp))
                              }
                          }
                          val starting = vpnMode && snapshot.vpnWanted && !snapshot.vpnRunning
                          Button(
                              onClick = ::toggleProtection,
                              enabled = !actionBusy && !starting,
                              modifier = Modifier.weight(1f).heightIn(min = 46.dp),
                              shape = RoundedCornerShape(12.dp),
                          ) {
                              if (actionBusy || starting) {
                                  CircularProgressIndicator(
                                      Modifier.size(17.dp),
                                      strokeWidth = 2.dp,
                                      color = MaterialTheme.colorScheme.onPrimary,
                                  )
                              } else {
                                  Icon(if (active) Icons.Rounded.Pause else Icons.Rounded.PowerSettingsNew, null, Modifier.size(18.dp))
                              }
                              Spacer(Modifier.width(6.dp))
                              Text(when {
                                  starting -> "开启中"
                                  actionBusy -> "处理中"
                                  active -> "暂停"
                                  else -> "开启"
                              })
                          }
                      }
                  }
              }
          }

'''
          s = s[:hero_start] + hero + s[metrics_start:]

          # Compact the quick-action tile to the reference app's flatter utility row language.
          action_start = s.index('@Composable\nprivate fun CompactActionTile')
          action_end = s.index('@Composable\nprivate fun CompactStatusBlock', action_start)
          action = '''@Composable
private fun CompactActionTile(
    title: String,
    subtitle: String,
    icon: ImageVector,
    modifier: Modifier = Modifier,
    onClick: () -> Unit,
) {
    val tokens = LocalBichenTokens.current
    Surface(
        onClick = onClick,
        modifier = modifier.heightIn(min = 82.dp),
        shape = RoundedCornerShape(14.dp),
        color = tokens.cardBackground,
        shadowElevation = 0.dp,
    ) {
        Column(Modifier.padding(12.dp), verticalArrangement = Arrangement.SpaceBetween) {
            Icon(icon, null, tint = MaterialTheme.colorScheme.primary, modifier = Modifier.size(20.dp))
            Column(verticalArrangement = Arrangement.spacedBy(1.dp)) {
                Text(title, color = tokens.textPrimary, style = MaterialTheme.typography.titleSmall)
                Text(subtitle, color = tokens.textSecondary, style = MaterialTheme.typography.labelSmall, maxLines = 1, overflow = TextOverflow.Ellipsis)
            }
        }
    }
}

'''
          s = s[:action_start] + action + s[action_end:]

          apps_start = s.index('private fun CompactAppsPage')
          apps_end = s.index('private fun CompactRulesPage', apps_start)
          apps = s[apps_start:apps_end]
          apps = apps.replace(
              'color = if (checked) tokens.selectionBackground else Color.Transparent,',
              'color = if (checked) tokens.selectionBackground else tokens.cardBackground,',
              1,
          )
          apps = apps.replace('Row(Modifier.padding(18.dp), verticalAlignment = Alignment.CenterVertically)',
                              'Row(Modifier.padding(horizontal = 12.dp, vertical = 10.dp), verticalAlignment = Alignment.CenterVertically)', 1)
          apps = apps.replace('modifier = Modifier.size(44.dp).clip(RoundedCornerShape(13.dp))',
                              'modifier = Modifier.size(40.dp).clip(RoundedCornerShape(11.dp))', 1)
          apps = apps.replace('modifier = Modifier.size(44.dp))', 'modifier = Modifier.size(40.dp))', 1)
          s = s[:apps_start] + apps + s[apps_end:]
          p.write_text(s)

          # Proxy UI: match reference dashboard/panel styling and remove the remaining nested Surface
          # composition that caused the white rectangular artifacts on some OEM renderers.
          p = Path('android-app/app/src/main/java/io/github/xgl34222220/bichen/LuoShuProxyV3Activity.kt')
          s = p.read_text()

          v3home = s.index('private fun V3Home')
          panel = s.index('private fun V3Panel', v3home)
          home = s[v3home:panel]
          home = home.replace('Surface(shape = RoundedCornerShape(24.dp), color = t.cardBackground, shadowElevation = 0.dp)',
                              'Surface(shape = RoundedCornerShape(18.dp), color = if (state.running) t.selectionBackground else t.cardBackground, shadowElevation = 0.dp)', 1)
          home = home.replace('.background(Brush.linearGradient(listOf(lerp(t.cardBackground, scheme.primaryContainer, .38f), t.cardBackground)))\n                        .padding(22.dp)',
                              '.padding(18.dp)', 1)
          home = home.replace('verticalArrangement = Arrangement.spacedBy(18.dp)',
                              'verticalArrangement = Arrangement.spacedBy(14.dp)', 1)
          home = home.replace('fontSize = 24.sp, lineHeight = 32.sp', 'fontSize = 20.sp, lineHeight = 27.sp', 1)
          home = home.replace('shape = RoundedCornerShape(20.dp)', 'shape = RoundedCornerShape(16.dp)', 1)
          s = s[:v3home] + home + s[panel:]

          group_start = s.index('@Composable\nprivate fun V3GroupCard')
          group_end = s.index('@Composable\nprivate fun V3NodeGrid', group_start)
          group = '''@Composable
private fun V3GroupCard(
    group: ProxyGroupUi,
    selected: String,
    expanded: Boolean,
    delay: Long?,
    measured: Int,
    testing: Boolean,
    onExpand: () -> Unit,
    onDelay: () -> Unit,
    modifier: Modifier,
) {
    val t = LocalBichenTokens.current
    val fill = if (expanded) t.selectionBackground else t.cardBackground
    Column(
        modifier
            .background(fill, RoundedCornerShape(14.dp))
            .clickable(onClick = onExpand)
            .padding(12.dp),
        verticalArrangement = Arrangement.spacedBy(8.dp),
    ) {
        Row(verticalAlignment = Alignment.CenterVertically) {
            V3GroupIcon(group, 30.dp)
            Spacer(Modifier.width(8.dp))
            Column(Modifier.weight(1f)) {
                Text(group.name, color = t.textPrimary, style = MaterialTheme.typography.titleSmall, maxLines = 1, overflow = TextOverflow.Ellipsis)
                Text("${group.type} · $measured/${group.nodes.size}", color = t.textSecondary, style = MaterialTheme.typography.labelSmall)
            }
        }
        Row(verticalAlignment = Alignment.CenterVertically) {
            Text(selected.ifBlank { "未选择" }, color = t.textSecondary, style = MaterialTheme.typography.bodySmall, maxLines = 1, overflow = TextOverflow.Ellipsis, modifier = Modifier.weight(1f))
            V3Delay(delay, testing, onDelay)
        }
    }
}

'''
          s = s[:group_start] + group + s[group_end:]

          node_start = s.index('@Composable\nprivate fun V3NodeCell')
          node_end = s.index('@Composable\nprivate fun V3Delay', node_start)
          node = '''@Composable
private fun V3NodeCell(node: ProxyNodeUi, selected: Boolean, delay: Long?, testing: Boolean, onSelect: () -> Unit, onDelay: () -> Unit, modifier: Modifier) {
    val t = LocalBichenTokens.current
    val scheme = MaterialTheme.colorScheme
    val fill = if (selected) t.selectionBackground else t.cardBackground
    Row(
        modifier
            .heightIn(min = 58.dp)
            .background(fill, RoundedCornerShape(12.dp))
            .clickable(onClick = onSelect)
            .padding(start = 10.dp, end = 4.dp, top = 7.dp, bottom = 7.dp),
        verticalAlignment = Alignment.CenterVertically,
    ) {
        if (selected) {
            Icon(Icons.Rounded.CheckCircle, "已选择", tint = scheme.primary, modifier = Modifier.size(16.dp))
            Spacer(Modifier.width(5.dp))
        }
        Column(Modifier.weight(1f)) {
            Text(node.name, color = t.textPrimary, style = MaterialTheme.typography.bodyMedium, maxLines = 2, overflow = TextOverflow.Ellipsis)
            Text(listOf(node.type, if (node.udp) "UDP" else "").filter { it.isNotBlank() }.joinToString(" · "), color = t.textSecondary, style = MaterialTheme.typography.labelSmall)
        }
        V3Delay(delay, testing, onDelay)
    }
}

'''
          s = s[:node_start] + node + s[node_end:]

          # Make panel tabs and cards tighter, closer to the compact six-chip row in the video.
          s = s.replace('Modifier.weight(1f).height(44.dp).clip(RoundedCornerShape(14.dp))',
                        'Modifier.weight(1f).height(38.dp).clip(RoundedCornerShape(11.dp))', 1)
          s = s.replace('fontSize = 12.sp, fontWeight = if (active) FontWeight.Bold else FontWeight.Medium',
                        'fontSize = 11.sp, fontWeight = if (active) FontWeight.SemiBold else FontWeight.Medium', 1)

          # Flatten reusable proxy cards and shortcuts.
          s = s.replace('Surface(shape = RoundedCornerShape(20.dp), color = LocalBichenTokens.current.cardBackground, shadowElevation = 0.dp)',
                        'Surface(shape = RoundedCornerShape(16.dp), color = LocalBichenTokens.current.cardBackground, shadowElevation = 0.dp)', 2)
          shortcut_start = s.index('@Composable\nprivate fun V3Shortcut')
          shortcut_end = s.index('@Composable\nprivate fun V3IconBox', shortcut_start)
          shortcut = '''@Composable
private fun V3Shortcut(title: String, subtitle: String, icon: ImageVector, onClick: () -> Unit, modifier: Modifier) {
    val t = LocalBichenTokens.current
    Surface(onClick = onClick, modifier = modifier, shape = RoundedCornerShape(14.dp), color = t.cardBackground, shadowElevation = 0.dp) {
        Row(Modifier.padding(12.dp), verticalAlignment = Alignment.CenterVertically) {
            V3IconBox(icon, 36.dp)
            Spacer(Modifier.width(9.dp))
            Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(2.dp)) {
                Text(title, color = t.textPrimary, style = MaterialTheme.typography.titleSmall, maxLines = 1, overflow = TextOverflow.Ellipsis)
                Text(subtitle, color = t.textSecondary, style = MaterialTheme.typography.labelSmall, maxLines = 1, overflow = TextOverflow.Ellipsis)
            }
        }
    }
}

'''
          s = s[:shortcut_start] + shortcut + s[shortcut_end:]

          # Overview loses the decorative gradient and becomes a flat dashboard surface.
          overview_start = s.index('private fun V3Overview')
          provider_start = s.index('private fun V3ProviderList', overview_start)
          overview = s[overview_start:provider_start]
          overview = overview.replace('Surface(shape = RoundedCornerShape(24.dp), color = t.cardBackground, shadowElevation = 0.dp)',
                                      'Surface(shape = RoundedCornerShape(16.dp), color = t.cardBackground, shadowElevation = 0.dp)', 1)
          overview = overview.replace('Modifier.fillMaxWidth().background(Brush.linearGradient(listOf(lerp(t.cardBackground, scheme.primaryContainer, .32f), t.cardBackground))).padding(20.dp)',
                                      'Modifier.fillMaxWidth().padding(16.dp)', 1)
          s = s[:overview_start] + overview + s[provider_start:]

          p.write_text(s)
          PY

      - name: Commit redesigned UI
        shell: bash
        run: |
          rm -f .github/workflows/apply-reference-video-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Match Bichen UI to reference video"
          git push origin HEAD:feature/compose-luoshu-ui
