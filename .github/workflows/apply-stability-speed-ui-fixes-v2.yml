name: Apply stability speed UI fixes v2

on:
  push:
    branches: ['feature/compose-luoshu-ui']

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply stability speed UI fixes v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compose-luoshu-ui
          fetch-depth: 0
      - name: Apply fixes
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/bichen_patch.py
          python3 /tmp/bichen_patch.py
      - name: Commit fixes
        shell: bash
        run: |
          rm -f .github/workflows/apply-stability-speed-ui-fixes.yml .github/workflows/recover-stability-speed-ui-fixes.yml .github/workflows/apply-stability-speed-ui-fixes-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix protection startup app preload rules and latency feedback"
          git push origin HEAD:feature/compose-luoshu-ui
