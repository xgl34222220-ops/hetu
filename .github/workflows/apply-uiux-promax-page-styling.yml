name: Apply UI UX Pro Max page styling

on:
  push:
    branches:
      - feature/compose-luoshu-ui

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply UI UX Pro Max page styling'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compose-luoshu-ui
          fetch-depth: 0

      - name: Apply page-specific visual hierarchy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          compact = Path('android-app/app/src/main/java/io/github/xgl34222220/bichen/CompactMainActivity.kt')
          text = compact.read_text()
          original = text

          # Flat utility surfaces: hierarchy comes from tone, not a shadow on every row.
          text = text.replace('shadowElevation = 1.dp', 'shadowElevation = 0.dp')

          # Home protection hero keeps the strongest emphasis but uses a restrained selected tone.
          old_hero = 'Surface(shape = RoundedCornerShape(28.dp), color = tokens.cardBackground, shadowElevation = 2.dp) {'
          new_hero = 'Surface(shape = RoundedCornerShape(24.dp), color = tokens.selectionBackground, shadowElevation = 0.dp) {'
          if old_hero not in text:
              raise SystemExit('Compact home hero pattern not found')
          text = text.replace(old_hero, new_hero, 1)

          # Rules summary is important, but it should not compete with the home hero.
          if old_hero in text:
              text = text.replace(old_hero, 'Surface(shape = RoundedCornerShape(22.dp), color = tokens.cardBackground, shadowElevation = 0.dp) {', 1)

          # Dense list/shortcut cards use a tighter 18dp shape.
          text = text.replace(
              'shape = RoundedCornerShape(24.dp), color = tokens.cardBackground, shadowElevation = 0.dp',
              'shape = RoundedCornerShape(18.dp), color = tokens.cardBackground, shadowElevation = 0.dp',
          )
          text = re.sub(
              r'shape = RoundedCornerShape\(24\.dp\),(\s*\n\s*color = tokens\.cardBackground,\s*\n\s*shadowElevation = 0\.dp,)',
              r'shape = RoundedCornerShape(18.dp),\1',
              text,
          )

          # Header controls are controls, not content cards.
          text = text.replace(
              'color = tokens.cardBackground,\n            contentColor = MaterialTheme.colorScheme.primary,\n            shadowElevation = 0.dp,',
              'color = tokens.controlBackground,\n            contentColor = MaterialTheme.colorScheme.primary,\n            shadowElevation = 0.dp,',
              1,
          )
          text = text.replace('horizontalArrangement = Arrangement.spacedBy(2.dp), content = actions)', 'horizontalArrangement = Arrangement.spacedBy(4.dp), content = actions)')

          if text == original:
              raise SystemExit('CompactMainActivity produced no visual changes')
          compact.write_text(text)

          v3 = Path('android-app/app/src/main/java/io/github/xgl34222220/bichen/LuoShuProxyV3Activity.kt')
          text = v3.read_text()
          original = text

          text = text.replace('* LuoShu V3 proxy workspace.', '* Bichen V3 proxy workspace.')
          text = text.replace('shadowElevation = if (selected) 1.dp else 0.dp', 'shadowElevation = 0.dp')
          text = text.replace('shadowElevation = 2.dp', 'shadowElevation = 0.dp')
          text = text.replace('shadowElevation = 1.dp', 'shadowElevation = 0.dp')

          # Selected group/node states use the shared semantic selection token.
          text = text.replace(
              'val fill = if (expanded) lerp(t.cardBackground, scheme.primaryContainer, .52f) else t.cardBackground',
              'val fill = if (expanded) t.selectionBackground else t.cardBackground',
          )
          text = text.replace(
              'val fill = if (selected) lerp(t.cardBackground, scheme.primaryContainer, .60f) else t.cardBackground',
              'val fill = if (selected) t.selectionBackground else t.cardBackground',
          )
          text = text.replace(
              'Surface(modifier = modifier, shape = RoundedCornerShape(20.dp), color = fill, shadowElevation = 0.dp)',
              'Surface(modifier = modifier, shape = RoundedCornerShape(18.dp), color = fill, shadowElevation = 0.dp)',
          )
          text = text.replace(
              'Surface(modifier = modifier.heightIn(min = 64.dp), shape = RoundedCornerShape(17.dp), color = fill, shadowElevation = 0.dp)',
              'Surface(modifier = modifier.heightIn(min = 64.dp), shape = RoundedCornerShape(16.dp), color = fill, shadowElevation = 0.dp)',
          )

          # Shared panel content is denser than the home hero.
          text = text.replace(
              'shape = RoundedCornerShape(24.dp), color = t.cardBackground, shadowElevation = 0.dp',
              'shape = RoundedCornerShape(20.dp), color = t.cardBackground, shadowElevation = 0.dp',
          )
          text = text.replace(
              'shape = RoundedCornerShape(24.dp), color = LocalBichenTokens.current.cardBackground, shadowElevation = 0.dp',
              'shape = RoundedCornerShape(20.dp), color = LocalBichenTokens.current.cardBackground, shadowElevation = 0.dp',
          )
          text = text.replace(
              'shape = RoundedCornerShape(28.dp), color = t.cardBackground, shadowElevation = 0.dp',
              'shape = RoundedCornerShape(24.dp), color = t.cardBackground, shadowElevation = 0.dp',
          )

          if text == original:
              raise SystemExit('LuoShuProxyV3Activity produced no visual changes')
          v3.write_text(text)
          PY

          rm -f .github/workflows/apply-uiux-promax-page-styling.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine Bichen pages with product-specific UI hierarchy"
          git push origin HEAD:feature/compose-luoshu-ui
