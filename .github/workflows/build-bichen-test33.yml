name: Build Bichen test.33 chained adblock
on:
  issues:
    types: [opened]
permissions:
  contents: write
  actions: read
jobs:
  build:
    if: github.event.issue.title == '[BUILD] Bichen 0.4.0-test.33'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout frozen test.33 branch
        uses: actions/checkout@v4
        with:
          ref: release/bichen-0.4.0-test.33
          fetch-depth: 0
      - name: Apply and audit chained adblock
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_test33_proxy_adblock_chain.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android-app/app/src/main/java/io/github/xgl34222220/bichen/MihomoStartupConfig.java')
          text = path.read_text(encoding='utf-8')
          text = text.replace('Pattern.compile("^rule-providers\\s*:(.*)$")', 'Pattern.compile("^rule-providers\\\\s*:(.*)$")')
          text = text.replace('Pattern.compile("^rules\\s*:(.*)$")', 'Pattern.compile("^rules\\\\s*:(.*)$")')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          sh -n android-app/app/src/main/assets/proxy-root-v3.sh
          grep -q 'versionCode = 433' android-app/app/build.gradle.kts
          grep -q 'versionName = "0.4.0-test.33"' android-app/app/build.gradle.kts
          grep -q 'ProxyAdblockChainActivity' android-app/app/src/main/AndroidManifest.xml
          grep -q 'proxyAdblockChain' android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyRuntimeProfile.java
          grep -q 'RULE-SET,"+ProxyAdblockRules.PROVIDER_NAME+",REJECT' android-app/app/src/main/java/io/github/xgl34222220/bichen/MihomoStartupConfig.java
          grep -q 'type: file' android-app/app/src/main/java/io/github/xgl34222220/bichen/MihomoStartupConfig.java
          grep -q 'behavior: domain' android-app/app/src/main/java/io/github/xgl34222220/bichen/MihomoStartupConfig.java
          grep -Fq 'Pattern.compile("^rule-providers\\s*:(.*)$")' android-app/app/src/main/java/io/github/xgl34222220/bichen/MihomoStartupConfig.java
          grep -Fq 'Pattern.compile("^rules\\s*:(.*)$")' android-app/app/src/main/java/io/github/xgl34222220/bichen/MihomoStartupConfig.java
          grep -q 'ProxyAdblockRules.export' android-app/app/src/main/java/io/github/xgl34222220/bichen/RootProxyManager.java
          grep -q 'bichen-adblock.txt' android-app/app/src/main/java/io/github/xgl34222220/bichen/RootProxyManager.java
          grep -q 'ProxyAdblockCoordinator.enter' android-app/app/src/main/java/io/github/xgl34222220/bichen/RootProxyManager.java
          grep -q 'ProxyAdblockCoordinator.exit' android-app/app/src/main/java/io/github/xgl34222220/bichen/RootProxyManager.java
          grep -q 'ACTION_PAUSE_FOR_PROXY' android-app/app/src/main/java/io/github/xgl34222220/bichen/DnsVpnService.java
          grep -q '代理串联 · 规则先 REJECT' android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyAdblockChainActivity.kt
          grep -q 'ProxyAdblockChainActivity::class.java' android-app/app/src/main/java/io/github/xgl34222220/bichen/ReferenceProxyActivity.kt
          grep -q 'ProxyAdblockChainActivity::class.java' android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyAdvancedSettingsActivity.kt
          grep -q 'proxyAppPackages' android-app/app/src/main/java/io/github/xgl34222220/bichen/RootProxyPolicy.java
          ! grep -q 'getStringSet("bypassApps"' android-app/app/src/main/java/io/github/xgl34222220/bichen/RootProxyPolicy.java
      - name: Checkout pinned Mihomo
        uses: actions/checkout@v4
        with:
          repository: MetaCubeX/mihomo
          ref: ac017cdd246ce8bd547653d927e7bf77d7ee73d5
          path: .upstream
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: .upstream/go.sum
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false
      - name: Run Java host regression
        run: python3 tools/test_java.py
      - name: Compile Android source
        working-directory: android-app
        run: gradle :app:compileDebugKotlin :app:compileDebugJavaWithJavac --stacktrace
      - name: Ensure NDK
        run: |
          if [ ! -x "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" ]; then
            sdkmanager 'ndk;28.2.13676358'
          fi
      - name: Build pinned Mihomo runtime
        run: |
          set -euo pipefail
          cp -r native/bridge .upstream/bichenbridge
          cd .upstream
          go test -tags with_gvisor -v ./bichenbridge
          NDK="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p ../android-app/app/src/main/jniLibs/arm64-v8a ../android-app/app/src/main/jniLibs/x86_64
          mkdir -p ../android-app/app/src/main/assets/mihomo-root/arm64-v8a ../android-app/app/src/main/assets/mihomo-root/x86_64
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="$NDK/aarch64-linux-android26-clang" go build -tags with_gvisor -trimpath -buildmode=c-shared -ldflags='-s -w -extldflags=-Wl,-z,max-page-size=16384' -o ../android-app/app/src/main/jniLibs/arm64-v8a/libbichen_core.so ./bichenbridge
          CGO_ENABLED=1 GOOS=android GOARCH=amd64 CC="$NDK/x86_64-linux-android26-clang" go build -tags with_gvisor -trimpath -buildmode=c-shared -ldflags='-s -w -extldflags=-Wl,-z,max-page-size=16384' -o ../android-app/app/src/main/jniLibs/x86_64/libbichen_core.so ./bichenbridge
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="$NDK/aarch64-linux-android26-clang" go build -tags with_gvisor -trimpath -ldflags='-s -w -extldflags=-Wl,-z,max-page-size=16384' -o ../android-app/app/src/main/assets/mihomo-root/arm64-v8a/mihomo .
          CGO_ENABLED=1 GOOS=android GOARCH=amd64 CC="$NDK/x86_64-linux-android26-clang" go build -tags with_gvisor -trimpath -ldflags='-s -w -extldflags=-Wl,-z,max-page-size=16384' -o ../android-app/app/src/main/assets/mihomo-root/x86_64/mihomo .
          cp LICENSE ../android-app/app/src/main/assets/MIHOMO-LICENSE
          git rev-parse HEAD > ../android-app/app/src/main/assets/mihomo-revision.txt
      - name: Build test.33 APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | tee apk-files.txt >/dev/null
          grep -q "versionCode='433'" apk-badging.txt
          grep -q "versionName='0.4.0-test.33-preview'" apk-badging.txt
          grep -q 'assets/proxy-root-v3.sh' apk-files.txt
          grep -q 'assets/cnip/bichen-cn-v4.txt' apk-files.txt
          grep -q 'assets/cnip/bichen-cn-v6.txt' apk-files.txt
          sha256sum "$APK" | tee apk-sha256.txt
      - name: Upload verified test.33 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bichen-0.4.0-test.33-chained-adblock
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            apk-badging.txt
            apk-files.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
      - name: Commit verified test.33 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .upstream android-app/app/src/main/jniLibs android-app/app/src/main/assets/mihomo-root android-app/app/src/main/assets/MIHOMO-LICENSE android-app/app/src/main/assets/mihomo-revision.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -u android-app tests
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Chain ad blocking into Root proxy for Bichen 0.4.0-test.33'
            git push origin HEAD:release/bichen-0.4.0-test.33
          fi
