name: Build Bichen 0.4.0-test.40 transparent ingress fix

on:
  push:
    branches: ['release/bichen-0.4.0-test.40']

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: github.event.head_commit.message == 'Build Bichen 0.4.0-test.40 transparent ingress fix'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply test40 transparent ingress fix
        run: python3 tools/apply_test40_transparent_ingress_fix.py

      - name: Verify source patch
        shell: bash
        run: |
          set -euo pipefail
          BUILD=android-app/app/build.gradle.kts
          STARTUP=android-app/app/src/main/java/io/github/xgl34222220/bichen/MihomoStartupConfig.java
          ROOT=android-app/app/src/main/assets/proxy-root-v3.sh
          sh -n "$ROOT"
          grep -q 'versionCode = 440' "$BUILD"
          grep -q 'versionName = "0.4.0-test.40"' "$BUILD"
          grep -q 'removeTopLevelScalar(yaml,"allow-lan")' "$STARTUP"
          grep -q 'removeTopLevelScalar(yaml,"bind-address")' "$STARTUP"
          grep -q 'override.append("allow-lan: true\\n")' "$STARTUP"
          grep -q 'override.append("bind-address: '\''\*'\''\\n")' "$STARTUP"
          grep -q 'profile.dnsHijack!=ProxyRuntimeProfile.DnsHijack.OFF' "$STARTUP"
          grep -q '\[ "$START_DNS" = off \] || install_dns_redirect4' "$ROOT"
          grep -q '\[ "$START_DNS" = off \] || install_dns_redirect6' "$ROOT"
          grep -q 'iptables -t mangle -A "$MOUT" -p udp --dport 53 -j RETURN' "$ROOT"
          grep -q 'ip6tables -t mangle -A "$MOUT" -p udp --dport 53 -j RETURN' "$ROOT"

      - name: Commit generated test40 sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            android-app/app/build.gradle.kts \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/MihomoStartupConfig.java \
            android-app/app/src/main/assets/proxy-root-v3.sh
          if ! git diff --cached --quiet; then
            git commit -m 'Fix transparent ingress and DNS path for 0.4.0-test.40'
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false

      - name: Reuse verified Mihomo runtime
        uses: actions/download-artifact@v4
        with:
          name: Bichen-0.4.0-test.35-Fullscreen-Strategy-Page
          path: previous-artifact
          github-token: ${{ github.token }}
          repository: xgl34222220-ops/pichen
          run-id: 35170170620

      - name: Restore native runtime
        shell: bash
        run: |
          set -euo pipefail
          PREV=$(find previous-artifact -name '*.apk' -type f | head -n 1)
          test -n "$PREV"
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a android-app/app/src/main/jniLibs/x86_64
          mkdir -p android-app/app/src/main/assets/mihomo-root/arm64-v8a android-app/app/src/main/assets/mihomo-root/x86_64
          unzip -p "$PREV" lib/arm64-v8a/libbichen_core.so > android-app/app/src/main/jniLibs/arm64-v8a/libbichen_core.so
          unzip -p "$PREV" lib/x86_64/libbichen_core.so > android-app/app/src/main/jniLibs/x86_64/libbichen_core.so
          unzip -p "$PREV" assets/mihomo-root/arm64-v8a/mihomo > android-app/app/src/main/assets/mihomo-root/arm64-v8a/mihomo
          unzip -p "$PREV" assets/mihomo-root/x86_64/mihomo > android-app/app/src/main/assets/mihomo-root/x86_64/mihomo
          unzip -p "$PREV" assets/MIHOMO-LICENSE > android-app/app/src/main/assets/MIHOMO-LICENSE
          unzip -p "$PREV" assets/mihomo-revision.txt > android-app/app/src/main/assets/mihomo-revision.txt

      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK and chained adblock runtime
        shell: bash
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          STARTUP=android-app/app/src/main/java/io/github/xgl34222220/bichen/MihomoStartupConfig.java
          ROOT=android-app/app/src/main/assets/proxy-root-v3.sh
          MGR=android-app/app/src/main/java/io/github/xgl34222220/bichen/RootProxyManager.java
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/mihomo-root/arm64-v8a/mihomo'
          grep -q 'ProxyAdblockCoordinator.enter(context)' "$MGR"
          grep -q 'profile.adblockChain' "$MGR"
          grep -q 'removeTopLevelScalar(yaml,"allow-lan")' "$STARTUP"
          grep -q 'removeTopLevelScalar(yaml,"bind-address")' "$STARTUP"
          grep -q 'override.append("allow-lan: true\\n")' "$STARTUP"
          grep -q 'profile.dnsHijack!=ProxyRuntimeProfile.DnsHijack.OFF' "$STARTUP"
          grep -q 'TPROXY_PORT=19898' "$STARTUP"
          grep -q 'DNS_PORT=11053' "$STARTUP"
          grep -q '\[ "$START_DNS" = off \] || install_dns_redirect4' "$ROOT"
          grep -q 'START_BIN="$1"; START_CFG="$2"; START_MODE="$3"' "$ROOT"

      - uses: actions/upload-artifact@v4
        with:
          name: Bichen-0.4.0-test.40-Transparent-Ingress-DNS-Fix
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
