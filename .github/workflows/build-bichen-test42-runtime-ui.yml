name: Build Bichen 0.4.0-test.42 runtime and UI fix

on:
  push:
    branches: ['release/bichen-0.4.0-test.42']

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: github.event.head_commit.message == 'Build Bichen 0.4.0-test.42 runtime and UI fix'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply test42 runtime stability and UI fix
        run: python3 tools/apply_test42_runtime_ui_fix.py

      - name: Verify source patch
        shell: bash
        run: |
          set -euo pipefail
          BUILD=android-app/app/build.gradle.kts
          STARTUP=android-app/app/src/main/java/io/github/xgl34222220/bichen/MihomoStartupConfig.java
          ROOT=android-app/app/src/main/assets/proxy-root-v3.sh
          MGR=android-app/app/src/main/java/io/github/xgl34222220/bichen/RootProxyManager.java
          CTRL=android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyComposeController.kt
          MATCH=android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyNetworkMatchService.java
          UI=android-app/app/src/main/java/io/github/xgl34222220/bichen/ReferenceProxyActivity.kt
          INSPECT=android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyRuntimeInspector.kt
          sh -n "$ROOT"
          grep -q 'versionCode = 442' "$BUILD"
          grep -q 'versionName = "0.4.0-test.42"' "$BUILD"
          ! grep -q 'override.append("routing-mark: ")' "$STARTUP"
          grep -q 'uid-owner 0 -j RETURN' "$ROOT"
          grep -q 'P=14500; while \[ "$P" -le 14949 \]' "$ROOT"
          grep -q 'DIRECT 出站不可用' "$MGR"
          grep -q 'proxyRootSessionOwner' "$CTRL"
          grep -q '"automation".equals(owner)' "$MATCH"
          grep -q -- '--- watchdog.log ---' "$INSPECT"
          grep -q '订阅更新成功' "$UI"
          grep -q '规则集更新完成' "$UI"
          grep -q 'private fun RefFloatingCapsule' "$UI"
          grep -q 'RefDelayBadge(delay, testing, onDelay)' "$UI"

      - name: Commit generated test42 sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            android-app/app/build.gradle.kts \
            android-app/app/src/main/assets/proxy-root-v3.sh \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/MihomoStartupConfig.java \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/RootProxyManager.java \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyComposeController.kt \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyNetworkMatchService.java \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyRuntimeInspector.kt \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyDashboardRepository.kt \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/ReferenceProxyActivity.kt
          if ! git diff --cached --quiet; then
            git commit -m 'Fix runtime egress persistence and panel interactions for 0.4.0-test.42'
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false

      - name: Reuse verified Mihomo runtime
        uses: actions/download-artifact@v4
        with:
          name: Bichen-0.4.0-test.35-Fullscreen-Strategy-Page
          path: previous-artifact
          github-token: ${{ github.token }}
          repository: xgl34222220-ops/pichen
          run-id: 35170170620

      - name: Restore native runtime
        shell: bash
        run: |
          set -euo pipefail
          PREV=$(find previous-artifact -name '*.apk' -type f | head -n 1)
          test -n "$PREV"
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a android-app/app/src/main/jniLibs/x86_64
          mkdir -p android-app/app/src/main/assets/mihomo-root/arm64-v8a android-app/app/src/main/assets/mihomo-root/x86_64
          unzip -p "$PREV" lib/arm64-v8a/libbichen_core.so > android-app/app/src/main/jniLibs/arm64-v8a/libbichen_core.so
          unzip -p "$PREV" lib/x86_64/libbichen_core.so > android-app/app/src/main/jniLibs/x86_64/libbichen_core.so
          unzip -p "$PREV" assets/mihomo-root/arm64-v8a/mihomo > android-app/app/src/main/assets/mihomo-root/arm64-v8a/mihomo
          unzip -p "$PREV" assets/mihomo-root/x86_64/mihomo > android-app/app/src/main/assets/mihomo-root/x86_64/mihomo
          unzip -p "$PREV" assets/MIHOMO-LICENSE > android-app/app/src/main/assets/MIHOMO-LICENSE
          unzip -p "$PREV" assets/mihomo-revision.txt > android-app/app/src/main/assets/mihomo-revision.txt

      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK and runtime invariants
        shell: bash
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          ROOT=android-app/app/src/main/assets/proxy-root-v3.sh
          STARTUP=android-app/app/src/main/java/io/github/xgl34222220/bichen/MihomoStartupConfig.java
          MGR=android-app/app/src/main/java/io/github/xgl34222220/bichen/RootProxyManager.java
          UI=android-app/app/src/main/java/io/github/xgl34222220/bichen/ReferenceProxyActivity.kt
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/mihomo-root/arm64-v8a/mihomo'
          grep -q 'ProxyAdblockCoordinator.enter(context)' "$MGR"
          grep -q 'profile.adblockChain' "$MGR"
          grep -q 'uid-owner 0 -j RETURN' "$ROOT"
          ! grep -q 'override.append("routing-mark: ")' "$STARTUP"
          grep -q 'TPROXY_PORT=19898' "$STARTUP"
          grep -q 'DNS_PORT=11053' "$STARTUP"
          grep -q 'allow-lan: true' "$STARTUP"
          grep -q 'private fun RefFloatingCapsule' "$UI"
          grep -q 'providerRefreshRotation' "$UI"
          grep -q 'ruleSetRefreshRotation' "$UI"

      - uses: actions/upload-artifact@v4
        with:
          name: Bichen-0.4.0-test.42-Runtime-Stability-UI-Fix
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
