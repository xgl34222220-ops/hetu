name: Build Bichen 0.4.0-test.50 commercial polish

on:
  push:
    branches: ['release/bichen-0.4.0-test.50']

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: github.event.head_commit.message == 'Build Bichen 0.4.0-test.50 commercial polish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply test50 commercial UI polish
        shell: bash
        run: |
          set -euo pipefail
          BUILD=android-app/app/build.gradle.kts
          if grep -q 'versionCode = 449' "$BUILD"; then
            python3 tools/apply_test50_commercial_polish.py
            python3 - <<'PY'
          from pathlib import Path
          p = Path('android-app/app/src/main/java/io/github/xgl34222220/bichen/ReferenceProxyActivity.kt')
          s = p.read_text()
          start = s.index('@Composable\nprivate fun RefResourceCard')
          end = s.index('\nprivate fun countryEmoji', start)
          block = s[start:end]
          block = block.replace('Row(Modifier.fillMaxWidth().height(20.dp), verticalAlignment = Alignment.CenterVertically)', 'Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically)', 1)
          s = s[:start] + block + s[end:]
          p.write_text(s)
          PY
          elif ! grep -q 'versionCode = 450' "$BUILD"; then
            echo 'Unexpected version baseline' >&2
            exit 1
          fi
          python3 tools/fix_test50_yaml_escape.py

      - name: Verify generated sources
        run: python3 tools/verify_test50_sources.py

      - name: Commit generated test50 sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            android-app/app/build.gradle.kts \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/ReferenceProxyActivity.kt \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyAdblockChainActivity.kt \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxySubscriptionActivity.kt \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyAdvancedSettingsActivity.kt
          if ! git diff --cached --quiet; then
            git commit -m 'Polish dashboard hierarchy and editor in 0.4.0-test.50 [skip ci]'
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false

      - name: Reuse verified test49 runtime
        uses: actions/download-artifact@v4
        with:
          name: Bichen-0.4.0-test.49-Sunken-Well-Refine
          path: previous-artifact
          github-token: ${{ github.token }}
          repository: xgl34222220-ops/pichen
          run-id: 35225126891

      - name: Restore native runtime
        shell: bash
        run: |
          set -euo pipefail
          PREV=$(find previous-artifact -name '*.apk' -type f | head -n 1)
          test -n "$PREV"
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a android-app/app/src/main/jniLibs/x86_64
          mkdir -p android-app/app/src/main/assets/mihomo-root/arm64-v8a android-app/app/src/main/assets/mihomo-root/x86_64
          unzip -p "$PREV" lib/arm64-v8a/libbichen_core.so > android-app/app/src/main/jniLibs/arm64-v8a/libbichen_core.so
          unzip -p "$PREV" lib/x86_64/libbichen_core.so > android-app/app/src/main/jniLibs/x86_64/libbichen_core.so
          unzip -p "$PREV" assets/mihomo-root/arm64-v8a/mihomo > android-app/app/src/main/assets/mihomo-root/arm64-v8a/mihomo
          unzip -p "$PREV" assets/mihomo-root/x86_64/mihomo > android-app/app/src/main/assets/mihomo-root/x86_64/mihomo
          unzip -p "$PREV" assets/MIHOMO-LICENSE > android-app/app/src/main/assets/MIHOMO-LICENSE
          unzip -p "$PREV" assets/mihomo-revision.txt > android-app/app/src/main/assets/mihomo-revision.txt

      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/mihomo-root/arm64-v8a/mihomo'

      - uses: actions/upload-artifact@v4
        with:
          name: Bichen-0.4.0-test.50-Commercial-Polish
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
