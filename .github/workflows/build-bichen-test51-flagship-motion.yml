name: Build Bichen 0.4.0-test.51 flagship motion polish

on:
  push:
    branches: ['release/bichen-0.4.0-test.51']

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: github.event.head_commit.message == 'Build Bichen 0.4.0-test.51 flagship motion polish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply test51 flagship polish
        run: python3 tools/apply_test51_flagship_motion_polish.py

      - name: Verify generated sources
        shell: bash
        run: |
          set -euo pipefail
          BUILD=android-app/app/build.gradle.kts
          UI=android-app/app/src/main/java/io/github/xgl34222220/bichen/ReferenceProxyActivity.kt
          SUB=android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxySubscriptionActivity.kt
          AD=android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyAdblockChainActivity.kt
          APPS=android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyAppSelectionActivity.kt
          WEB=android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyWebUiActivity.kt
          grep -q 'versionCode = 451' "$BUILD"
          grep -q 'versionName = "0.4.0-test.51"' "$BUILD"
          grep -q 'lanWanSlide' "$UI"
          grep -q 'fillMaxHeight(.78f)' "$UI"
          grep -q 'groupArrow' "$UI"
          grep -q 'peak < 4096L' "$UI"
          grep -q 'subscription-provider' "$UI"
          grep -q 'resourceCpuPulse' "$UI"
          grep -q 'YamlSyntaxHighlightTransformation' "$SUB"
          grep -q 'visualTransformation = YamlSyntaxHighlightTransformation' "$SUB"
          grep -q 'loading-skeleton' "$APPS"
          grep -q 'setBackgroundDrawable' "$APPS"
          grep -q 'setBackgroundDrawable' "$WEB"
          grep -q '正在准备本机 Zashboard' "$WEB"
          grep -q 'shadowElevation = if (dark) 0.dp else 1.dp' "$AD"

      - name: Commit generated test51 sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            android-app/app/build.gradle.kts \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/ReferenceProxyActivity.kt \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxySubscriptionActivity.kt \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyAdblockChainActivity.kt \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyAppSelectionActivity.kt \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyWebUiActivity.kt
          if ! git diff --cached --quiet; then
            git commit -m 'Polish motion, skeletons and editor in 0.4.0-test.51 [skip ci]'
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false

      - name: Reuse verified test50 runtime
        uses: actions/download-artifact@v4
        with:
          name: Bichen-0.4.0-test.50-Commercial-Polish
          path: previous-artifact
          github-token: ${{ github.token }}
          repository: xgl34222220-ops/pichen
          run-id: 35229034299

      - name: Restore native runtime
        shell: bash
        run: |
          set -euo pipefail
          PREV=$(find previous-artifact -name '*.apk' -type f | head -n 1)
          test -n "$PREV"
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a android-app/app/src/main/jniLibs/x86_64
          mkdir -p android-app/app/src/main/assets/mihomo-root/arm64-v8a android-app/app/src/main/assets/mihomo-root/x86_64
          unzip -p "$PREV" lib/arm64-v8a/libbichen_core.so > android-app/app/src/main/jniLibs/arm64-v8a/libbichen_core.so
          unzip -p "$PREV" lib/x86_64/libbichen_core.so > android-app/app/src/main/jniLibs/x86_64/libbichen_core.so
          unzip -p "$PREV" assets/mihomo-root/arm64-v8a/mihomo > android-app/app/src/main/assets/mihomo-root/arm64-v8a/mihomo
          unzip -p "$PREV" assets/mihomo-root/x86_64/mihomo > android-app/app/src/main/assets/mihomo-root/x86_64/mihomo
          unzip -p "$PREV" assets/MIHOMO-LICENSE > android-app/app/src/main/assets/MIHOMO-LICENSE
          unzip -p "$PREV" assets/mihomo-revision.txt > android-app/app/src/main/assets/mihomo-revision.txt

      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/mihomo-root/arm64-v8a/mihomo'

      - uses: actions/upload-artifact@v4
        with:
          name: Bichen-0.4.0-test.51-Flagship-Motion-Polish
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
