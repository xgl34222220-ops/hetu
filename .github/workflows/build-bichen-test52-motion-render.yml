name: Build Bichen 0.4.0-test.52 motion render fix

on:
  push:
    branches: ['release/bichen-0.4.0-test.52']

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: github.event.head_commit.message == 'Build Bichen 0.4.0-test.52 motion render fix'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply test52 motion/render fix
        shell: bash
        run: |
          set -euo pipefail
          BUILD=android-app/app/build.gradle.kts
          if grep -q 'versionCode = 451' "$BUILD"; then
            python3 tools/apply_test52_motion_render_fix.py
          elif grep -q 'versionCode = 452' "$BUILD"; then
            echo 'test52 sources already generated'
          else
            echo 'Unexpected version baseline' >&2
            exit 1
          fi
          python3 tools/fix_test52_compile.py

      - name: Verify generated sources
        shell: bash
        run: |
          set -euo pipefail
          BUILD=android-app/app/build.gradle.kts
          UI=android-app/app/src/main/java/io/github/xgl34222220/bichen/ReferenceProxyActivity.kt
          SUB=android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxySubscriptionActivity.kt
          ADV=android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyAdvancedSettingsActivity.kt
          grep -q 'versionCode = 452' "$BUILD"
          grep -q 'versionName = "0.4.0-test.52"' "$BUILD"
          grep -q 'flipRotation.animateTo' "$UI"
          grep -q 'key(tab) {' "$UI"
          grep -q 'tabFade.animateTo' "$UI"
          grep -q 'index \* 15L' "$UI"
          grep -q 'rules.chunked(15)' "$UI"
          grep -q 'durationMillis = 280' "$UI"
          grep -q 'TextFieldBuffer.transformOutput' "$SUB"
          grep -q 'scrollState = editorScroll' "$SUB"
          grep -q 'translationY = -editorScroll.value.toFloat()' "$SUB"
          ! grep -q 'verticalScroll(editorScroll)' "$SUB"
          grep -q 'AdvancedPreflightSheet' "$ADV"
          grep -q 'preflightShieldPulse' "$ADV"
          grep -q 'runPreflight()' "$ADV"
          grep -q 'import androidx.compose.animation.core.animateFloat' "$ADV"

      - name: Commit generated test52 sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            android-app/app/build.gradle.kts \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/ReferenceProxyActivity.kt \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxySubscriptionActivity.kt \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyAdvancedSettingsActivity.kt
          if ! git diff --cached --quiet; then
            git commit -m 'Fix motion tearing and editor viewport in 0.4.0-test.52 [skip ci]'
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false

      - name: Reuse verified test51 runtime
        uses: actions/download-artifact@v4
        with:
          name: Bichen-0.4.0-test.51-Flagship-Motion-Polish
          path: previous-artifact
          github-token: ${{ github.token }}
          repository: xgl34222220-ops/pichen
          run-id: 35231791580

      - name: Restore native runtime
        shell: bash
        run: |
          set -euo pipefail
          PREV=$(find previous-artifact -name '*.apk' -type f | head -n 1)
          test -n "$PREV"
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a android-app/app/src/main/jniLibs/x86_64
          mkdir -p android-app/app/src/main/assets/mihomo-root/arm64-v8a android-app/app/src/main/assets/mihomo-root/x86_64
          unzip -p "$PREV" lib/arm64-v8a/libbichen_core.so > android-app/app/src/main/jniLibs/arm64-v8a/libbichen_core.so
          unzip -p "$PREV" lib/x86_64/libbichen_core.so > android-app/app/src/main/jniLibs/x86_64/libbichen_core.so
          unzip -p "$PREV" assets/mihomo-root/arm64-v8a/mihomo > android-app/app/src/main/assets/mihomo-root/arm64-v8a/mihomo
          unzip -p "$PREV" assets/mihomo-root/x86_64/mihomo > android-app/app/src/main/assets/mihomo-root/x86_64/mihomo
          unzip -p "$PREV" assets/MIHOMO-LICENSE > android-app/app/src/main/assets/MIHOMO-LICENSE
          unzip -p "$PREV" assets/mihomo-revision.txt > android-app/app/src/main/assets/mihomo-revision.txt

      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/mihomo-root/arm64-v8a/mihomo'

      - uses: actions/upload-artifact@v4
        with:
          name: Bichen-0.4.0-test.52-Motion-Render-Fix
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
