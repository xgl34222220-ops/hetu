name: Build Bichen 0.4.0-test.53 controller port state fix

on:
  push:
    branches: ['release/bichen-0.4.0-test.53']

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: github.event.head_commit.message == 'Build Bichen 0.4.0-test.53 controller port state fix'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply test53 controller state fix
        shell: bash
        run: |
          set -euo pipefail
          BUILD=android-app/app/build.gradle.kts
          if grep -q 'versionCode = 452' "$BUILD"; then
            python3 tools/apply_test53_controller_port_state_fix.py
          elif grep -q 'versionCode = 453' "$BUILD"; then
            echo 'test53 sources already generated'
          else
            echo 'Unexpected version baseline' >&2
            exit 1
          fi

      - name: Verify generated sources
        shell: bash
        run: |
          set -euo pipefail
          BUILD=android-app/app/build.gradle.kts
          ROOT=android-app/app/src/main/java/io/github/xgl34222220/bichen/RootProxyManager.java
          SH=android-app/app/src/main/assets/proxy-root-v3.sh
          grep -q 'versionCode = 453' "$BUILD"
          grep -q 'versionName = "0.4.0-test.53"' "$BUILD"
          grep -q 'liveControllerPort' "$ROOT"
          grep -q 'putInt("proxyControllerPort",p.controllerPort).commit()' "$ROOT"
          ! grep -q 'prefs.edit().putInt("proxyControllerPort",port).commit()' "$ROOT"
          grep -q 'CONTROLLER_PORT=%s' "$SH"
          grep -q '"controllerPort":%s' "$SH"

      - name: Commit generated test53 sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            android-app/app/build.gradle.kts \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/RootProxyManager.java \
            android-app/app/src/main/assets/proxy-root-v3.sh
          if ! git diff --cached --quiet; then
            git commit -m 'Fix controller port state split in 0.4.0-test.53 [skip ci]'
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false

      - name: Reuse verified test52 runtime
        uses: actions/download-artifact@v4
        with:
          name: Bichen-0.4.0-test.52-Motion-Render-Fix
          path: previous-artifact
          github-token: ${{ github.token }}
          repository: xgl34222220-ops/pichen
          run-id: 35235403457

      - name: Restore native runtime
        shell: bash
        run: |
          set -euo pipefail
          PREV=$(find previous-artifact -name '*.apk' -type f | head -n 1)
          test -n "$PREV"
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a android-app/app/src/main/jniLibs/x86_64
          mkdir -p android-app/app/src/main/assets/mihomo-root/arm64-v8a android-app/app/src/main/assets/mihomo-root/x86_64
          unzip -p "$PREV" lib/arm64-v8a/libbichen_core.so > android-app/app/src/main/jniLibs/arm64-v8a/libbichen_core.so
          unzip -p "$PREV" lib/x86_64/libbichen_core.so > android-app/app/src/main/jniLibs/x86_64/libbichen_core.so
          unzip -p "$PREV" assets/mihomo-root/arm64-v8a/mihomo > android-app/app/src/main/assets/mihomo-root/arm64-v8a/mihomo
          unzip -p "$PREV" assets/mihomo-root/x86_64/mihomo > android-app/app/src/main/assets/mihomo-root/x86_64/mihomo
          unzip -p "$PREV" assets/MIHOMO-LICENSE > android-app/app/src/main/assets/MIHOMO-LICENSE
          unzip -p "$PREV" assets/mihomo-revision.txt > android-app/app/src/main/assets/mihomo-revision.txt

      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/mihomo-root/arm64-v8a/mihomo'

      - uses: actions/upload-artifact@v4
        with:
          name: Bichen-0.4.0-test.53-Controller-Port-State-Fix
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
