name: Build Bichen 0.4.0-test.55 dedicated settings routes

on:
  push:
    branches: ['release/bichen-0.4.0-test.55']

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: github.event.head_commit.message == 'Build Bichen 0.4.0-test.55 dedicated settings routes'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply test55 route split
        shell: bash
        run: |
          set -euo pipefail
          BUILD=android-app/app/build.gradle.kts
          if grep -q 'versionCode = 454' "$BUILD"; then
            python3 tools/apply_test55_route_split.py
          elif grep -q 'versionCode = 455' "$BUILD"; then
            echo 'test55 sources already generated'
          else
            echo 'Unexpected version baseline' >&2
            exit 1
          fi

      - name: Verify generated sources
        shell: bash
        run: |
          set -euo pipefail
          BUILD=android-app/app/build.gradle.kts
          REF=android-app/app/src/main/java/io/github/xgl34222220/bichen/ReferenceProxyActivity.kt
          FOCUSED=android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyFocusedSettingsActivities.kt
          MANIFEST=android-app/app/src/main/AndroidManifest.xml
          grep -q 'versionCode = 455' "$BUILD"
          grep -q 'versionName = "0.4.0-test.55"' "$BUILD"
          grep -q 'ProxyRuntimeCoreSettingsActivity::class.java' "$REF"
          grep -q 'ProxySharedNetworkSettingsActivity::class.java' "$REF"
          grep -q 'ProxyCnIpSettingsActivity::class.java' "$REF"
          grep -q 'ProxyBypassRulesActivity::class.java' "$REF"
          ! grep -q 'putExtra("focus", "core")' "$REF"
          ! grep -q 'putExtra("focus", "sharing")' "$REF"
          ! grep -q 'putExtra("focus", "cnip")' "$REF"
          ! grep -q 'putExtra("focus", "bypass")' "$REF"
          grep -q 'class ProxyRuntimeCoreSettingsActivity' "$FOCUSED"
          grep -q 'class ProxySharedNetworkSettingsActivity' "$FOCUSED"
          grep -q 'class ProxyCnIpSettingsActivity' "$FOCUSED"
          grep -q 'class ProxyBypassRulesActivity' "$FOCUSED"
          grep -q '.ProxyRuntimeCoreSettingsActivity' "$MANIFEST"
          grep -q '.ProxySharedNetworkSettingsActivity' "$MANIFEST"
          grep -q '.ProxyCnIpSettingsActivity' "$MANIFEST"
          grep -q '.ProxyBypassRulesActivity' "$MANIFEST"

      - name: Commit generated test55 sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            android-app/app/build.gradle.kts \
            android-app/app/src/main/AndroidManifest.xml \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/ReferenceProxyActivity.kt \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyFocusedSettingsActivities.kt
          if ! git diff --cached --quiet; then
            git commit -m 'Split dedicated settings routes in 0.4.0-test.55 [skip ci]'
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false

      - name: Reuse verified test54 runtime
        uses: actions/download-artifact@v4
        with:
          name: Bichen-0.4.0-test.54-WeChat-Connection-Fix
          path: previous-artifact
          github-token: ${{ github.token }}
          repository: xgl34222220-ops/pichen
          run-id: 35239834011

      - name: Restore native runtime
        shell: bash
        run: |
          set -euo pipefail
          PREV=$(find previous-artifact -name '*.apk' -type f | head -n 1)
          test -n "$PREV"
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a android-app/app/src/main/jniLibs/x86_64
          mkdir -p android-app/app/src/main/assets/mihomo-root/arm64-v8a android-app/app/src/main/assets/mihomo-root/x86_64
          unzip -p "$PREV" lib/arm64-v8a/libbichen_core.so > android-app/app/src/main/jniLibs/arm64-v8a/libbichen_core.so
          unzip -p "$PREV" lib/x86_64/libbichen_core.so > android-app/app/src/main/jniLibs/x86_64/libbichen_core.so
          unzip -p "$PREV" assets/mihomo-root/arm64-v8a/mihomo > android-app/app/src/main/assets/mihomo-root/arm64-v8a/mihomo
          unzip -p "$PREV" assets/mihomo-root/x86_64/mihomo > android-app/app/src/main/assets/mihomo-root/x86_64/mihomo
          unzip -p "$PREV" assets/MIHOMO-LICENSE > android-app/app/src/main/assets/MIHOMO-LICENSE
          unzip -p "$PREV" assets/mihomo-revision.txt > android-app/app/src/main/assets/mihomo-revision.txt

      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/mihomo-root/arm64-v8a/mihomo'

      - uses: actions/upload-artifact@v4
        with:
          name: Bichen-0.4.0-test.55-Dedicated-Settings-Routes
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
