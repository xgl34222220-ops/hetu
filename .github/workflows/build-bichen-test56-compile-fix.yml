name: Build Bichen 0.4.0-test.56 compile fixes

on:
  push:
    branches: ['release/bichen-0.4.0-test.56']

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: github.event.head_commit.message == 'Build Bichen 0.4.0-test.56 compile fixes'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Apply compile and feedback fixes
        run: python3 tools/fix_test56_compile_and_feedback.py
      - name: Verify fixes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'import androidx.compose.animation.core.\*' android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyAppSelectionActivity.kt
          grep -q 'CheckCircle else Icons.Rounded.Download' android-app/app/src/main/java/io/github/xgl34222220/bichen/ReferenceProxyActivity.kt
          grep -q 'while \[ \\"\$#\\" -gt 1 \]' android-app/app/src/main/java/io/github/xgl34222220/bichen/RootProxyManager.java || grep -q 'while \[ "\$#" -gt 1 \]' android-app/app/src/main/java/io/github/xgl34222220/bichen/RootProxyManager.java
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyAppSelectionActivity.kt android-app/app/src/main/java/io/github/xgl34222220/bichen/ReferenceProxyActivity.kt android-app/app/src/main/java/io/github/xgl34222220/bichen/RootProxyManager.java
          if ! git diff --cached --quiet; then git commit -m 'Fix test56 compile imports and local success feedback [skip ci]'; git push; fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools, log-accepted-android-sdk-licenses: false }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.5.0', cache-read-only: false }
      - name: Reuse verified test55 runtime
        uses: actions/download-artifact@v4
        with:
          name: Bichen-0.4.0-test.55-Dedicated-Settings-Routes
          path: previous-artifact
          github-token: ${{ github.token }}
          repository: xgl34222220-ops/pichen
          run-id: 35242567987
      - name: Restore native runtime
        shell: bash
        run: |
          set -euo pipefail
          PREV=$(find previous-artifact -name '*.apk' -type f | head -n 1); test -n "$PREV"
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a android-app/app/src/main/jniLibs/x86_64 android-app/app/src/main/assets/mihomo-root/arm64-v8a android-app/app/src/main/assets/mihomo-root/x86_64
          unzip -p "$PREV" lib/arm64-v8a/libbichen_core.so > android-app/app/src/main/jniLibs/arm64-v8a/libbichen_core.so
          unzip -p "$PREV" lib/x86_64/libbichen_core.so > android-app/app/src/main/jniLibs/x86_64/libbichen_core.so
          unzip -p "$PREV" assets/mihomo-root/arm64-v8a/mihomo > android-app/app/src/main/assets/mihomo-root/arm64-v8a/mihomo
          unzip -p "$PREV" assets/mihomo-root/x86_64/mihomo > android-app/app/src/main/assets/mihomo-root/x86_64/mihomo
          unzip -p "$PREV" assets/MIHOMO-LICENSE > android-app/app/src/main/assets/MIHOMO-LICENSE
          unzip -p "$PREV" assets/mihomo-revision.txt > android-app/app/src/main/assets/mihomo-revision.txt
      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk; test -f "$APK"; unzip -t "$APK" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: Bichen-0.4.0-test.56-Flagship-Runtime-Polish
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
