name: Build Bichen 0.4.0-test.56 flagship runtime polish

on:
  push:
    branches: ['release/bichen-0.4.0-test.56']

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: github.event.head_commit.message == 'Build Bichen 0.4.0-test.56 flagship runtime polish'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply test56 flagship runtime patch
        shell: bash
        run: |
          set -euo pipefail
          BUILD=android-app/app/build.gradle.kts
          if grep -q 'versionCode = 455' "$BUILD"; then
            python3 tools/apply_test56_flagship_runtime.py
          elif grep -q 'versionCode = 456' "$BUILD"; then
            echo 'test56 sources already generated'
          else
            echo 'Unexpected version baseline' >&2
            exit 1
          fi

      - name: Verify generated sources
        shell: bash
        run: |
          set -euo pipefail
          BUILD=android-app/app/build.gradle.kts
          REF=android-app/app/src/main/java/io/github/xgl34222220/bichen/ReferenceProxyActivity.kt
          PROFILE=android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyRuntimeProfile.java
          MANAGER=android-app/app/src/main/java/io/github/xgl34222220/bichen/RootProxyManager.java
          CFG=android-app/app/src/main/java/io/github/xgl34222220/bichen/MihomoStartupConfig.java
          ROOTSH=android-app/app/src/main/assets/proxy-root-v3.sh
          ADB=android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyAdblockChainActivity.kt
          APPS=android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyAppSelectionActivity.kt
          YAML=android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxySubscriptionActivity.kt
          grep -q 'versionCode = 456' "$BUILD"
          grep -q 'versionName = "0.4.0-test.56"' "$BUILD"
          grep -q 'case TUN:return new Capability(true' "$PROFILE"
          grep -q 'case EBPF:return new Capability(true' "$PROFILE"
          grep -q 'profile.mode!=ProxyRuntimeProfile.Mode.TUN' "$MANAGER"
          grep -q 'profile.mode!=ProxyRuntimeProfile.Mode.EBPF' "$MANAGER"
          grep -q 'device: bichen0' "$CFG"
          grep -q 'redirect-to-tun' "$CFG"
          grep -q 'tproxy|redirect|enhance|tun|ebpf' "$ROOTSH"
          grep -q 'ip link show bichen0' "$ROOTSH"
          grep -q 'cachedRules' "$ADB"
          grep -q '保护强度' "$ADB"
          grep -q 'proxyUiLastWan' "$REF"
          ! grep -q 'key(tab)' "$REF"
          ! grep -q 'tabFade' "$REF"
          grep -q 'heroCheckGlow' "$REF"
          grep -q 'ruleSetSucceeded' "$REF"
          grep -q 'appSkeletonShimmer' "$APPS"
          grep -q 'Box(Modifier.width(1.dp).fillMaxHeight()' "$YAML"

      - name: Commit generated test56 sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            android-app/app/build.gradle.kts \
            android-app/app/src/main/assets/proxy-root-v3.sh \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyRuntimeProfile.java \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/MihomoStartupConfig.java \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/RootProxyManager.java \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/ReferenceProxyActivity.kt \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyAdblockChainActivity.kt \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/ui/BichenComposeController.kt \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyAppSelectionActivity.kt \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxySubscriptionActivity.kt \
            android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyAdvancedSettingsActivity.kt
          if ! git diff --cached --quiet; then
            git commit -m 'Enable TUN/eBPF and remove startup/UI flash in 0.4.0-test.56 [skip ci]'
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false

      - name: Reuse verified test55 runtime
        uses: actions/download-artifact@v4
        with:
          name: Bichen-0.4.0-test.55-Dedicated-Settings-Routes
          path: previous-artifact
          github-token: ${{ github.token }}
          repository: xgl34222220-ops/pichen
          run-id: 35242567987

      - name: Restore native runtime
        shell: bash
        run: |
          set -euo pipefail
          PREV=$(find previous-artifact -name '*.apk' -type f | head -n 1)
          test -n "$PREV"
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a android-app/app/src/main/jniLibs/x86_64
          mkdir -p android-app/app/src/main/assets/mihomo-root/arm64-v8a android-app/app/src/main/assets/mihomo-root/x86_64
          unzip -p "$PREV" lib/arm64-v8a/libbichen_core.so > android-app/app/src/main/jniLibs/arm64-v8a/libbichen_core.so
          unzip -p "$PREV" lib/x86_64/libbichen_core.so > android-app/app/src/main/jniLibs/x86_64/libbichen_core.so
          unzip -p "$PREV" assets/mihomo-root/arm64-v8a/mihomo > android-app/app/src/main/assets/mihomo-root/arm64-v8a/mihomo
          unzip -p "$PREV" assets/mihomo-root/x86_64/mihomo > android-app/app/src/main/assets/mihomo-root/x86_64/mihomo
          unzip -p "$PREV" assets/MIHOMO-LICENSE > android-app/app/src/main/assets/MIHOMO-LICENSE
          unzip -p "$PREV" assets/mihomo-revision.txt > android-app/app/src/main/assets/mihomo-revision.txt

      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/mihomo-root/arm64-v8a/mihomo'

      - uses: actions/upload-artifact@v4
        with:
          name: Bichen-0.4.0-test.56-Flagship-Runtime-Polish
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
