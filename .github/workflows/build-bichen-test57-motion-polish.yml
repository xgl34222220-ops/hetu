name: Build Bichen 0.4.0-test.57 motion polish

on:
  push:
    branches: ['release/bichen-0.4.0-test.57']

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: github.event.head_commit.message == 'Build Bichen 0.4.0-test.57 motion polish'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply test57 motion polish
        shell: bash
        run: |
          set -euo pipefail
          BUILD=android-app/app/build.gradle.kts
          if grep -q 'versionCode = 456' "$BUILD"; then
            python3 tools/apply_test57_motion_polish.py
          elif grep -q 'versionCode = 457' "$BUILD"; then
            echo 'test57 sources already generated'
          else
            echo 'Unexpected version baseline' >&2
            exit 1
          fi

      - name: Verify generated sources
        shell: bash
        run: |
          set -euo pipefail
          BUILD=android-app/app/build.gradle.kts
          REF=android-app/app/src/main/java/io/github/xgl34222220/bichen/ReferenceProxyActivity.kt
          APPS=android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyAppSelectionActivity.kt
          WEB=android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyWebUiActivity.kt
          YAML=android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxySubscriptionActivity.kt
          ADB=android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyAdblockChainActivity.kt
          STYLES=android-app/app/src/main/res/values/styles.xml
          grep -q 'versionCode = 457' "$BUILD"
          grep -q 'versionName = "0.4.0-test.57"' "$BUILD"
          grep -q 'BichenSharedAxisWindowAnimation' "$STYLES"
          test -f android-app/app/src/main/res/anim/bichen_route_open_enter.xml
          test -f android-app/app/src/main/res/anim/bichen_route_open_exit.xml
          test -f android-app/app/src/main/res/anim/bichen_route_close_enter.xml
          test -f android-app/app/src/main/res/anim/bichen_route_close_exit.xml
          grep -q 'rotationY = flip.value' "$REF"
          grep -q 'delay(index \* 30L)' "$REF"
          grep -q 'clip = false' "$REF"
          grep -q 'padding(start = 14.dp, top = 16.dp' "$REF"
          grep -q 'calculateBottomPadding() + 164.dp' "$REF"
          grep -q 'appSkeletonShimmer' "$APPS"
          grep -q 'tween(1200' "$APPS"
          grep -q 'appListReveal' "$APPS"
          grep -q 'webSkeletonShimmer' "$WEB"
          grep -q 'webContentReveal' "$WEB"
          grep -q 'val imeVisible = WindowInsets.ime.getBottom' "$YAML"
          grep -q 'visible = !imeVisible' "$YAML"
          grep -q 'adblockUpdateMorphWidth' "$ADB"
          grep -q 'updatingRules' "$ADB"

      - name: Commit generated test57 sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             android-app/app/build.gradle.kts             android-app/app/src/main/res/values/styles.xml             android-app/app/src/main/res/anim/bichen_route_open_enter.xml             android-app/app/src/main/res/anim/bichen_route_open_exit.xml             android-app/app/src/main/res/anim/bichen_route_close_enter.xml             android-app/app/src/main/res/anim/bichen_route_close_exit.xml             android-app/app/src/main/java/io/github/xgl34222220/bichen/ReferenceProxyActivity.kt             android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyAppSelectionActivity.kt             android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyWebUiActivity.kt             android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxySubscriptionActivity.kt             android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyAdblockChainActivity.kt
          if ! git diff --cached --quiet; then
            git commit -m 'Polish route motion, loading transitions and clipping in 0.4.0-test.57 [skip ci]'
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false

      - name: Reuse verified test56 runtime
        uses: actions/download-artifact@v4
        with:
          name: Bichen-0.4.0-test.56-Flagship-Runtime-Polish-Final
          path: previous-artifact
          github-token: ${{ github.token }}
          repository: xgl34222220-ops/pichen
          run-id: 35246804208

      - name: Restore native runtime
        shell: bash
        run: |
          set -euo pipefail
          PREV=$(find previous-artifact -name '*.apk' -type f | head -n 1)
          test -n "$PREV"
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a android-app/app/src/main/jniLibs/x86_64
          mkdir -p android-app/app/src/main/assets/mihomo-root/arm64-v8a android-app/app/src/main/assets/mihomo-root/x86_64
          unzip -p "$PREV" lib/arm64-v8a/libbichen_core.so > android-app/app/src/main/jniLibs/arm64-v8a/libbichen_core.so
          unzip -p "$PREV" lib/x86_64/libbichen_core.so > android-app/app/src/main/jniLibs/x86_64/libbichen_core.so
          unzip -p "$PREV" assets/mihomo-root/arm64-v8a/mihomo > android-app/app/src/main/assets/mihomo-root/arm64-v8a/mihomo
          unzip -p "$PREV" assets/mihomo-root/x86_64/mihomo > android-app/app/src/main/assets/mihomo-root/x86_64/mihomo
          unzip -p "$PREV" assets/MIHOMO-LICENSE > android-app/app/src/main/assets/MIHOMO-LICENSE
          unzip -p "$PREV" assets/mihomo-revision.txt > android-app/app/src/main/assets/mihomo-revision.txt

      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/mihomo-root/arm64-v8a/mihomo'

      - uses: actions/upload-artifact@v4
        with:
          name: Bichen-0.4.0-test.57-Route-Motion-Polish
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
