name: Build Bichen 0.4.0-test.59 WeChat coldstart polish

on:
  push:
    branches: ['release/bichen-0.4.0-test.59']

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: github.event.head_commit.message == 'Build Bichen 0.4.0-test.59 WeChat coldstart polish'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify test59 source invariants
        shell: bash
        run: |
          set -euo pipefail
          BUILD=android-app/app/build.gradle.kts
          REF=android-app/app/src/main/java/io/github/xgl34222220/bichen/ReferenceProxyActivity.kt
          ROOT=android-app/app/src/main/java/io/github/xgl34222220/bichen/RootProxyManager.java
          POLICY=android-app/app/src/main/java/io/github/xgl34222220/bichen/RootProxyPolicy.java
          STARTUP=android-app/app/src/main/java/io/github/xgl34222220/bichen/MihomoStartupConfig.java
          SH=android-app/app/src/main/assets/proxy-root-v3.sh
          ADB=android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyAdblockChainActivity.kt

          grep -q 'versionCode = 459' "$BUILD"
          grep -q 'versionName = "0.4.0-test.59"' "$BUILD"

          grep -q 'extractDirectProcessPackages' "$STARTUP"
          grep -q 'directUidRanges' "$POLICY"
          grep -q 'policy.directUidRanges' "$ROOT"
          grep -q 'proxyAutoDirectPackageCount' "$ROOT"

          grep -q 'DIRECT_UIDS="${17}"' "$SH"
          grep -q 'START_DIRECT_UIDS="${19}"' "$SH"
          grep -q 'direct_uid_returns' "$SH"
          grep -q '\[ "$#" = 18 \]' "$SH"
          grep -q '\[ "$#" = 20 \]' "$SH"
          sh -n "$SH"

          DNS4=$(awk '/^install_dns_redirect4\(\)/,/^install_dns_redirect6\(\)/' "$SH")
          DNS6=$(awk '/^install_dns_redirect6\(\)/,/^install_quic4\(\)/' "$SH")
          ! printf '%s' "$DNS4" | grep -q 'direct_uid_returns'
          ! printf '%s' "$DNS6" | grep -q 'direct_uid_returns'

          grep -q 'proxyUiLastConnectionCount' "$REF"
          grep -q 'transientColdGap' "$REF"
          grep -q 'delay(320)' "$REF"
          grep -q 'latencyValueFade' "$REF"
          grep -q 'history += Triple(now, upRate, downRate)' "$REF"
          grep -q 'transformOrigin = TransformOrigin.Center' "$REF"

          grep -q '运行链验证' "$ADB"
          grep -q 'startupInjected' "$ADB"
          grep -q 'controllerLoaded' "$ADB"
          grep -q 'Modifier.fillMaxWidth().height(48.dp)' "$ADB"
          ! grep -q 'adblockUpdateMorphWidth' "$ADB"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false

      - name: Reuse verified test58 native runtime
        uses: actions/download-artifact@v4
        with:
          name: Bichen-0.4.0-test.58-Render-Modal-Polish
          path: previous-artifact
          github-token: ${{ github.token }}
          repository: xgl34222220-ops/pichen
          run-id: 35287056492

      - name: Restore native runtime
        shell: bash
        run: |
          set -euo pipefail
          PREV=$(find previous-artifact -name '*.apk' -type f | head -n 1)
          test -n "$PREV"
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a android-app/app/src/main/jniLibs/x86_64
          mkdir -p android-app/app/src/main/assets/mihomo-root/arm64-v8a android-app/app/src/main/assets/mihomo-root/x86_64
          unzip -p "$PREV" lib/arm64-v8a/libbichen_core.so > android-app/app/src/main/jniLibs/arm64-v8a/libbichen_core.so
          unzip -p "$PREV" lib/x86_64/libbichen_core.so > android-app/app/src/main/jniLibs/x86_64/libbichen_core.so
          unzip -p "$PREV" assets/mihomo-root/arm64-v8a/mihomo > android-app/app/src/main/assets/mihomo-root/arm64-v8a/mihomo
          unzip -p "$PREV" assets/mihomo-root/x86_64/mihomo > android-app/app/src/main/assets/mihomo-root/x86_64/mihomo
          unzip -p "$PREV" assets/MIHOMO-LICENSE > android-app/app/src/main/assets/MIHOMO-LICENSE
          unzip -p "$PREV" assets/mihomo-revision.txt > android-app/app/src/main/assets/mihomo-revision.txt

      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK payload
        shell: bash
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/proxy-root-v3.sh'
          unzip -l "$APK" | grep -q 'assets/mihomo-root/arm64-v8a/mihomo'
          unzip -p "$APK" assets/proxy-root-v3.sh | grep -q 'START_DIRECT_UIDS'

      - uses: actions/upload-artifact@v4
        with:
          name: Bichen-0.4.0-test.59-WeChat-Coldstart-Verify
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
