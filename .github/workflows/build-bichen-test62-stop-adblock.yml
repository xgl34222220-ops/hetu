name: Build Bichen 0.4.0-test.62 stop adblock telemetry

on:
  push:
    branches: ['release/bichen-0.4.0-test.62']

permissions:
  contents: read
  actions: read

jobs:
  build:
    if: github.event.head_commit.message == 'Build Bichen 0.4.0-test.62 stop adblock telemetry'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Verify test62 source invariants
        shell: bash
        run: |
          set -euo pipefail
          BUILD=android-app/app/build.gradle.kts
          BOOT=android-app/app/src/main/java/io/github/xgl34222220/bichen/BootReceiver.java
          ROOT=android-app/app/src/main/java/io/github/xgl34222220/bichen/RootProxyManager.java
          MATCH=android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyNetworkMatchService.java
          INSPECTOR=android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyRuntimeInspector.kt
          ADB=android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyAdblockChainActivity.kt
          PROFILES=android-app/app/src/main/java/io/github/xgl34222220/bichen/RuleProfiles.java
          POLICY=android-app/app/src/main/java/io/github/xgl34222220/bichen/RootProxyPolicy.java
          ADBRULES=android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyAdblockRules.java
          STARTUP=android-app/app/src/main/java/io/github/xgl34222220/bichen/MihomoStartupConfig.java
          SH=android-app/app/src/main/assets/proxy-root-v3.sh

          grep -q 'versionCode = 462' "$BUILD"
          grep -q 'versionName = "0.4.0-test.62"' "$BUILD"

          grep -q 'replaceRunningAfterUpgrade' "$ROOT"
          grep -q 'existing.optBoolean("running",false)&&!replaceRunning' "$ROOT"
          grep -q 'root.replaceRunningAfterUpgrade' "$BOOT"
          ! awk '/ACTION_MY_PACKAGE_REPLACED/{f=1} /BOOT_COMPLETED/{if(f){exit}} f' "$BOOT" | grep -q 'root.stop()'

          grep -q 'shouldStopAfterStabilize' "$MATCH"
          grep -q 'proxyLastAutoStopReason' "$MATCH"
          grep -q 'SystemClock.sleep(3500L)' "$MATCH"

          grep -q 'adblockRuntimeStats' "$INSPECTOR"
          grep -q 'recentDomains' "$INSPECTOR"
          grep -q 'proxyRootUpgradeError' "$INSPECTOR"
          grep -q 'proxyLastAutoStopReason' "$INSPECTOR"

          grep -q 'hitCountSource' "$ADB"
          grep -q 'recentBlockedDomains' "$ADB"
          grep -q '最近拦截' "$ADB"
          grep -q 'Mihomo 运行日志' "$ADB"

          grep -q 'case "balanced"' "$PROFILES"
          grep -A5 'case "balanced"' "$PROFILES" | grep -q 'hagezi = true'
          grep -A6 'case "enhanced"' "$PROFILES" | grep -q 'tracking = true'
          grep -q 'legacy-balanced' "$PROFILES"

          # test61 data-plane fixes must remain
          grep -q 'directUids.add(self.uid)' "$POLICY"
          grep -Fq 'out.write(childAllow ? domain : "+." + domain)' "$ADBRULES"
          grep -q 'isSpecificDirectWhitelist' "$STARTUP"
          grep -q 'START_DIRECT_UIDS' "$SH"
          grep -q 'direct_uid_returns' "$SH"
          sh -n "$SH"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false

      - name: Reuse verified test61 native runtime
        uses: actions/download-artifact@v4
        with:
          name: Bichen-0.4.0-test.61-Connection-Adblock-Polish
          path: previous-artifact
          github-token: ${{ github.token }}
          repository: xgl34222220-ops/pichen
          run-id: 35293464565

      - name: Restore native runtime
        shell: bash
        run: |
          set -euo pipefail
          PREV=$(find previous-artifact -name '*.apk' -type f | head -n 1)
          test -n "$PREV"
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a android-app/app/src/main/jniLibs/x86_64
          mkdir -p android-app/app/src/main/assets/mihomo-root/arm64-v8a android-app/app/src/main/assets/mihomo-root/x86_64
          unzip -p "$PREV" lib/arm64-v8a/libbichen_core.so > android-app/app/src/main/jniLibs/arm64-v8a/libbichen_core.so
          unzip -p "$PREV" lib/x86_64/libbichen_core.so > android-app/app/src/main/jniLibs/x86_64/libbichen_core.so
          unzip -p "$PREV" assets/mihomo-root/arm64-v8a/mihomo > android-app/app/src/main/assets/mihomo-root/arm64-v8a/mihomo
          unzip -p "$PREV" assets/mihomo-root/x86_64/mihomo > android-app/app/src/main/assets/mihomo-root/x86_64/mihomo
          unzip -p "$PREV" assets/MIHOMO-LICENSE > android-app/app/src/main/assets/MIHOMO-LICENSE
          unzip -p "$PREV" assets/mihomo-revision.txt > android-app/app/src/main/assets/mihomo-revision.txt

      - name: Build debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK payload
        shell: bash
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'assets/proxy-root-v3.sh'
          unzip -l "$APK" | grep -q 'assets/mihomo-root/arm64-v8a/mihomo'
          unzip -p "$APK" assets/proxy-root-v3.sh | grep -q 'START_DIRECT_UIDS'

      - uses: actions/upload-artifact@v4
        with:
          name: Bichen-0.4.0-test.62-Stop-Adblock-Telemetry
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
