name: Hetu Android build

on:
  push:
    branches: ['feature/hetu-rebrand-root-app']
    paths:
      - 'android-app/**'
      - 'native/**'
      - 'tools/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
      - '.gitignore'
      - '.github/workflows/build-hetu.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hetu-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  network-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fault injection and real isolated kernel packet test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p network-reports
          python3 tools/test_startup_lifecycle.py | tee network-reports/startup-lifecycle.txt
          python3 tools/test_network_integrity.py | tee network-reports/fault-injection.txt
          python3 tools/test_optional_ipv6_nat.py | tee network-reports/optional-ipv6-nat.txt
          command -v iptables
          command -v iptables-restore
          sudo python3 tools/test_network_namespace.py 2>&1 | tee network-reports/kernel-packets.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hetu-Network-Regression
          path: network-reports/
          retention-days: 14
          if-no-files-found: warn

  build:
    needs: network-kernel
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify source identity and runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_ui_audit_invariants.py
          test ! -d module
          test ! -d android-app/app/src/main/java/io/github/xgl34222220/bichen
          grep -Fq 'versionName = "0.4.0-test.114"' android-app/app/build.gradle.kts
          grep -Fq 'versionCode = 514' android-app/app/build.gradle.kts
          grep -Fq 'android:icon="@drawable/ic_hetu_official"' android-app/app/src/main/AndroidManifest.xml
          sh -n android-app/app/src/main/assets/hetu-root.sh
          sh -n android-app/app/src/main/assets/hetu-route.sh
          git diff --check

      - uses: actions/checkout@v4
        with:
          repository: MetaCubeX/mihomo
          ref: v1.19.31
          path: .upstream
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: .upstream/go.sum
      - name: Prepare Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort | tail -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify message filtering and connection continuity
        run: |
          python3 tools/test_proxy_continuity.py --android-jar "$ANDROID_HOME/platforms/android-37.0/android.jar" --fixture "$RUNNER_TEMP/hetu-continuity.yaml"
          python3 tools/test_adblock_inspection.py --android-jar "$ANDROID_HOME/platforms/android-37.0/android.jar"
          python3 tools/test_root_ipv6.py
          python3 tools/test_root_controller.py
      - name: Build Hetu JNI bridge and Root Mihomo
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prepare_root_mihomo.py .upstream
          cp -r native/bridge .upstream/hetubridge
          cd .upstream
          MIHOMO_VERSION="1.19.31"
          MIHOMO_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          MIHOMO_ROOT_LDFLAGS="-s -w -X github.com/metacubex/mihomo/constant.Version=$MIHOMO_VERSION -X github.com/metacubex/mihomo/constant.BuildTime=$MIHOMO_BUILD_TIME -extldflags=-Wl,-z,max-page-size=16384"
          go test -v ./component/keepalive
          HETU_RUNTIME_FIXTURE="$RUNNER_TEMP/hetu-continuity.yaml" go test -tags with_gvisor,hetu_root -v ./hetubridge ./component/keepalive
          NDK="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p ../android-app/app/src/main/jniLibs/arm64-v8a ../android-app/app/src/main/jniLibs/x86_64
          mkdir -p ../android-app/app/src/main/assets/mihomo-root/arm64-v8a ../android-app/app/src/main/assets/mihomo-root/x86_64
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="$NDK/aarch64-linux-android26-clang" \
            go build -tags with_gvisor -trimpath -buildmode=c-shared \
            -ldflags='-s -w -extldflags=-Wl,-z,max-page-size=16384' \
            -o ../android-app/app/src/main/jniLibs/arm64-v8a/libhetu_core.so ./hetubridge
          CGO_ENABLED=1 GOOS=android GOARCH=amd64 CC="$NDK/x86_64-linux-android26-clang" \
            go build -tags with_gvisor -trimpath -buildmode=c-shared \
            -ldflags='-s -w -extldflags=-Wl,-z,max-page-size=16384' \
            -o ../android-app/app/src/main/jniLibs/x86_64/libhetu_core.so ./hetubridge
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="$NDK/aarch64-linux-android26-clang" \
            go build -tags with_gvisor,hetu_root -trimpath \
            -ldflags="$MIHOMO_ROOT_LDFLAGS" \
            -o ../android-app/app/src/main/assets/mihomo-root/arm64-v8a/mihomo .
          CGO_ENABLED=1 GOOS=android GOARCH=amd64 CC="$NDK/x86_64-linux-android26-clang" \
            go build -tags with_gvisor,hetu_root -trimpath \
            -ldflags="$MIHOMO_ROOT_LDFLAGS" \
            -o ../android-app/app/src/main/assets/mihomo-root/x86_64/mihomo .
          cp LICENSE ../android-app/app/src/main/assets/MIHOMO-LICENSE
          git rev-parse HEAD > ../android-app/app/src/main/assets/mihomo-revision.txt
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false
      - name: Render UI regressions and build Hetu debug APK
        working-directory: android-app
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify APK identity and payload
        shell: bash
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          AAPT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/37.0.0/aapt"
          BADGING=$("$AAPT" dump badging "$APK")
          printf '%s\n' "$BADGING" | grep -q "package: name='io.github.xgl34222220.hetu.preview'"
          printf '%s\n' "$BADGING" | grep -q "application-label:'河图'"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libhetu_core.so'
          unzip -l "$APK" | grep -q 'assets/mihomo-root/arm64-v8a/mihomo'
          unzip -l "$APK" | grep -q 'assets/hetu-root.sh'
          unzip -l "$APK" | grep -q 'assets/hetu-route.sh'
          ! unzip -l "$APK" | grep -q 'assets/proxy-root'
          ! unzip -l "$APK" | grep -q 'assets/tproxy-root'
          unzip -l "$APK" | grep -q 'assets/rules/adaway.txt'
          ! unzip -l "$APK" | grep -q 'libbichen_core.so'
      - uses: actions/upload-artifact@v4
        with:
          name: Hetu-Debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload UI test reports and real rendered frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hetu-UI-Regression
          path: |
            android-app/app/build/reports/ui-audit/
            android-app/app/build/reports/tests/testDebugUnitTest/
            android-app/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14
