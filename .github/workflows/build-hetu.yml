name: Hetu Android build

on:
  push:
    branches: ['feature/hetu-rebrand-root-app']
    paths:
      - 'android-app/**'
      - 'native/**'
      - 'README.md'
      - '.gitignore'
      - '.github/workflows/build-hetu.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hetu-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Verify Hetu source invariants
        shell: bash
        run: |
          set -euo pipefail
          test ! -d module
          test -d android-app/app/src/main/java/io/github/xgl34222220/hetu
          test ! -d android-app/app/src/main/java/io/github/xgl34222220/bichen
          grep -q 'namespace = "io.github.xgl34222220.hetu"' android-app/app/build.gradle.kts
          grep -q 'applicationId = "io.github.xgl34222220.hetu"' android-app/app/build.gradle.kts
          grep -q 'version = release(37)' android-app/app/build.gradle.kts
          grep -q 'minorApiLevel = 0' android-app/app/build.gradle.kts
          grep -q 'android:label="河图"' android-app/app/src/main/AndroidManifest.xml
          grep -q 'private static final String ROOT="/data/adb/hetu";' android-app/app/src/main/java/io/github/xgl34222220/hetu/RootProxyManager.java
          ! grep -R '/data/adb/hetu/proxy' android-app/app/src/main native README.md
          ! grep -R 'io.github.xgl34222220.bichen' android-app/app/src/main native README.md --exclude=LegacyAppMigrator.java
          grep -q 'io.github.xgl34222220.bichen' android-app/app/src/main/java/io/github/xgl34222220/hetu/LegacyAppMigrator.java
          ! grep -R 'ModuleInstaller\|ModuleArchive' android-app/app/src/main
          test -f android-app/app/src/main/assets/sources.tsv
          test -f android-app/app/src/main/assets/hetu-root.sh
          test ! -f android-app/app/src/main/assets/proxy-root-v3.sh
          test ! -f android-app/app/src/main/assets/proxy-root.sh
          test ! -f android-app/app/src/main/assets/tproxy-root.sh
          test -f android-app/app/src/main/assets/hetu-route.sh
          sh -n android-app/app/src/main/assets/hetu-root.sh
          sh -n android-app/app/src/main/assets/hetu-route.sh
          grep -q 'copyAsset("hetu-root.sh",script,true)' android-app/app/src/main/java/io/github/xgl34222220/hetu/RootProxyManager.java
          test -f android-app/app/src/main/assets/rules/adaway.txt
          test -f android-app/app/src/main/assets/rules/china.txt
          test -f android-app/app/src/main/assets/rules/tracking.txt
          test -f android-app/app/src/main/assets/rules/hagezi.txt
          grep -q 'System.loadLibrary("hetu_core")' android-app/app/src/main/java/io/github/xgl34222220/hetu/MihomoNative.java
          grep -q 'Java_io_github_xgl34222220_hetu_MihomoNative_invoke' native/bridge/jni_android.c
          grep -q 'Java_io_github_xgl34222220_hetu_preview_MihomoNative_invoke' native/bridge/jni_android.c
          grep -q 'versionName = "0.4.0-test.69"' android-app/app/build.gradle.kts
          test -f android-app/app/src/main/java/io/github/xgl34222220/hetu/LegacyAppMigrator.java
          grep -q 'LegacyAppMigrator.migrateIfNeeded(app)' android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxyComposeController.kt
          grep -q 'controller.restart { operation = it }' android-app/app/src/main/java/io/github/xgl34222220/hetu/ReferenceProxyActivity.kt
          grep -q 'replaceRunningAfterUpgrade(profile)' android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxyComposeController.kt
          grep -q 'dataPlaneHealthy' android-app/app/src/main/assets/hetu-root.sh
          grep -q "printf 'DNS=%s" android-app/app/src/main/assets/hetu-root.sh
          grep -q "printf 'DNS_PORT=%s" android-app/app/src/main/assets/hetu-root.sh
          grep -q 'dataPlaneHealthy' android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxyComposeController.kt
          grep -q 'default-network-stable-2500ms' android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxyNetworkMatchService.java
          grep -q 'getBoolean("floatingBottomBar", true)' android-app/app/src/main/java/io/github/xgl34222220/hetu/ui/HetuGlassDock.kt
          grep -q 'getBoolean("enableBlur", true)' android-app/app/src/main/java/io/github/xgl34222220/hetu/ui/HetuGlassDock.kt
          grep -q 'getBoolean("liquidGlass", true)' android-app/app/src/main/java/io/github/xgl34222220/hetu/ui/HetuGlassDock.kt
          ! grep -q 'val floating = true' android-app/app/src/main/java/io/github/xgl34222220/hetu/ui/HetuGlassDock.kt
          ! grep -q 'val enableBlur = true' android-app/app/src/main/java/io/github/xgl34222220/hetu/ui/HetuGlassDock.kt
          ! grep -q 'val activeGlass = true' android-app/app/src/main/java/io/github/xgl34222220/hetu/ui/HetuGlassDock.kt
          ! grep -q 'topBarBlurStyle' android-app/app/src/main/java/io/github/xgl34222220/hetu/ThemeSettingsActivity.kt
          ! grep -q 'predictiveBack' android-app/app/src/main/java/io/github/xgl34222220/hetu/ThemeSettingsActivity.kt
          grep -q 'controllerPort = status.optInt' android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxyComposeController.kt
          grep -Fq '127.0.0.1:${state.controllerPort}' android-app/app/src/main/java/io/github/xgl34222220/hetu/ReferenceProxyActivity.kt
          grep -q 'val renderGlass = activeGlass && enableBlur' android-app/app/src/main/java/io/github/xgl34222220/hetu/ui/HetuGlassDock.kt
          ! grep -q '<alpha' android-app/app/src/main/res/anim/hetu_route_open_enter.xml
          ! grep -q '<scale' android-app/app/src/main/res/anim/hetu_route_open_enter.xml
          ! grep -q '<alpha' android-app/app/src/main/res/anim/hetu_route_open_exit.xml
          ! grep -q '<scale' android-app/app/src/main/res/anim/hetu_route_open_exit.xml
          grep -Fq 'Color(0xFFE2E8F0).copy(alpha = .80f)' android-app/app/src/main/java/io/github/xgl34222220/hetu/ReferenceProxyActivity.kt
          ! grep -Fq 'RefSmallTool("运行日志"' android-app/app/src/main/java/io/github/xgl34222220/hetu/ReferenceProxyActivity.kt
          grep -Fq 'color = Color.Transparent,' android-app/app/src/main/java/io/github/xgl34222220/hetu/ReferenceProxyActivity.kt
          grep -q 'android:launchMode="singleTop"' android-app/app/src/main/AndroidManifest.xml
          grep -Fq 'val indicatorPosition = remember { Animatable(targetIndex.toFloat()) }' android-app/app/src/main/java/io/github/xgl34222220/hetu/ui/HetuGlassDock.kt
          grep -Fq 'blur(24.dp.toPx(), 24.dp.toPx())' android-app/app/src/main/java/io/github/xgl34222220/hetu/ui/HetuGlassDock.kt
          grep -Fq 'Color(0xFFF8FBFF).copy(alpha = .34f)' android-app/app/src/main/java/io/github/xgl34222220/hetu/ui/HetuGlassDock.kt
          grep -q 'ModalBottomSheet(' android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxySubscriptionActivity.kt
          ! grep -q 'AlertDialog(' android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxySubscriptionActivity.kt
          grep -Fq '${it.updatedAt}-${it.upload}-${it.download}-${it.total}-${it.expire}' android-app/app/src/main/java/io/github/xgl34222220/hetu/ReferenceProxyActivity.kt
          grep -Fq '.height(90.dp)' android-app/app/src/main/java/io/github/xgl34222220/hetu/ReferenceProxyActivity.kt
          grep -Fq 'Color(0xFF2563EB).copy(alpha = .08f)' android-app/app/src/main/java/io/github/xgl34222220/hetu/ui/HetuGlassDock.kt
          ! grep -Fq 'Color(0xFFEFF6FF).copy(alpha = .90f)' android-app/app/src/main/java/io/github/xgl34222220/hetu/ui/HetuGlassDock.kt
          grep -Fq 'liveProviders by remember' android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxySubscriptionActivity.kt
          grep -Fq 'subscriptionBytes(provider.used)' android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxySubscriptionActivity.kt
          grep -Fq '1.5.dp else .7.dp' android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxySubscriptionActivity.kt
          grep -Fq 'YAML 语法大纲' android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxySubscriptionActivity.kt
          grep -Fq 'YamlAccessoryKey("Tab")' android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxySubscriptionActivity.kt
          grep -Fq 'YamlAccessoryKey("撤销"' android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxySubscriptionActivity.kt
          grep -Fq 'TextButton(onClick = ::saveYaml' android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxySubscriptionActivity.kt
          grep -Fq 'gutterStartLine' android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxySubscriptionActivity.kt
          grep -Fq 'gutterEndLine = minOf(lineCount, gutterStartLine + 40)' android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxySubscriptionActivity.kt
          grep -Fq 'outputTransformation = if (highlightEnabled)' android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxySubscriptionActivity.kt
          grep -Fq 'YamlAccessoryKey("2空格")' android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxySubscriptionActivity.kt
          grep -Fq 'yamlLocalLint(currentText)' android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxySubscriptionActivity.kt
          grep -Fq 'subscriptionUpdatedLabel(provider.updatedAt)' android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxySubscriptionActivity.kt
          grep -Fq 'root.validateConfigText(text)' android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxyComposeController.kt
          grep -Fq 'void validateConfigText(String text)' android-app/app/src/main/java/io/github/xgl34222220/hetu/RootProxyManager.java
          grep -Fq '.background(t.pageBackground)' android-app/app/src/main/java/io/github/xgl34222220/hetu/ReferenceFileManagerActivity.kt
          grep -Fq '.background(tokens.pageBackground)' android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxyCoreActivity.kt
          grep -q 'head -c \$((END-START+1))' android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxyNetworkMatchService.java
          test ! -f android-app/app/src/main/java/io/github/xgl34222220/hetu/LuoShuProxyV3Activity.kt
          test ! -f android-app/app/src/main/java/io/github/xgl34222220/hetu/LuoShuProxyV2Activity.kt
          test ! -f android-app/app/src/main/java/io/github/xgl34222220/hetu/ProMaxProxyActivity.kt
          test ! -f android-app/app/src/main/java/io/github/xgl34222220/hetu/LuoShuProxyActivity.kt
          test ! -f android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxyDashboardActivity.kt
          test ! -f android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxyWorkspaceActivity.kt
          test ! -f android-app/app/src/main/java/io/github/xgl34222220/hetu/ComposeProxyActivity.kt
          test ! -f android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxyActivity.java

      - uses: actions/checkout@v4
        with:
          repository: MetaCubeX/mihomo
          ref: ac017cdd246ce8bd547653d927e7bf77d7ee73d5
          path: .upstream

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: .upstream/go.sum

      - name: Prepare Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort | tail -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358'

      - name: Build Hetu JNI bridge and Root Mihomo
        shell: bash
        run: |
          set -euo pipefail
          cp -r native/bridge .upstream/hetubridge
          cd .upstream
          go test -tags with_gvisor -v ./hetubridge
          NDK="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p ../android-app/app/src/main/jniLibs/arm64-v8a ../android-app/app/src/main/jniLibs/x86_64
          mkdir -p ../android-app/app/src/main/assets/mihomo-root/arm64-v8a ../android-app/app/src/main/assets/mihomo-root/x86_64
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="$NDK/aarch64-linux-android26-clang" \
            go build -tags with_gvisor -trimpath -buildmode=c-shared \
            -ldflags='-s -w -extldflags=-Wl,-z,max-page-size=16384' \
            -o ../android-app/app/src/main/jniLibs/arm64-v8a/libhetu_core.so ./hetubridge
          CGO_ENABLED=1 GOOS=android GOARCH=amd64 CC="$NDK/x86_64-linux-android26-clang" \
            go build -tags with_gvisor -trimpath -buildmode=c-shared \
            -ldflags='-s -w -extldflags=-Wl,-z,max-page-size=16384' \
            -o ../android-app/app/src/main/jniLibs/x86_64/libhetu_core.so ./hetubridge
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="$NDK/aarch64-linux-android26-clang" \
            go build -tags with_gvisor -trimpath \
            -ldflags='-s -w -extldflags=-Wl,-z,max-page-size=16384' \
            -o ../android-app/app/src/main/assets/mihomo-root/arm64-v8a/mihomo .
          CGO_ENABLED=1 GOOS=android GOARCH=amd64 CC="$NDK/x86_64-linux-android26-clang" \
            go build -tags with_gvisor -trimpath \
            -ldflags='-s -w -extldflags=-Wl,-z,max-page-size=16384' \
            -o ../android-app/app/src/main/assets/mihomo-root/x86_64/mihomo .
          cp LICENSE ../android-app/app/src/main/assets/MIHOMO-LICENSE
          git rev-parse HEAD > ../android-app/app/src/main/assets/mihomo-revision.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false

      - name: Build Hetu debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK identity and payload
        shell: bash
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          AAPT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/37.0.0/aapt"
          BADGING=$("$AAPT" dump badging "$APK")
          printf '%s\n' "$BADGING" | grep -q "package: name='io.github.xgl34222220.hetu.preview'"
          printf '%s\n' "$BADGING" | grep -q "application-label:'河图'"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libhetu_core.so'
          unzip -l "$APK" | grep -q 'assets/mihomo-root/arm64-v8a/mihomo'
          unzip -l "$APK" | grep -q 'assets/hetu-root.sh'
          unzip -l "$APK" | grep -q 'assets/hetu-route.sh'
          ! unzip -l "$APK" | grep -q 'assets/proxy-root'
          ! unzip -l "$APK" | grep -q 'assets/tproxy-root'
          unzip -l "$APK" | grep -q 'assets/rules/adaway.txt'
          ! unzip -l "$APK" | grep -q 'libbichen_core.so'

      - uses: actions/upload-artifact@v4
        with:
          name: Hetu-Debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
