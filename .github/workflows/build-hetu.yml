name: Hetu Android build

on:
  push:
    branches: ['feature/hetu-rebrand-root-app']
    paths:
      - 'android-app/**'
      - 'native/**'
      - 'tools/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
      - '.gitignore'
      - '.github/workflows/build-hetu.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hetu-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Verify Hetu source invariants
        shell: bash
        run: |
          set -euo pipefail
          test ! -d module
          test -d android-app/app/src/main/java/io/github/xgl34222220/hetu
          test ! -d android-app/app/src/main/java/io/github/xgl34222220/bichen
          grep -q 'namespace = "io.github.xgl34222220.hetu"' android-app/app/build.gradle.kts
          grep -q 'applicationId = "io.github.xgl34222220.hetu"' android-app/app/build.gradle.kts
          grep -q 'version = release(37)' android-app/app/build.gradle.kts
          grep -q 'minorApiLevel = 0' android-app/app/build.gradle.kts
          grep -q 'android:label="河图"' android-app/app/src/main/AndroidManifest.xml
          grep -q 'private static final String ROOT="/data/adb/hetu";' android-app/app/src/main/java/io/github/xgl34222220/hetu/RootProxyManager.java
          ! grep -R '/data/adb/hetu/proxy' android-app/app/src/main native README.md
          ! grep -R 'io.github.xgl34222220.bichen' android-app/app/src/main native README.md --exclude=LegacyAppMigrator.java
          grep -q 'io.github.xgl34222220.bichen' android-app/app/src/main/java/io/github/xgl34222220/hetu/LegacyAppMigrator.java
          ! grep -R 'ModuleInstaller\|ModuleArchive' android-app/app/src/main
          test -f android-app/app/src/main/assets/sources.tsv
          test -f android-app/app/src/main/assets/hetu-root.sh
          test ! -f android-app/app/src/main/assets/proxy-root-v3.sh
          test ! -f android-app/app/src/main/assets/proxy-root.sh
          test ! -f android-app/app/src/main/assets/tproxy-root.sh
          test -f android-app/app/src/main/assets/hetu-route.sh
          sh -n android-app/app/src/main/assets/hetu-root.sh
          sh -n android-app/app/src/main/assets/hetu-route.sh
          grep -q 'WROUT=HETU_WROUT' android-app/app/src/main/assets/hetu-root.sh
          grep -q 'install-udp-leak-guard' android-app/app/src/main/assets/hetu-root.sh
          grep -q 'scoped_reject_unmarked_udp' android-app/app/src/main/assets/hetu-root.sh
          grep -q 'insertRulesBeforeFinalMatch' android-app/app/src/main/java/io/github/xgl34222220/hetu/MihomoStartupConfig.java
          grep -q 'insertRuleBeforeSourceAdblockAnchor' android-app/app/src/main/java/io/github/xgl34222220/hetu/MihomoStartupConfig.java
          grep -Fq 'embeddedMihomoRevision()' android-app/app/src/main/java/io/github/xgl34222220/hetu/RootProxyManager.java
          ! grep -Fq 'asset:"+BuildConfig.VERSION_CODE' android-app/app/src/main/java/io/github/xgl34222220/hetu/RootProxyManager.java
          grep -Fq 'reloadCurrentConfig()' android-app/app/src/main/java/io/github/xgl34222220/hetu/RootProxyManager.java
          grep -Fq 'static synchronized Snapshot export' android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxyAdblockRules.java
          grep -Fq 'hetu-adblock.meta' android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxyAdblockRules.java
          grep -Fq 'START_PREVALIDATED' android-app/app/src/main/assets/hetu-root.sh
          grep -Fq 'directUidRanges,"1"' android-app/app/src/main/java/io/github/xgl34222220/hetu/RootProxyManager.java
          ! grep -Fq 'runCatching { controller.ensureRuntimeFiles() }' android-app/app/src/main/java/io/github/xgl34222220/hetu/ReferenceProxyActivity.kt
          grep -Fq 'message = controller.reload()' android-app/app/src/main/java/io/github/xgl34222220/hetu/ReferenceProxyActivity.kt
          grep -Fq 'sanitizeStrictDomainCompatibility(yaml)' android-app/app/src/main/java/io/github/xgl34222220/hetu/MihomoStartupConfig.java
          grep -Fq 'Hetu 1.19.30 compatibility: skipped invalid domain entry' android-app/app/src/main/java/io/github/xgl34222220/hetu/MihomoStartupConfig.java
          grep -Fq 'Mijia Cloud' tests/MihomoStartupConfigTest.java
          grep -Fq 'yamlMihomoStrictDomainIssue(text)' android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxySubscriptionActivity.kt
