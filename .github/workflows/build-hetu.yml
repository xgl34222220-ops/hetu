          test ! -f android-app/app/src/main/java/io/github/xgl34222220/hetu/LuoShuProxyV2Activity.kt
          test ! -f android-app/app/src/main/java/io/github/xgl34222220/hetu/ProMaxProxyActivity.kt
          test ! -f android-app/app/src/main/java/io/github/xgl34222220/hetu/LuoShuProxyActivity.kt
          test ! -f android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxyDashboardActivity.kt
          test ! -f android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxyWorkspaceActivity.kt
          test ! -f android-app/app/src/main/java/io/github/xgl34222220/hetu/ComposeProxyActivity.kt
          test ! -f android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxyActivity.java

      - uses: actions/checkout@v4
        with:
          repository: MetaCubeX/mihomo
          ref: ac017cdd246ce8bd547653d927e7bf77d7ee73d5
          path: .upstream

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: .upstream/go.sum

      - name: Prepare Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort | tail -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;28.2.13676358'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify message filtering and connection continuity
        run: |
          python3 tools/test_proxy_continuity.py --android-jar "$ANDROID_HOME/platforms/android-37.0/android.jar" --fixture "$RUNNER_TEMP/hetu-continuity.yaml"
          python3 tools/test_adblock_inspection.py --android-jar "$ANDROID_HOME/platforms/android-37.0/android.jar"
          python3 tools/test_root_ipv6.py
          python3 tools/test_root_controller.py

      - name: Build Hetu JNI bridge and Root Mihomo
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prepare_root_mihomo.py .upstream
          cp -r native/bridge .upstream/hetubridge
          cd .upstream
          go test -v ./component/keepalive
          HETU_RUNTIME_FIXTURE="$RUNNER_TEMP/hetu-continuity.yaml" go test -tags with_gvisor,hetu_root -v ./hetubridge ./component/keepalive
          NDK="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p ../android-app/app/src/main/jniLibs/arm64-v8a ../android-app/app/src/main/jniLibs/x86_64
          mkdir -p ../android-app/app/src/main/assets/mihomo-root/arm64-v8a ../android-app/app/src/main/assets/mihomo-root/x86_64
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="$NDK/aarch64-linux-android26-clang" \
            go build -tags with_gvisor -trimpath -buildmode=c-shared \
            -ldflags='-s -w -extldflags=-Wl,-z,max-page-size=16384' \
            -o ../android-app/app/src/main/jniLibs/arm64-v8a/libhetu_core.so ./hetubridge
          CGO_ENABLED=1 GOOS=android GOARCH=amd64 CC="$NDK/x86_64-linux-android26-clang" \
            go build -tags with_gvisor -trimpath -buildmode=c-shared \
            -ldflags='-s -w -extldflags=-Wl,-z,max-page-size=16384' \
            -o ../android-app/app/src/main/jniLibs/x86_64/libhetu_core.so ./hetubridge
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="$NDK/aarch64-linux-android26-clang" \
            go build -tags with_gvisor,hetu_root -trimpath \
            -ldflags='-s -w -extldflags=-Wl,-z,max-page-size=16384' \
            -o ../android-app/app/src/main/assets/mihomo-root/arm64-v8a/mihomo .
          CGO_ENABLED=1 GOOS=android GOARCH=amd64 CC="$NDK/x86_64-linux-android26-clang" \
            go build -tags with_gvisor,hetu_root -trimpath \
            -ldflags='-s -w -extldflags=-Wl,-z,max-page-size=16384' \
            -o ../android-app/app/src/main/assets/mihomo-root/x86_64/mihomo .
          cp LICENSE ../android-app/app/src/main/assets/MIHOMO-LICENSE
          git rev-parse HEAD > ../android-app/app/src/main/assets/mihomo-revision.txt

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false

      - name: Build Hetu debug APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK identity and payload
        shell: bash
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
          AAPT="${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/37.0.0/aapt"
          BADGING=$("$AAPT" dump badging "$APK")
          printf '%s\n' "$BADGING" | grep -q "package: name='io.github.xgl34222220.hetu.preview'"
          printf '%s\n' "$BADGING" | grep -q "application-label:'河图'"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libhetu_core.so'
          unzip -l "$APK" | grep -q 'assets/mihomo-root/arm64-v8a/mihomo'
          unzip -l "$APK" | grep -q 'assets/hetu-root.sh'
          unzip -l "$APK" | grep -q 'assets/hetu-route.sh'
          ! unzip -l "$APK" | grep -q 'assets/proxy-root'
          ! unzip -l "$APK" | grep -q 'assets/tproxy-root'
          unzip -l "$APK" | grep -q 'assets/rules/adaway.txt'
          ! unzip -l "$APK" | grep -q 'libbichen_core.so'

      - uses: actions/upload-artifact@v4
        with:
          name: Hetu-Debug
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
