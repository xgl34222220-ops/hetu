name: Build Bichen

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu Android image already contains cmdline-tools. Avoid
      # setup-android@v3 because its default legacy "tools" package is gone.
      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate Root proxy scripts
        shell: bash
        run: |
          bash -n android-app/app/src/main/assets/proxy-root.sh
          bash -n android-app/app/src/main/assets/tproxy-root.sh
      - name: Build module and source smoke packages
        run: python3 tools/package.py
      - name: Protocol, parser, and isolated module regression tests
        run: |
          python3 tools/test_java.py
          python3 -m unittest discover -s tests -p '*test.py' -v
      - name: Verify checked-in install packages
        run: python3 tools/verify_downloads.py
      - name: Upload test build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bichen-0.3.0-beta.1-test-build
          path: |
            out/*-module.zip
            out/*-source.zip
          if-no-files-found: error
          retention-days: 30
      # The current UI is Kotlin/Compose. Installable APKs are built by the
      # dedicated Compose/Android workflows; the legacy Java-only build_app.py
      # is intentionally not used as the pull-request gate here.
