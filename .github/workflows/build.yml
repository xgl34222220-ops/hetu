name: Build Bichen

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu Android image already includes sdkmanager. setup-android@v3
      # currently asks sdkmanager for the removed legacy package "tools" and fails
      # before our build starts, so install only the SDK components Bichen needs.
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore configured signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.BICHEN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            umask 077
            printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/bichen.keystore"
            echo "BICHEN_KEYSTORE=$RUNNER_TEMP/bichen.keystore" >> "$GITHUB_ENV"
          fi
      - name: Build module, APK, and source archive
        env:
          BICHEN_KEY_ALIAS: ${{ secrets.BICHEN_KEY_ALIAS || 'androiddebugkey' }}
          BICHEN_STOREPASS: ${{ secrets.BICHEN_STOREPASS || 'android' }}
          BICHEN_KEYPASS: ${{ secrets.BICHEN_KEYPASS || secrets.BICHEN_STOREPASS || 'android' }}
        run: python3 tools/package.py --build-app
      - name: Protocol, parser, and isolated module regression tests
        run: |
          python3 tools/test_java.py
          python3 -m unittest discover -s tests -p '*test.py' -v
      - name: Verify checked-in install packages
        run: python3 tools/verify_downloads.py
      - name: Upload test build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Bichen-0.3.0-beta.1-test-build
          path: |
            out/*-module.zip
            out/*-source.zip
          if-no-files-found: error
          retention-days: 30
      # Installable APKs live in downloads/ and retain the previous app's signing
      # key. A runner-generated development key cannot sign a compatible update.
