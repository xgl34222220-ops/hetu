name: Bichen Compose LuoShu UI
on:
  push:
    branches: ['feature/compose-luoshu-ui']
  workflow_dispatch:
concurrency:
  group: bichen-compose-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply BoxProxy architecture patch
        if: github.event.head_commit.message == 'Run BoxProxy spec patch v3'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/apply-boxproxy-spec.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == 'PY')
          code = []
          for line in workflow[start:end]:
              code.append(line[10:] if line.startswith('          ') else line)
          exec(compile('\n'.join(code), 'apply-boxproxy-spec', 'exec'))
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Implement BoxProxy UI UX architecture'
          git push origin HEAD:feature/compose-luoshu-ui
      - uses: actions/checkout@v4
        with:
          repository: MetaCubeX/mihomo
          ref: ac017cdd246ce8bd547653d927e7bf77d7ee73d5
          path: .upstream
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: .upstream/go.sum
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false
      - name: Compile Compose UI first
        working-directory: android-app
        run: gradle :app:compileDebugKotlin --stacktrace
      - name: Ensure NDK for Mihomo runtime
        run: |
          if [ ! -x "$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" ]; then
            sdkmanager 'ndk;28.2.13676358'
          fi
      - name: Build pinned Mihomo runtime
        run: |
          cp -r native/bridge .upstream/bichenbridge
          cd .upstream
          go test -tags with_gvisor -v ./bichenbridge
          NDK="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p ../android-app/app/src/main/jniLibs/arm64-v8a ../android-app/app/src/main/jniLibs/x86_64
          mkdir -p ../android-app/app/src/main/assets/mihomo-root/arm64-v8a ../android-app/app/src/main/assets/mihomo-root/x86_64
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="$NDK/aarch64-linux-android26-clang" go build -tags with_gvisor -trimpath -buildmode=c-shared -ldflags='-s -w -extldflags=-Wl,-z,max-page-size=16384' -o ../android-app/app/src/main/jniLibs/arm64-v8a/libbichen_core.so ./bichenbridge
          CGO_ENABLED=1 GOOS=android GOARCH=amd64 CC="$NDK/x86_64-linux-android26-clang" go build -tags with_gvisor -trimpath -buildmode=c-shared -ldflags='-s -w -extldflags=-Wl,-z,max-page-size=16384' -o ../android-app/app/src/main/jniLibs/x86_64/libbichen_core.so ./bichenbridge
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="$NDK/aarch64-linux-android26-clang" go build -tags with_gvisor -trimpath -ldflags='-s -w -extldflags=-Wl,-z,max-page-size=16384' -o ../android-app/app/src/main/assets/mihomo-root/arm64-v8a/mihomo .
          CGO_ENABLED=1 GOOS=android GOARCH=amd64 CC="$NDK/x86_64-linux-android26-clang" go build -tags with_gvisor -trimpath -ldflags='-s -w -extldflags=-Wl,-z,max-page-size=16384' -o ../android-app/app/src/main/assets/mihomo-root/x86_64/mihomo .
          cp LICENSE ../android-app/app/src/main/assets/MIHOMO-LICENSE
          git rev-parse HEAD > ../android-app/app/src/main/assets/mihomo-revision.txt
      - name: Build Compose test APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK structure and bundled ad-block rules
        run: |
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          "$AAPT" dump badging "$APK" | tee compose-apk-badging.txt
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | tee compose-apk-files.txt
          grep -q "package: name='io.github.xgl34222220.bichen.preview'" compose-apk-badging.txt
          grep -q "versionName='0.4.0-test.26-preview'" compose-apk-badging.txt
          grep -q "launchable-activity: name='io.github.xgl34222220.bichen.CompactMainActivity'" compose-apk-badging.txt
          grep -q 'assets/sources.tsv' compose-apk-files.txt
          grep -q 'assets/rules/adaway.txt' compose-apk-files.txt
          grep -q 'assets/rules/china.txt' compose-apk-files.txt
          grep -q 'assets/rules/tracking.txt' compose-apk-files.txt
          grep -q 'assets/rules/hagezi.txt' compose-apk-files.txt
      - name: Enable emulator acceleration
        if: github.event.head_commit.message != 'Run BoxProxy spec patch v3'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 35 Compose UI smoke test
        if: github.event.head_commit.message != 'Run BoxProxy spec patch v3'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          disable-animations: false
          emulator-boot-timeout: 360
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none
          script: bash tools/smoke_compose_ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bichen-0.4.0-test.26-boxproxy-spec
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            compose-apk-badging.txt
            compose-apk-files.txt
            out/compose-smoke/*
          if-no-files-found: warn
          retention-days: 14
