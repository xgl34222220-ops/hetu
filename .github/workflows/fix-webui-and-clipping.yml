name: Fix WebUI and clipping
on:
  push:
    branches: [feature/compose-luoshu-ui]
    paths:
      - .github/workflows/fix-webui-and-clipping.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compose-luoshu-ui
          fetch-depth: 0
      - name: Apply fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')

