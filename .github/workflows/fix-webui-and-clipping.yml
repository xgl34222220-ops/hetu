name: Fix WebUI and clipping
on:
  push:
    branches: ['feature/compose-luoshu-ui']
    paths:
      - '.github/patch_webui_and_clipping.py'
      - '.github/workflows/fix-webui-and-clipping.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply real-device fixes
        run: python3 .github/patch_webui_and_clipping.py
      - name: Validate patch
        run: |
          git diff --check
          grep -q 'upgradeUi()' android-app/app/src/main/java/io/github/xgl34222220/bichen/MihomoControllerClient.java
          grep -q 'waitWebUiReady' android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyRuntimeInspector.kt
          grep -q 'heightIn(min = 108.dp)' android-app/app/src/main/java/io/github/xgl34222220/bichen/CompactMainActivity.kt
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-app/app/src/main/java/io/github/xgl34222220/bichen
          git commit -m 'Fix WebUI installer and real-device UI defects'
          git push origin HEAD:feature/compose-luoshu-ui
