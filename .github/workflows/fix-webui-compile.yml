name: Fix WebUI compile
on:
  push:
    branches: ['feature/compose-luoshu-ui']
    paths: ['.github/workflows/fix-webui-compile.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix Kotlin shell escaping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyRuntimeInspector.kt')
          s=p.read_text()
          old='''        val command = "UI=${RootBridge.quote(uiPath)}; test -s \\\"${'$'}UI/index.html\\\" && find \\\"${'$'}UI\\\" -type f \\( -name '*.js' -o -name '*.mjs' \\) -print -quit 2>/dev/null | grep -q . && echo READY || echo MISSING"'''
          new='''        val command = "UI=${RootBridge.quote(uiPath)}; test -s \\\"${'$'}UI/index.html\\\" && find \\\"${'$'}UI\\\" -type f -print 2>/dev/null | grep -Eq '\\\\.(m?js)$' && echo READY || echo MISSING"'''
          if old not in s:
              raise SystemExit('target line not found')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyRuntimeInspector.kt
          git commit -m 'Fix WebUI readiness command escaping'
          git push origin HEAD:feature/compose-luoshu-ui
