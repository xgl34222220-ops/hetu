name: Hetu build

on:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/hetu-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hetu-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HETU_TEST_KEYSTORE: /home/runner/.android/hetu-ui10-debug.jks
    steps:
      - uses: actions/checkout@v4

      - name: Restore uploaded V20.14 source
        run: |
          set -euo pipefail
          cat updates/v2014-full/p00.b64 updates/v2014-full/p01.b64 updates/v2014-full/p02.b64 updates/v2014-full/p03.b64 updates/v2014-full/p04.b64 updates/v2014-full/p05.b64 updates/v2014-full/p06.b64 updates/v2014-full/p07.b64 updates/v2014-full/p08.b64 updates/v2014-full/p09.b64 updates/v2014-full/p10.b64 updates/v2014-full/p11.b64 updates/v2014-full/p12.b64 \
            | base64 -d > /tmp/v2014-overlay.tar.gz
          echo 'f272092f61363f608b39d2c3fa4f128fdb78b157be0dcca6404019472b1d4528  /tmp/v2014-overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v2014-overlay.tar.gz -C .
          grep -q 'versionCode = 2014' android-app/app/build.gradle.kts
          grep -q 'versionName = "0.6.4-v20"' android-app/app/build.gradle.kts
          echo "V20.14 source restored"
          git diff --stat

      - name: Apply uploaded V20.15 delta
        run: |
          set -euo pipefail
          cat updates/v2015-delta/p00.b64 updates/v2015-delta/p01a.b64 updates/v2015-delta/p01b.b64 | base64 -d > /tmp/v2015.patch.xz
          echo 'd1e843874aef59b77fa0439c2277b4149e260e9f156e64d96536c80da247d84a  /tmp/v2015.patch.xz' | sha256sum -c -
          xz -dc /tmp/v2015.patch.xz > /tmp/v2015.patch
          git apply --check /tmp/v2015.patch
          git apply /tmp/v2015.patch
          grep -q 'versionCode = 2015' android-app/app/build.gradle.kts
          grep -q 'versionName = "0.6.5-v20"' android-app/app/build.gradle.kts
          echo "V20.15 delta applied"
          git diff --stat

      - name: Fix V20.15 Kotlin setter clash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          vm = Path('android-app/app/src/main/java/io/github/xgl34222220/hetu/app/HetuViewModel.kt')
          st = Path('android-app/app/src/main/java/io/github/xgl34222220/hetu/app/SettingsScreen.kt')
          a = vm.read_text()
          b = st.read_text()
          old_a = 'fun setPureBlack(value: Boolean)'
          old_b = 'vm.setPureBlack(it)'
          assert a.count(old_a) == 1
          assert b.count(old_b) == 1
          vm.write_text(a.replace(old_a, 'fun updatePureBlack(value: Boolean)'))
          st.write_text(b.replace(old_b, 'vm.updatePureBlack(it)'))
          PY
          grep -q 'fun updatePureBlack(value: Boolean)' android-app/app/src/main/java/io/github/xgl34222220/hetu/app/HetuViewModel.kt
          grep -q 'vm.updatePureBlack(it)' android-app/app/src/main/java/io/github/xgl34222220/hetu/app/SettingsScreen.kt

      - name: Apply V20.16 BoxProxy+ UI layer
        run: |
          set -euo pipefail
          cat updates/v2016-boxplus/p00.b64 updates/v2016-boxplus/p01.b64 | base64 -d > /tmp/v2016-boxplus.patch.xz
          echo 'db9bb8d3fc9e31f4cce19ad12de2696b9271be5cf9310721ebd4780c4afb58f8  /tmp/v2016-boxplus.patch.xz' | sha256sum -c -
          xz -dc /tmp/v2016-boxplus.patch.xz > /tmp/v2016-boxplus.patch
          git apply -p0 --check /tmp/v2016-boxplus.patch
          git apply -p0 /tmp/v2016-boxplus.patch
          grep -q 'versionCode = 2016' android-app/app/build.gradle.kts
          grep -q 'versionName = "0.6.6-v20"' android-app/app/build.gradle.kts
          grep -q 'com.patrykandpatrick.vico:compose:3.3.1' android-app/app/build.gradle.kts
          grep -q 'io.coil-kt.coil3:coil-svg:3.6.3' android-app/app/build.gradle.kts
          echo "V20.16 BoxProxy+ UI layer applied"
          git diff --stat

      - name: Fix V20.16 first-pass compile issues
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          activity = Path('android-app/app/src/main/java/io/github/xgl34222220/hetu/app/HetuActivity.kt')
          text = activity.read_text()
          if 'import androidx.compose.animation.core.animateDpAsState\n' not in text:
              text = text.replace(
                  'import androidx.compose.animation.core.animateFloat\n',
                  'import androidx.compose.animation.core.animateFloat\nimport androidx.compose.animation.core.animateDpAsState\n',
              )
          if 'import androidx.compose.foundation.layout.offset\n' not in text:
              text = text.replace(
                  'import androidx.compose.foundation.layout.navigationBarsPadding\n',
                  'import androidx.compose.foundation.layout.navigationBarsPadding\nimport androidx.compose.foundation.layout.offset\n',
              )
          activity.write_text(text)

          overview = Path('android-app/app/src/main/java/io/github/xgl34222220/hetu/app/PanelOverviewScreen.kt')
          text = overview.read_text()
          text = text.replace(
              'HxBarAction(Icons.Rounded.Refresh, "刷新", busy = vm.refreshing) { scope.launch { vm.refreshNow() } }',
              'HxBarAction(Icons.Rounded.Refresh, "刷新", onClick = { scope.launch { vm.refreshNow() } }, busy = vm.refreshing)',
          )
          overview.write_text(text)
          PY
          grep -q 'animateDpAsState' android-app/app/src/main/java/io/github/xgl34222220/hetu/app/HetuActivity.kt
          grep -q 'layout.offset' android-app/app/src/main/java/io/github/xgl34222220/hetu/app/HetuActivity.kt
          grep -q 'onClick = { scope.launch { vm.refreshNow() } }, busy = vm.refreshing' android-app/app/src/main/java/io/github/xgl34222220/hetu/app/PanelOverviewScreen.kt

      - name: Apply V20.17 secondary polish
        run: |
          set -euo pipefail
          cat updates/v2017-secondary/p00.b64 updates/v2017-secondary/p01.b64 updates/v2017-secondary/p02.b64 \
              updates/v2017-secondary/q06.b64 updates/v2017-secondary/q07.b64 updates/v2017-secondary/q08.b64 \
              updates/v2017-secondary/q09.b64 updates/v2017-secondary/q10.b64 updates/v2017-secondary/q11.b64 \
              updates/v2017-secondary/q12.b64 updates/v2017-secondary/q13.b64 updates/v2017-secondary/q14.b64 \
              updates/v2017-secondary/q15.b64 updates/v2017-secondary/q16.b64 | base64 -d > /tmp/v2017.patch.xz
          echo '25d4b4e327b7206fc78088e7dc297b62d6a4379c02c8663a56088a3c3323a862  /tmp/v2017.patch.xz' | sha256sum -c -
          xz -dc /tmp/v2017.patch.xz > /tmp/v2017.patch
          git apply --check /tmp/v2017.patch
          git apply /tmp/v2017.patch
          grep -q 'versionCode = 2017' android-app/app/build.gradle.kts
          grep -q 'versionName = "0.6.7-v20"' android-app/app/build.gradle.kts
          grep -q 'internal fun HxThemeLabScreen' android-app/app/src/main/java/io/github/xgl34222220/hetu/app/SettingsScreen.kt
          echo "V20.17 secondary polish applied"
          git diff --stat

      - name: Apply V20.18 strategy card polish
        run: |
          set -euo pipefail
          cat updates/v2018-strategy/p00.b64 | base64 -d > /tmp/v2018.patch.xz
          echo '5c6b7d7e709cb21eb034b3acfe9eda635a37d02af1692c8e13f91d7d05a14466  /tmp/v2018.patch.xz' | sha256sum -c -
          xz -dc /tmp/v2018.patch.xz > /tmp/v2018.patch
          git apply --check /tmp/v2018.patch
          git apply /tmp/v2018.patch
          grep -q 'versionCode = 2018' android-app/app/build.gradle.kts
          grep -q 'versionName = "0.6.8-v20"' android-app/app/build.gradle.kts
          grep -q 'internal fun BoxProxyGroupCard17' android-app/app/src/main/java/io/github/xgl34222220/hetu/BoxProxyExactPanel17.kt
          grep -q 'modifier = Modifier.weight(1f).aspectRatio(groupRatio)' android-app/app/src/main/java/io/github/xgl34222220/hetu/app/ProxiesScreen.kt
          echo "V20.18 strategy card polish applied"
          git diff --stat

      - name: Apply V20.19 strategy screenshot parity
        run: |
          set -euo pipefail
          cat updates/v2019-strategy/p00.b64 | base64 -d > /tmp/v2019.patch.xz
          echo 'aaf61436b9f4b9f0176badb336f6b688ecc1e75d699f02af9a77bd4549c0d21f  /tmp/v2019.patch.xz' | sha256sum -c -
          xz -dc /tmp/v2019.patch.xz > /tmp/v2019.patch
          git apply --check /tmp/v2019.patch
          git apply /tmp/v2019.patch
          grep -q 'versionCode = 2019' android-app/app/build.gradle.kts
          grep -q 'versionName = "0.6.9-v20"' android-app/app/build.gradle.kts
          grep -q 'val groupRatio = if (columns == 1) 4.0f else 2.02f' android-app/app/src/main/java/io/github/xgl34222220/hetu/app/ProxiesScreen.kt
          grep -q 'height(62.dp)' android-app/app/src/main/java/io/github/xgl34222220/hetu/app/ProxiesScreen.kt
          echo "V20.19 strategy screenshot parity applied"
          git diff --stat

      - name: Fix V20.19 text-unit import
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android-app/app/src/main/java/io/github/xgl34222220/hetu/app/ProxiesScreen.kt')
          text = path.read_text()
          if 'import androidx.compose.ui.unit.sp\n' not in text:
              text = text.replace('import androidx.compose.ui.unit.dp\n', 'import androidx.compose.ui.unit.dp\nimport androidx.compose.ui.unit.sp\n')
          path.write_text(text)
          PY
          grep -q 'import androidx.compose.ui.unit.sp' android-app/app/src/main/java/io/github/xgl34222220/hetu/app/ProxiesScreen.kt

      - name: Apply V20.20 direct latency testing
        run: |
          set -euo pipefail
          cat updates/v2020-direct-delay/p00.b64 | base64 -d > /tmp/v2020.patch.xz
          echo 'd51f19128f1d5679c209e6929cff14a128a2e0341560611c6ecf80aedf4046de  /tmp/v2020.patch.xz' | sha256sum -c -
          xz -dc /tmp/v2020.patch.xz > /tmp/v2020.patch
          git apply --check /tmp/v2020.patch
          git apply /tmp/v2020.patch
          grep -q 'versionCode = 2020' android-app/app/build.gradle.kts
          grep -q 'versionName = "0.7.0-v20"' android-app/app/build.gradle.kts
          grep -q 'onDelayClick = { testAll(group) }' android-app/app/src/main/java/io/github/xgl34222220/hetu/BoxProxyExactPanel17.kt
          grep -q 'onDelayClick = {' android-app/app/src/main/java/io/github/xgl34222220/hetu/app/ProxiesScreen.kt
          echo "V20.20 direct latency testing applied"
          git diff --stat

      - name: Apply V20.21 panel strategy fast test
        run: |
          set -euo pipefail
          cat updates/v2021-panel-fasttest/p00.b64 | base64 -d > /tmp/v2021.patch.xz
          echo 'df551d0448f4040c068914d22230994bed2a51d46c11f2a0555df06f41f63e14  /tmp/v2021.patch.xz' | sha256sum -c -
          xz -dc /tmp/v2021.patch.xz > /tmp/v2021.patch
          git apply --check /tmp/v2021.patch
          git apply /tmp/v2021.patch
          grep -q 'versionCode = 2021' android-app/app/build.gradle.kts
          grep -q 'versionName = "0.7.1-v20"' android-app/app/build.gradle.kts
          grep -q '"proxies" to "策略"' android-app/app/src/main/java/io/github/xgl34222220/hetu/app/HetuViewModel.kt
          grep -q 'suspend fun groupDelay(group: String)' android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxyDashboardRepository.kt
          grep -q 'timeout=5000' android-app/app/src/main/java/io/github/xgl34222220/hetu/MihomoControllerClient.java
          echo "V20.21 panel strategy fast test applied"
          git diff --stat

      - name: Fix V20.21 animated color import
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android-app/app/src/main/java/io/github/xgl34222220/hetu/BoxProxyExactPanel17.kt')
          s = p.read_text()
          if 'import androidx.compose.animation.animateColorAsState\n' not in s:
              s = s.replace('import androidx.compose.animation.animateContentSize\n', 'import androidx.compose.animation.animateContentSize\nimport androidx.compose.animation.animateColorAsState\n')
          p.write_text(s)
          PY
          grep -q 'import androidx.compose.animation.animateColorAsState' android-app/app/src/main/java/io/github/xgl34222220/hetu/BoxProxyExactPanel17.kt

      - name: Apply V20.22 panel defaults and routing cleanup
        run: |
          set -euo pipefail
          cat updates/v2022-panel-routing/p00.b64 | base64 -d > /tmp/v2022.patch.xz
          echo 'e6e63d8cfb3c91a7b734e5940037f329ce2c2acd6aad819e08e20298f25af6e3  /tmp/v2022.patch.xz' | sha256sum -c -
          xz -dc /tmp/v2022.patch.xz > /tmp/v2022.patch
          git apply --check /tmp/v2022.patch
          git apply /tmp/v2022.patch
          grep -q 'versionCode = 2022' android-app/app/build.gradle.kts
          grep -q 'versionName = "0.7.2-v20"' android-app/app/build.gradle.kts
          grep -q '默认面板页面' android-app/app/src/main/java/io/github/xgl34222220/hetu/app/SettingsScreen.kt
          grep -q 'vm.openPanel("providers")' android-app/app/src/main/java/io/github/xgl34222220/hetu/app/HomeScreen.kt
          ! grep -q '全部测速' android-app/app/src/main/java/io/github/xgl34222220/hetu/app/ProxiesScreen.kt
          echo "V20.22 panel defaults and routing cleanup applied"
          git diff --stat

      - name: Apply V20.23 overview redesign
        run: |
          set -euo pipefail
          cat updates/v2023-overview/p00.b64 updates/v2023-overview/p01.b64 | base64 -d > /tmp/v2023.patch.xz
          echo '49f3c13faeb0538910638ff8b08b08b4f6a2ec5045cea50ea792fa64dd85cbc3  /tmp/v2023.patch.xz' | sha256sum -c -
          xz -dc /tmp/v2023.patch.xz > /tmp/v2023.patch
          git apply --check /tmp/v2023.patch
          git apply /tmp/v2023.patch
          grep -q 'versionCode = 2023' android-app/app/build.gradle.kts
          grep -q 'versionName = "0.7.3-v20"' android-app/app/build.gradle.kts
          grep -q '实时排行' android-app/app/src/main/java/io/github/xgl34222220/hetu/app/PanelOverviewScreen.kt
          grep -q 'bitmap.asImageBitmap' android-app/app/src/main/java/io/github/xgl34222220/hetu/app/PanelOverviewScreen.kt
          echo "V20.23 overview redesign applied"
          git diff --stat

      - name: Apply V20.24 home video parity
        run: |
          set -euo pipefail
          cat updates/v2024-home/p00.b64 | base64 -d > /tmp/v2024.patch.xz
          echo '96cbb7a2d545b64024fe678c78f5b02f85e11c977717a3817263fea21e5862da  /tmp/v2024.patch.xz' | sha256sum -c -
          xz -dc /tmp/v2024.patch.xz > /tmp/v2024.patch
          git apply --check /tmp/v2024.patch
          git apply /tmp/v2024.patch
          grep -q 'versionCode = 2024' android-app/app/build.gradle.kts
          grep -q 'versionName = "0.7.4-v20"' android-app/app/build.gradle.kts
          grep -q 'HomeLauncherCard' android-app/app/src/main/java/io/github/xgl34222220/hetu/app/HomeScreen.kt
          ! sed -n '95,180p' android-app/app/src/main/java/io/github/xgl34222220/hetu/app/HomeScreen.kt | grep -q '配置与订阅'
          echo "V20.24 home video parity applied"
          git diff --stat

      - name: Apply V20.25 home network/details
        run: |
          set -euo pipefail
          cat updates/v2025-home-network/p00.b64 | base64 -d > /tmp/v2025.patch.xz
          echo 'e03f655720d63388c6f6d6f5b9d604b1cac674c775ece429ab6c70b8ee5d7f8b  /tmp/v2025.patch.xz' | sha256sum -c -
          xz -dc /tmp/v2025.patch.xz > /tmp/v2025.patch
          git apply --check /tmp/v2025.patch
          git apply /tmp/v2025.patch
          grep -q 'versionCode = 2025' android-app/app/build.gradle.kts
          grep -q 'versionName = "0.7.5-v20"' android-app/app/build.gradle.kts
          ! sed -n '100,170p' android-app/app/src/main/java/io/github/xgl34222220/hetu/app/HomeScreen.kt | grep -q 'HxBarAction(Icons.Rounded.Settings'
          grep -q '网速数据来源' android-app/app/src/main/java/io/github/xgl34222220/hetu/app/HomeScreen.kt
          grep -q 'wanCountry' android-app/app/src/main/java/io/github/xgl34222220/hetu/ProxyRuntimeInspector.kt
          echo "V20.25 home network/details applied"
          git diff --stat

      - name: Fix V20.25 speed source setter clash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          vm = Path('android-app/app/src/main/java/io/github/xgl34222220/hetu/app/HetuViewModel.kt')
          home = Path('android-app/app/src/main/java/io/github/xgl34222220/hetu/app/HomeScreen.kt')
          a = vm.read_text()
          b = home.read_text()
          a = a.replace('fun setHomeSpeedSource(source: String)', 'fun updateHomeSpeedSource(source: String)')
          b = b.replace('vm.setHomeSpeedSource(it)', 'vm.updateHomeSpeedSource(it)')
          vm.write_text(a)
          home.write_text(b)
          PY
          grep -q 'fun updateHomeSpeedSource(source: String)' android-app/app/src/main/java/io/github/xgl34222220/hetu/app/HetuViewModel.kt
          grep -q 'vm.updateHomeSpeedSource(it)' android-app/app/src/main/java/io/github/xgl34222220/hetu/app/HomeScreen.kt

      - name: Apply V20.26 panel deep-link fix
        run: |
          set -euo pipefail
          cat updates/v2026-panel-deeplink/p00.b64 | base64 -d > /tmp/v2026.patch.xz
          echo 'ce818875f714df8e8aa31187939a94dc857185dd6df20c91acca1cb371b2057c  /tmp/v2026.patch.xz' | sha256sum -c -
          xz -dc /tmp/v2026.patch.xz > /tmp/v2026.patch
          git apply --check /tmp/v2026.patch
          git apply /tmp/v2026.patch
          grep -q 'versionCode = 2026' android-app/app/build.gradle.kts
          grep -q 'versionName = "0.7.6-v20"' android-app/app/build.gradle.kts
          grep -q 'firstEmission' android-app/app/src/main/java/io/github/xgl34222220/hetu/app/HxTabbedPage.kt
          echo "V20.26 panel deep-link fix applied"
          git diff --stat

      - name: Apply V20.27 clean panel header
        run: |
          set -euo pipefail
          cat updates/v2027-panel-header/p00.b64 | base64 -d > /tmp/v2027.patch.xz
          echo '0bab9e35b9172734dd66087dadc7bdd9739e62eadf35c1e6152b63fbbf838c1c  /tmp/v2027.patch.xz' | sha256sum -c -
          xz -dc /tmp/v2027.patch.xz > /tmp/v2027.patch
          git apply --check /tmp/v2027.patch
          git apply /tmp/v2027.patch
          grep -q 'versionCode = 2027' android-app/app/build.gradle.kts
          grep -q 'versionName = "0.7.7-v20"' android-app/app/build.gradle.kts
          grep -q 'showSubtitle = false' android-app/app/src/main/java/io/github/xgl34222220/hetu/app/PanelToolsScreens.kt
          grep -q 'minimalHeader = true' android-app/app/src/main/java/io/github/xgl34222220/hetu/app/PanelToolsScreens.kt
          echo "V20.27 clean panel header applied"
          git diff --stat

      - name: Apply V20.28 panel tabs refine
        run: |
          set -euo pipefail
          cat updates/v2028-panel-tabs/p00.b64 | base64 -d > /tmp/v2028.patch.xz
          echo '2dceca3b071b9aa54a51f87f2a4d2ee6de9c359f7e2454f281278eade85e5eba  /tmp/v2028.patch.xz' | sha256sum -c -
          xz -dc /tmp/v2028.patch.xz > /tmp/v2028.patch
          git apply -p1 --check /tmp/v2028.patch
          git apply -p1 /tmp/v2028.patch
          grep -q 'versionCode = 2028' android-app/app/build.gradle.kts
          grep -q 'versionName = "0.7.8-v20"' android-app/app/build.gradle.kts
          grep -q 'val capsuleRadius = 13.dp' android-app/app/src/main/java/io/github/xgl34222220/hetu/ui/HetuTabs.kt
          grep -q 'Arrangement.spacedBy(7.dp)' android-app/app/src/main/java/io/github/xgl34222220/hetu/ui/HetuTabs.kt
          echo "V20.28 panel tabs refine applied"
          git diff --stat

      - name: Apply V20.29 actual panel header
        run: |
          set -euo pipefail
          cat updates/v2029-panel-actual/p00.b64 | base64 -d > /tmp/v2029.patch.xz
          echo '0e94d6e5449d519c03bacfa0f74ce417e80e73f4a8572826f0fa80b6d965b6f2  /tmp/v2029.patch.xz' | sha256sum -c -
          xz -dc /tmp/v2029.patch.xz > /tmp/v2029.patch
          git apply --check /tmp/v2029.patch
          git apply /tmp/v2029.patch
          grep -q 'versionCode = 2029' android-app/app/build.gradle.kts
          grep -q 'versionName = "0.7.9-v20"' android-app/app/build.gradle.kts
          grep -q 'panelReferenceStyle = true' android-app/app/src/main/java/io/github/xgl34222220/hetu/app/PanelToolsScreens.kt
          grep -q 'host.leadingActions' android-app/app/src/main/java/io/github/xgl34222220/hetu/app/HxTabbedPage.kt
          echo "V20.29 actual panel header applied"
          git diff --stat

      - name: Fix V20.29 rounded-shape import
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android-app/app/src/main/java/io/github/xgl34222220/hetu/app/HxTabbedPage.kt')
          s = p.read_text()
          if 'import androidx.compose.foundation.shape.RoundedCornerShape\n' not in s:
              s = s.replace('import androidx.compose.foundation.rememberScrollState\n', 'import androidx.compose.foundation.rememberScrollState\nimport androidx.compose.foundation.shape.RoundedCornerShape\n')
