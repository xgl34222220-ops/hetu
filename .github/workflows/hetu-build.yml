name: Hetu build

on:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/hetu-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hetu-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HETU_TEST_KEYSTORE: /home/runner/.android/hetu-ui10-debug.jks
    steps:
      - uses: actions/checkout@v4

      - name: Restore uploaded V20.11 baseline
        run: |
          set -euo pipefail
          cat updates/v2011-patch/gz00.b64 updates/v2011-patch/gz01.b64 updates/v2011-patch/gz02.b64 \
            | base64 -d | gzip -d > /tmp/v2011.patch
          git apply --check /tmp/v2011.patch
          git apply /tmp/v2011.patch
          grep -q 'versionCode = 2011' android-app/app/build.gradle.kts
          grep -q 'versionName = "0.6.1-v20"' android-app/app/build.gradle.kts
          echo "V20.11 baseline restored"

      - name: Apply uploaded V20.14 delta
        run: |
          set -euo pipefail
          cat updates/v2014-delta/p00.b64 updates/v2014-delta/p01.b64 \
              updates/v2014-delta/p02.b64 updates/v2014-delta/p03.b64 \
              updates/v2014-delta/p04.b64 updates/v2014-delta/p05.b64 \
            | base64 -d > /tmp/v2014-overlay.tar.gz
          echo '4e858c447e101434d52ae79464b71d4076838839119ce6d3d682356ea81687db  /tmp/v2014-overlay.tar.gz' | sha256sum -c -
          tar -xzf /tmp/v2014-overlay.tar.gz -C .
          grep -q 'versionCode = 2014' android-app/app/build.gradle.kts
          grep -q 'versionName = "0.6.4-v20"' android-app/app/build.gradle.kts
          echo "V20.14 source restored"
          git diff --stat

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Same signing identity as UI10–V19, so the APK installs over the current app
      # without uninstalling (settings and configs are kept).
      - name: Restore signing identity
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.android/hetu-ui10-debug.jks
          key: hetu-ui10-debug-signing-v1
          fail-on-cache-miss: true

      - name: Verify signing identity
        run: |
          set -euo pipefail
          test -s "$HETU_TEST_KEYSTORE"
          keytool -exportcert -keystore "$HETU_TEST_KEYSTORE" -alias androiddebugkey -storepass android \
            | openssl dgst -sha256 -r | cut -d ' ' -f1 | grep -qx '701bbb0aaa5709cf2bebd96ff85ebd64c06cf6c3a2211ec21a9c51e534a5faad'

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;37.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      # The Mihomo native core and runtime assets are not committed; take the exact,
      # hash-verified payload from the published UI15 APK (unchanged since then).
      - name: Restore runtime payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .ref
          gh release download ui92-r146.15-test --repo "$GITHUB_REPOSITORY" --pattern 'Hetu-UI92-Runtime146-UI15.apk' --dir .ref
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          apk = Path('.ref/Hetu-UI92-Runtime146-UI15.apk')
          expected = json.load(open('UI92_RUNTIME146_INPUTS.json'))['original146_payload']
          with zipfile.ZipFile(apk) as z:
              for name, digest in expected.items():
                  data = z.read(name)
                  assert hashlib.sha256(data).hexdigest() == digest, name
                  if name.startswith('lib/'):
                      out = Path('android-app/app/src/main/jniLibs') / name.removeprefix('lib/')
                  elif name.startswith('assets/'):
                      out = Path('android-app/app/src/main') / name
                  else:
                      continue
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(data)
          print('runtime payload restored', len(expected))
          PY
          # Keep the V20 ad-block/runtime Java changes: only binary/asset payload is restored.
          git diff --stat -- android-app/app/src/main/java || true

      - name: Build APK
        working-directory: android-app
        run: gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' :app:assembleDebug --stacktrace

      - name: Runtime unit tests
        working-directory: android-app
        run: |
          gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' :app:testDebugUnitTest \
            --tests '*RuntimeYaml15Test' --tests '*RuntimeStartup15Test' --tests '*AdblockSnifferTest' --stacktrace

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | head -3
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK" | grep -i 'SHA-256'
          mkdir -p out
          VERSION=$(grep -oP 'versionName = "\K[^"]+' android-app/app/build.gradle.kts)
          cp "$APK" "out/Hetu-$VERSION.apk"
          sha256sum out/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Hetu-APK
          path: out/*.apk
          compression-level: 0
          if-no-files-found: error
