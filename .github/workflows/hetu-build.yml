      # The Mihomo native core and runtime assets are not committed; take the exact,
      # hash-verified payload from UI15; only the protocol-tested shell is maintained in source.
      - name: Restore runtime payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .ref
          gh release download ui92-r146.15-test --repo "$GITHUB_REPOSITORY" --pattern 'Hetu-UI92-Runtime146-UI15.apk' --dir .ref
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          apk = Path('.ref/Hetu-UI92-Runtime146-UI15.apk')
          expected = json.load(open('UI92_RUNTIME146_INPUTS.json'))['original146_payload']
          with zipfile.ZipFile(apk) as z:
              for name, digest in expected.items():
                  data = z.read(name)
                  assert hashlib.sha256(data).hexdigest() == digest, name
                  # The protocol-tested editable shell must not be overwritten by the old APK.
                  if name == 'assets/hetu-root.sh':
                      continue
                  if name.startswith('lib/'):
                      out = Path('android-app/app/src/main/jniLibs') / name.removeprefix('lib/')
                  elif name.startswith('assets/'):
                      out = Path('android-app/app/src/main') / name
                  else:
                      continue
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(data)
          print('original payload verified', len(expected), '; restored unchanged entries', len(expected)-1, '; retained patched shell')
          PY
          # Keep the V20 ad-block/runtime Java changes: only binary/asset payload is restored.
          git diff --stat -- android-app/app/src/main/java || true

      - name: Verify final packaged-source runtime contract
        run: |
          set -euo pipefail
          mkdir -p out/verification
          python3 tools/qa/test_boot_startup_protocol.py | tee out/verification/boot-protocol.txt
          python3 .github/scripts/verify_packaged_runtime.py snapshot --script-sha256 96654eacde9009f0ad3f5ad31cd423147667548fd1a510b8bdef986a175ea7cb

      - name: Export effective V20.61 source
        run: |
          set -euo pipefail
          tar -czf /tmp/Hetu-V20.61-effective-source.tar.gz android-app UI92_RUNTIME146_INPUTS.json CHANGELOG-V20.md
          sha256sum /tmp/Hetu-V20.61-effective-source.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: Hetu-V20.61-effective-source
          path: /tmp/Hetu-V20.61-effective-source.tar.gz
          compression-level: 0
          if-no-files-found: error

      - name: Build APK
        working-directory: android-app
        run: gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' :app:assembleDebug --stacktrace

      - name: Verify APK embeds the tested runtime
        run: python3 .github/scripts/verify_packaged_runtime.py verify

      - name: Runtime unit tests
        working-directory: android-app
        run: |
          gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' :app:testDebugUnitTest \
            --tests '*RuntimeYaml15Test' --tests '*RuntimeStartup15Test' --tests '*AdblockSnifferTest' \
            --tests '*ConceptParity57Test' --tests '*PanelConceptModelTest' --tests '*SettingsConceptParityTest' \
            --tests '*CoreManagerConcept57Test' --tests '*SettingsBackupParity57Test' --tests '*ToolsConceptParityTest' --tests '*NativeConceptScreenshotTest' --tests '*SettingsStateCoverage61Test' --tests '*SettingsPickerParity58Test' --tests '*LargeTitleParity59Test' --tests '*BootStartup60Test' --stacktrace

      - name: Upload concept UI verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hetu-V20.61-UI-verification
          path: |
            android-app/app/build/test-results/testDebugUnitTest/
            android-app/app/build/reports/tests/testDebugUnitTest/
            android-app/app/build/outputs/concept61/
            out/verification/
          if-no-files-found: warn

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p out/apk-transfer
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" > out/apk-transfer/apk-metadata.txt
          head -3 out/apk-transfer/apk-metadata.txt
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK" > out/apk-transfer/apk-signature.txt
          grep -Fq '701bbb0aaa5709cf2bebd96ff85ebd64c06cf6c3a2211ec21a9c51e534a5faad' out/apk-transfer/apk-signature.txt
          cat out/apk-transfer/apk-signature.txt
          VERSION=$(grep -oP 'versionName = "\K[^"]+' android-app/app/build.gradle.kts)
          cp "$APK" "out/Hetu-$VERSION.apk"
          sha256sum out/*.apk
          python3 .github/scripts/split_apk_artifact.py "out/Hetu-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Hetu-APK
          path: out/*.apk
          compression-level: 0
          if-no-files-found: error

      - name: Upload APK transport manifest
        uses: actions/upload-artifact@v4
        with:
          name: Hetu-V20.61-APK-manifest
          path: |
            out/apk-transfer/manifest.json
            out/apk-transfer/apk-metadata.txt
            out/apk-transfer/apk-signature.txt
          if-no-files-found: error

      - name: Upload APK transport part 00
        uses: actions/upload-artifact@v4
        with:
          name: Hetu-V20.61-APK-part00
          path: out/apk-transfer/part00.bin
          compression-level: 0
          if-no-files-found: ignore

      - name: Upload APK transport part 01
        uses: actions/upload-artifact@v4
        with:
