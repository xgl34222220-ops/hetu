name: Hetu build

on:
  push:
    paths:
      - 'android-app/**'
      - '.github/workflows/hetu-build.yml'
  workflow_dispatch:
    inputs:
      android_window_qa:
        description: 'Run isolated Android default-glass window validation'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: hetu-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      HETU_TEST_KEYSTORE: /home/runner/.android/hetu-ui10-debug.jks
      HETU_WINDOW_QA: ${{ github.ref == 'refs/heads/test/dot-v2048-ui-safety' && (inputs.android_window_qa == true || contains(github.event.head_commit.message, '[window-qa]')) }}
      # One explicitly approved operation; ordinary pushes and reruns cannot grant access.
      HETU_KVM_ONCE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/test/dot-v2048-ui-safety' && github.run_attempt == 1 && contains(github.event.head_commit.message, '[kvm-approved-20261001]') }}
    steps:
      - uses: actions/checkout@v4

      # Effective V20.47 source is committed on this independent test branch.
      # Never replay historical overlays over the code being reviewed and tested.
      - name: Verify materialized source and snapshot guards
        run: |
          set -euo pipefail
          git diff --exit-code
          mkdir -p /tmp/hetu-snapshot-tests
          javac -d /tmp/hetu-snapshot-tests android-app/app/src/main/java/io/github/xgl34222220/hetu/ConfigEditSnapshot.java tests/ConfigEditSnapshotTest.java
          java -cp /tmp/hetu-snapshot-tests io.github.xgl34222220.hetu.ConfigEditSnapshotTest
          python3 tools/test_config_edit_library.py
          python3 tools/test_subscription_structure.py
          python3 tools/test_google_diagnostics.py
          python3 tools/test_start_contract.py
          python3 tests/android_window_recording_test.py
          python3 tests/android_kvm_access_test.py
          python3 tests/android_window_readiness_test.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Same signing identity as UI10–V19, so the APK installs over the current app
      # without uninstalling (settings and configs are kept).
      - name: Restore signing identity
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.android/hetu-ui10-debug.jks
          key: hetu-ui10-debug-signing-v1
          fail-on-cache-miss: true

      - name: Verify signing identity
        run: |
          set -euo pipefail
          test -s "$HETU_TEST_KEYSTORE"
          keytool -exportcert -keystore "$HETU_TEST_KEYSTORE" -alias androiddebugkey -storepass android \
            | openssl dgst -sha256 -r | cut -d ' ' -f1 | grep -qx '701bbb0aaa5709cf2bebd96ff85ebd64c06cf6c3a2211ec21a9c51e534a5faad'

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort | tail -n 1)
          # Use the runner's existing licenses; a new agreement must stop the build.
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;37.0.0' </dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Bounded configuration download regressions
        run: |
          set -euo pipefail
          hetu_gradle_bin=$(readlink -f "$(command -v gradle)")
          hetu_gradle_lib=$(dirname "$(dirname "$hetu_gradle_bin")")/lib
          python3 tools/test_config_download.py --kotlin-lib "$hetu_gradle_lib"
          python3 tools/test_group_measurement.py --kotlin-lib "$hetu_gradle_lib"
          python3 tools/test_window_foreground.py --kotlin-lib "$hetu_gradle_lib"

      # The Mihomo native core and runtime assets are not committed; take the exact,
      # hash-verified payload from the published UI15 APK (unchanged since then).
      - name: Restore runtime payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .ref
          gh release download ui92-r146.15-test --repo "$GITHUB_REPOSITORY" --pattern 'Hetu-UI92-Runtime146-UI15.apk' --dir .ref
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          apk = Path('.ref/Hetu-UI92-Runtime146-UI15.apk')
          expected = json.load(open('UI92_RUNTIME146_INPUTS.json'))['original146_payload']
          with zipfile.ZipFile(apk) as z:
              for name, digest in expected.items():
                  data = z.read(name)
                  assert hashlib.sha256(data).hexdigest() == digest, name
                  if name.startswith('lib/'):
                      out = Path('android-app/app/src/main/jniLibs') / name.removeprefix('lib/')
                  elif name.startswith('assets/'):
                      out = Path('android-app/app/src/main') / name
                  else:
                      continue
                  # Editable tracked scripts are source, never overwrite with historical assets.
                  if name == 'assets/hetu-root.sh':
                      assert out.is_file(), 'missing current runtime script'
                      continue
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(data)
          print('runtime payload restored', len(expected))
          PY
          # Keep the V20 ad-block/runtime Java changes: only binary/asset payload is restored.
          git diff --stat -- android-app/app/src/main/java || true

      - name: Build APK
        id: build
        working-directory: android-app
        run: gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' :app:assembleDebug --stacktrace

      - name: Actual launcher and editor regression tests
        id: targeted_tests
        if: success()
        working-directory: android-app
        run: |
          gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' :app:testDebugUnitTest --tests '*HetuConceptRootTest' --tests '*HomeConceptUiTest' --tests '*ConfigEditorSafetyTest' --tests '*CpuSampleTrackerTest' --tests '*RuntimeCpuSamplingTest' --tests '*LauncherIconTest' --tests '*GoogleDiagnosticsIntegrationTest' --tests '*ConfigApplyQueueTest' --tests '*SettingsBackupRestoreTest' --tests '*ConfigWorkflowConceptTest' --tests '*NodeSelectionRootContractTest' --stacktrace

      - name: Archive first actual launcher frames
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Hetu-concept-first-results
          path: |
            android-app/app/build/test-results/
            android-app/app/build/outputs/hetu-ui-consolidation/
            android-app/app/build/outputs/hetu-concept-root/
          if-no-files-found: warn

      - name: Complete unit and UI regression tests
        if: always() && steps.build.outcome == 'success'
        working-directory: android-app
        run: |
          gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' :app:testDebugUnitTest --stacktrace

      - name: Report actual concept UI results
        if: always()
        run: python3 tools/report_concept_ui_results.py

      - name: Verify packaged runtime matches reviewed source
        id: runtime_audit
        if: always() && steps.build.outcome == 'success'
        run: |
          python3 tools/verify_runtime_source.py android-app/app/build/outputs/apk/debug/app-debug.apk
          python3 tools/test_start_contract.py --apk android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Export exact source
        if: always()
        run: |
          mkdir -p out
          git archive HEAD | gzip > out/Hetu-dot-ui-source.tar.gz
          git rev-parse HEAD > out/commit.txt
          sha256sum out/Hetu-dot-ui-source.tar.gz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hetu-dot-ui-verification
          path: |
            android-app/app/build/test-results/
            android-app/app/build/reports/tests/
            android-app/app/build/outputs/hetu-ui-consolidation/
            android-app/app/build/outputs/hetu-concept-root/
            out/Hetu-dot-ui-source.tar.gz
            out/commit.txt
            out/concept-ui-result.json
          if-no-files-found: error

      - name: Verify APK
        id: apk_audit
        if: always() && steps.runtime_audit.outcome == 'success'
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | head -3
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK" | grep -i 'SHA-256'
          mkdir -p out
          VERSION=$(grep -oP 'versionName = "\K[^"]+' android-app/app/build.gradle.kts)
          cp "$APK" "out/Hetu-$VERSION.apk"
          sha256sum out/*.apk

      - uses: actions/upload-artifact@v4
        if: always() && steps.apk_audit.outcome == 'success'
        with:
          name: Hetu-QA-APK-not-release
          path: out/*.apk
          compression-level: 0
          if-no-files-found: error

      # Optional window QA. Only the explicitly approved run may temporarily grant host KVM access.
      # Guest security and proxy services are not changed.
      - name: Prepare window media verification
        if: always() && steps.apk_audit.outcome == 'success' && steps.targeted_tests.outcome == 'success' && env.HETU_WINDOW_QA == 'true'
        id: window_media
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          ffprobe -version
          ffmpeg -version

      # Final candidate QA always installs the APK compiled and audited in this job.
      - name: Compile ordinary Android window test host
        if: always() && steps.window_media.outcome == 'success' && env.HETU_WINDOW_QA == 'true'
        id: window_test_build
        working-directory: android-app
        run: gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' :app:assembleDebugAndroidTest --stacktrace

      - name: Validate default glass in an ordinary Android window
        if: always() && steps.window_test_build.outcome == 'success' && env.HETU_WINDOW_QA == 'true'
        timeout-minutes: 70
        run: |
          set -euo pipefail
          if [ "$HETU_KVM_ONCE" = true ]; then
            cleanup_kvm() {
              hetu_window_status=$?
              trap - EXIT INT TERM
              set +e
              python3 tools/android_kvm_access.py restore out/android-window-qa/kvm-access
              hetu_restore_status=$?
              if [ "$hetu_restore_status" -ne 0 ]; then exit "$hetu_restore_status"; fi
              exit "$hetu_window_status"
            }
            trap cleanup_kvm EXIT
            trap 'exit 130' INT
            trap 'exit 143' TERM
            python3 tools/android_kvm_access.py grant out/android-window-qa/kvm-access
          fi
          python3 tools/run_android_window_qa.py

      - name: Verify original KVM access restored
        if: always() && env.HETU_KVM_ONCE == 'true'
        timeout-minutes: 3
        run: python3 tools/android_kvm_access.py restore out/android-window-qa/kvm-access

      - uses: actions/upload-artifact@v4
        if: always() && env.HETU_WINDOW_QA == 'true'
        with:
          name: Hetu-Android-window-QA
          path: out/android-window-qa/
          if-no-files-found: warn
