# Pinned V20.71 effective source, verified V20.72 patch, reviewed V20.73 fixes.
name: Hetu V20.73 scripts and boot fixes
permissions:
  contents: read
  actions: read
concurrency:
  group: hetu-v2073-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HETU_TEST_KEYSTORE: /home/runner/.android/hetu-ui10-debug.jks
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Restore pinned successful V20.71 effective source
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        mkdir -p "$RUNNER_TEMP/hetu-v2071-source"

        gh run download 37064619619 --repo "$GITHUB_REPOSITORY" --name Hetu-V20.71-effective-source --dir "$RUNNER_TEMP/hetu-v2071-source"

        SOURCE_ARCHIVE="$RUNNER_TEMP/hetu-v2071-source/Hetu-V20.71-effective-source.tar.gz"

        echo ''56e4ab841d8255a8e8d3e575c8b10ec3a353e60352887dde3bdbec035607daf8  ''"$SOURCE_ARCHIVE" | sha256sum
        -c -

        # Use the successful run''s actual source; do not replay historic UI overlays.

        rm -rf android-app

        tar -xzf "$SOURCE_ARCHIVE" --no-same-owner

        python3 .github/scripts/verify_packaged_runtime.py snapshot --script-sha256 96654eacde9009f0ad3f5ad31cd423147667548fd1a510b8bdef986a175ea7cb

        '
    - name: Restore verified V20.72 fixes
      run: 'set -euo pipefail

        echo ''51349b72b0025c3e27d09723a72592aa1ff8977bbdfd641533872c3fb6932da4  updates/v2072-google-firewall-crash/runtime.patch''
        | sha256sum -c -

        git apply --check updates/v2072-google-firewall-crash/runtime.patch

        git apply updates/v2072-google-firewall-crash/runtime.patch

        grep -q ''versionCode = 2072'' android-app/app/build.gradle.kts

        sh -n android-app/app/src/main/assets/hetu-root.sh

        python3 tools/qa/test_google_firewall.py 2>&1 | tee out/verification/google-firewall-tests.txt

        python3 .github/scripts/verify_packaged_runtime.py snapshot --script-sha256 aa5fdb7d05e04f1b36a15af13d6525de5e2c3c0190e96d3361c2abf54ea2a008

        '
    - name: Apply and test scripts and native boot fixes
      run: 'set -euo pipefail

        echo ''64b39aa3cc905f6e22c7172ad9ccf291741cc9590d3411df08850e33a1634a05  updates/v2073-scripts-boot/runtime.patch''
        | sha256sum -c -

        git apply --check updates/v2073-scripts-boot/runtime.patch

        git apply updates/v2073-scripts-boot/runtime.patch

        grep -q ''versionCode = 2073'' android-app/app/build.gradle.kts

        sh -n android-app/app/src/main/assets/hetu-root.sh

        sh -n android-app/app/src/main/assets/hetu-autostart.sh

        python3 tools/qa/test_root_autostart.py 2>&1 | tee out/verification/root-autostart-tests.txt

        python3 tools/qa/test_google_firewall.py 2>&1 | tee out/verification/google-firewall-tests.txt

        python3 .github/scripts/verify_packaged_runtime.py snapshot --script-sha256 32291ca1ef266c1561122fe4ebd2329d3ffacb889c6992f92234afcceaa25fed
        --autostart-sha256 3a1215f4e9093ae2298803020d697da0c14c35ee5cf28f84f2a81608093783f9

        '
    - name: Verify built-in WebUI behavior with controlled API fixtures
      run: node .github/scripts/test_webui_concept.cjs
    - name: Render built-in WebUI with isolated browser fixtures
      timeout-minutes: 10
      run: 'set -euo pipefail

        npm install --prefix "$RUNNER_TEMP/hetu-browser-qa" --ignore-scripts --no-audit --no-fund playwright@1.62.1

        "$RUNNER_TEMP/hetu-browser-qa/node_modules/.bin/playwright" install --with-deps chromium

        NODE_PATH="$RUNNER_TEMP/hetu-browser-qa/node_modules" node .github/scripts/test_webui_browser.cjs

        '
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Restore signing identity
      uses: actions/cache/restore@v4
      with:
        path: /home/runner/.android/hetu-ui10-debug.jks
        key: hetu-ui10-debug-signing-v1
        fail-on-cache-miss: true
    - name: Verify signing identity
      run: "set -euo pipefail\ntest -s \"$HETU_TEST_KEYSTORE\"\nkeytool -exportcert -keystore \"$HETU_TEST_KEYSTORE\"\
        \ -alias androiddebugkey -storepass android \\\n  | openssl dgst -sha256 -r | cut -d ' ' -f1 | grep -qx\
        \ '701bbb0aaa5709cf2bebd96ff85ebd64c06cf6c3a2211ec21a9c51e534a5faad'\n"
    - name: Prepare Android SDK
      run: 'set -euo pipefail

        SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path ''*/bin/sdkmanager'' | sort | tail -n 1)

        yes | "$SDKMANAGER" --licenses >/dev/null || true

        "$SDKMANAGER" ''platforms;android-37.0'' ''build-tools;37.0.0''

        '
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 9.5.0
    - name: Export effective V20.72 source
      run: 'set -euo pipefail

        tar -czf /tmp/Hetu-V20.73-effective-source.tar.gz android-app UI92_RUNTIME146_INPUTS.json CHANGELOG-V20.md

        sha256sum /tmp/Hetu-V20.73-effective-source.tar.gz

        '
    - uses: actions/upload-artifact@v4
      with:
        compression-level: 0
        if-no-files-found: error
        name: Hetu-V20.73-effective-source
        path: /tmp/Hetu-V20.73-effective-source.tar.gz
    - name: Build APK
      run: gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' :app:assembleDebug
        --stacktrace
      working-directory: android-app
    - name: Verify APK embeds the tested runtime
      run: python3 .github/scripts/verify_packaged_runtime.py verify
    - name: Verify packaged launcher and concept icon bytes
      run: python3 .github/scripts/verify_hetu_icons.py apk android-app/app/build/outputs/apk/debug/app-debug.apk
    - name: Runtime unit tests
      run: "gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' :app:testDebugUnitTest\
        \ \\\n  --tests '*RuntimeYaml15Test' --tests '*RuntimeStartup15Test' --tests '*AdblockSnifferTest' \\\n\
        \  --tests '*ConceptParity57Test' --tests '*PanelConceptModelTest' --tests '*SettingsConceptParityTest'\
        \ \\\n  --tests '*CoreManagerConcept57Test' --tests '*SettingsBackupParity57Test' --tests '*ToolsConceptParityTest'\
        \ --tests '*NativeConceptScreenshotTest' --tests '*SettingsPickerParity58Test' --tests '*LargeTitleParity59Test'\
        \ --tests '*BootStartup60Test' \\\n  --tests '*ConceptStateCoverageTest' --tests '*ConceptRemainingCoverageTest'\
        \ --tests '*WanDetails61Test' --tests '*MainLanguageBindingTest' --tests '*PanelLayoutDefaultsTest' --tests\
        \ '*Runtime146ContractTest' --tests '*PanelModel11Test' --tests '*PanelActionSafetyTest' --tests '*ProxyLatencyRegressionTest'\
        \ --tests '*DocumentPickerSafetyTest' --tests '*AppCrashReportTest' --tests '*ProxyScriptSafetyTest' --tests\
        \ '*RootAutostartTest' --stacktrace\n"
      working-directory: android-app
    - name: Android lint compatibility gate
      run: gradle --no-daemon --max-workers=1 -Dorg.gradle.jvmargs='-Xmx1500m -Dfile.encoding=UTF-8' :app:lintDebug
        --stacktrace
      working-directory: android-app
    - name: Consolidate native and browser state evidence
      run: python3 tools/qa/consolidate_concept_coverage.py --repo . --expected-tests 256 --browser-evidence out/verification/webui-browser
        --browser-commit "$GITHUB_SHA"
    - if: always()
      name: Upload concept UI verification evidence
      uses: actions/upload-artifact@v4
      with:
        if-no-files-found: warn
        name: Hetu-V20.73-UI-verification
        path: 'android-app/app/build/test-results/testDebugUnitTest/

          android-app/app/build/reports/tests/testDebugUnitTest/

          android-app/app/build/reports/lint-results-debug.*

          android-app/app/build/outputs/concept59/

          android-app/app/build/outputs/concept-state-coverage/

          android-app/app/build/outputs/concept-remaining-coverage/

          out/verification/

          docs/qa/concept-173-current.json

          docs/qa/concept-173-current.md

          '
    - name: Verify APK
      run: 'set -euo pipefail

        APK=android-app/app/build/outputs/apk/debug/app-debug.apk

        mkdir -p out/apk-transfer

        "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" > out/apk-transfer/apk-metadata.txt

        head -3 out/apk-transfer/apk-metadata.txt

        grep -q "versionCode=''2073'' versionName=''0.12.3-v20''" out/apk-transfer/apk-metadata.txt

        "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK" > out/apk-transfer/apk-signature.txt

        grep -Fq ''701bbb0aaa5709cf2bebd96ff85ebd64c06cf6c3a2211ec21a9c51e534a5faad'' out/apk-transfer/apk-signature.txt

        cat out/apk-transfer/apk-signature.txt

        VERSION=$(grep -oP ''versionName = "\K[^"]+'' android-app/app/build.gradle.kts)

        cp "$APK" "out/Hetu-$VERSION.apk"

        sha256sum out/*.apk

        python3 .github/scripts/split_apk_artifact.py "out/Hetu-$VERSION.apk"

        '
    - uses: actions/upload-artifact@v4
      with:
        compression-level: 0
        if-no-files-found: error
        name: Hetu-APK
        path: out/*.apk
    - name: Upload APK transport manifest
      uses: actions/upload-artifact@v4
      with:
        if-no-files-found: error
        name: Hetu-V20.73-APK-manifest
        path: 'out/apk-transfer/manifest.json

          out/apk-transfer/apk-metadata.txt

          out/apk-transfer/apk-signature.txt

          '
    - name: Upload APK transport part 00
      uses: actions/upload-artifact@v4
      with:
        compression-level: 0
        if-no-files-found: ignore
        name: Hetu-V20.73-APK-part00
        path: out/apk-transfer/part00.bin
    - name: Upload APK transport part 01
      uses: actions/upload-artifact@v4
      with:
        compression-level: 0
        if-no-files-found: ignore
        name: Hetu-V20.73-APK-part01
        path: out/apk-transfer/part01.bin
    - name: Upload APK transport part 02
      uses: actions/upload-artifact@v4
      with:
        compression-level: 0
        if-no-files-found: ignore
        name: Hetu-V20.73-APK-part02
        path: out/apk-transfer/part02.bin
    - name: Upload APK transport part 03
      uses: actions/upload-artifact@v4
      with:
        compression-level: 0
        if-no-files-found: ignore
        name: Hetu-V20.73-APK-part03
        path: out/apk-transfer/part03.bin
    - name: Upload APK transport part 04
      uses: actions/upload-artifact@v4
      with:
        compression-level: 0
        if-no-files-found: ignore
        name: Hetu-V20.73-APK-part04
        path: out/apk-transfer/part04.bin
    - name: Upload APK transport part 05
      uses: actions/upload-artifact@v4
      with:
        compression-level: 0
        if-no-files-found: ignore
        name: Hetu-V20.73-APK-part05
        path: out/apk-transfer/part05.bin
  android-ui-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - uses: actions/download-artifact@v4
      with:
        name: Hetu-APK
        path: candidate
    - name: Prepare official AOSP emulator
      run: 'set -euo pipefail

        mkdir -p out/android-smoke

        export ANDROID_AVD_HOME="$RUNNER_TEMP/hetu-avd"

        mkdir -p "$ANDROID_AVD_HOME"

        echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"

        SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

        AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"

        "$SDKMANAGER" ''platform-tools'' ''emulator'' ''system-images;android-${{ matrix.api }};default;x86_64''
        2>&1 | tee out/android-smoke/sdk-prepare.log

        "$AVDMANAGER" list device --compact | grep -qx ''pixel_2''

        echo no | "$AVDMANAGER" create avd --force --device pixel_2 --name hetu-smoke --path "$ANDROID_AVD_HOME/hetu-smoke.avd"
        --package ''system-images;android-${{ matrix.api }};default;x86_64'' 2>&1 | tee out/android-smoke/avd-prepare.log

        test -f "$ANDROID_AVD_HOME/hetu-smoke.avd/config.ini"

        sed -i ''/^hw.lcd.width=/d;/^hw.lcd.height=/d;/^hw.lcd.density=/d;/^hw.ramSize=/d'' "$ANDROID_AVD_HOME/hetu-smoke.avd/config.ini"

        cat >> "$ANDROID_AVD_HOME/hetu-smoke.avd/config.ini" <<''EOF''

        hw.lcd.width=393

        hw.lcd.height=852

        hw.lcd.density=160

        hw.ramSize=2048

        EOF

        '
    - name: Run installed APK navigation and native WebView smoke
      env:
        HETU_EXPECTED_VERSION: '2073'
      run: 'set -euo pipefail

        mkdir -p out/android-smoke

        export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"

        test -x "$ANDROID_HOME/platform-tools/adb"

        "$ANDROID_HOME/platform-tools/adb" version | tee out/android-smoke/adb-version.txt

        # Uses only this runner''s existing KVM or sudo access. No device permission,

        # group, ACL or SELinux changes; owned supervisor verifies process cleanup.

        python3 .github/scripts/run_hetu_emulator.py

        '
    - name: Upload Android smoke evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Hetu-V20.73-Android-${{ matrix.api }}-smoke
        path: out/android-smoke/
        if-no-files-found: warn
    strategy:
      fail-fast: false
      matrix:
        api:
        - 35
        - 36
    name: Installed APK on Android API ${{ matrix.api }}
'on':
  push:
    branches:
    - test/v20.73-scripts-boot
    paths:
    - updates/v2073-scripts-boot/**
    - tools/qa/test_root_autostart.py
    - .github/workflows/hetu-build.yml
    - .github/scripts/smoke_hetu_apk.py
    - .github/scripts/verify_packaged_runtime.py
  workflow_dispatch: null
