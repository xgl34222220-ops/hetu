name: Integrate test103 presentation workbench
on:
  push:
    branches: [feature/hetu-rebrand-root-app]
    paths: [tools/integrate103.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded UI changes
        run: |
          set -euo pipefail
          python3 tools/integrate103.py
          python3 tools/test_ui_audit_invariants.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-app .github/workflows/build-hetu.yml
          git commit -m 'ui: deduplicate home, add native editor workbench and monitoring tickets (test.103)'
          git push origin HEAD:feature/hetu-rebrand-root-app
          mkdir -p "$RUNNER_TEMP/workbench103"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/workbench103/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/workbench103/commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Hetu-Workbench103-Source
          path: ${{ runner.temp }}/workbench103/
          retention-days: 1
