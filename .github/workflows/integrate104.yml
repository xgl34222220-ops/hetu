name: Integrate non-home alignment104
on:
  push:
    branches: [feature/hetu-rebrand-root-app]
    paths: [tools/nonhome104.patch.xz]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply checked presentation patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import lzma, hashlib, subprocess
          patch = lzma.decompress(Path('tools/nonhome104.patch.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == '54a5e0d493879d0eb6733bb3bae9f0e2d27e0bdea8bf4cf242648b672231f8bf'
          subprocess.run(['git', 'apply', '--unidiff-zero', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', '-'], input=patch, check=True)
          PY
          python3 tools/test_ui_audit_invariants.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-app docs/test104-nonhome.md
          git commit -m 'ui: align non-home workspace, inline refresh states and readable controls (test.104)'
          git push origin HEAD:feature/hetu-rebrand-root-app
