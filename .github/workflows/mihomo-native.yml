name: Build pinned Mihomo Android bridge
on:
  push:
    branches: ['feature/mihomo-vpn']
    paths: ['native/**', '.github/workflows/mihomo-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MetaCubeX/mihomo
          ref: ac017cdd246ce8bd547653d927e7bf77d7ee73d5
          path: .upstream
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: .upstream/go.sum
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'ndk;28.2.13676358'
      - name: Compile against pinned upstream and check runtime configuration
        run: |
          cp -r native/bridge .upstream/bichenbridge
          cd .upstream
          go test -v ./bichenbridge
      - name: Build ARM64 and emulator native libraries
        run: |
          NDK="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          cd .upstream
          mkdir -p ../out/native/arm64-v8a ../out/native/x86_64
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="$NDK/aarch64-linux-android26-clang" go build -trimpath -buildmode=c-shared -ldflags='-s -w -extldflags=-Wl,-z,max-page-size=16384' -o ../out/native/arm64-v8a/libbichen_core.so ./bichenbridge
          CGO_ENABLED=1 GOOS=android GOARCH=amd64 CC="$NDK/x86_64-linux-android26-clang" go build -trimpath -buildmode=c-shared -ldflags='-s -w -extldflags=-Wl,-z,max-page-size=16384' -o ../out/native/x86_64/libbichen_core.so ./bichenbridge
          cp LICENSE ../out/native/MIHOMO-LICENSE
          git rev-parse HEAD > ../out/native/core-revision.txt
          find ../out/native -name '*.so' -exec sha256sum {} \; > ../out/native/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bichen-native-internal
          path: out/native
          retention-days: 14
