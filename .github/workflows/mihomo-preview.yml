name: Verify integrated Mihomo VPN preview
on:
  push:
    branches: ['feature/mihomo-vpn']
    paths: ['android-app/**', 'native/**', 'tools/**', 'tests/proxy/**', '.github/workflows/mihomo-preview.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MetaCubeX/mihomo
          ref: ac017cdd246ce8bd547653d927e7bf77d7ee73d5
          path: .upstream
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: .upstream/go.sum
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install build tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          sudo apt-get update -qq
          sudo apt-get install -y -qq mksh busybox
      - name: Build pinned core for an unprivileged Android app
        run: bash tools/build_mihomo.sh
      - name: Compile and verify actual preview
        run: python3 tools/build_preview.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run UI regression and separate UID positive-control traffic tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 360
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            python3 tools/test_device.py
            python3 tools/test_proxy_device.py
      - name: Preserve private-signing handoff and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: INTERNAL-mihomo-preview-unsigned-not-flashable
          path: |
            out/preview/*-unsigned.apk
            out/preview/*-source.zip
            out/preview/*-module.zip
            out/preview/apksigner.jar
            out/preview/build-info.json
            out/preview/apk-badging.txt
            out/device/device-results.txt
            out/device/screenshots/*.png
            out/proxy-device/result.txt
            out/proxy-device/proxy-received.txt
            out/proxy-device/emulator-logcat.txt
            out/proxy-device/mihomo-screen.png
          if-no-files-found: error
          retention-days: 14
