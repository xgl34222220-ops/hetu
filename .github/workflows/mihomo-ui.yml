name: Bichen Mihomo UI and traffic verification
on:
  push:
    branches: ['feature/mihomo-ui', 'feature/mihomo-filter-hardening', 'feature/root-tproxy', 'feature/boxproxy-architecture']
  workflow_dispatch:
concurrency:
  group: bichen-mihomo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: MetaCubeX/mihomo
          ref: ac017cdd246ce8bd547653d927e7bf77d7ee73d5
          path: .upstream
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: .upstream/go.sum
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install build tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
          sudo apt-get update -qq
          sudo apt-get install -y -qq mksh busybox
      - name: Build pinned Mihomo bridge and Root executables
        run: |
          cp -r native/bridge .upstream/bichenbridge
          cd .upstream
          go test -tags with_gvisor -v ./bichenbridge
          NDK="$ANDROID_HOME/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p ../android-app/app/src/main/jniLibs/arm64-v8a ../android-app/app/src/main/jniLibs/x86_64
          mkdir -p ../android-app/app/src/main/assets/mihomo-root/arm64-v8a ../android-app/app/src/main/assets/mihomo-root/x86_64
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="$NDK/aarch64-linux-android26-clang" go build -tags with_gvisor -trimpath -buildmode=c-shared -ldflags='-s -w -extldflags=-Wl,-z,max-page-size=16384' -o ../android-app/app/src/main/jniLibs/arm64-v8a/libbichen_core.so ./bichenbridge
          CGO_ENABLED=1 GOOS=android GOARCH=amd64 CC="$NDK/x86_64-linux-android26-clang" go build -tags with_gvisor -trimpath -buildmode=c-shared -ldflags='-s -w -extldflags=-Wl,-z,max-page-size=16384' -o ../android-app/app/src/main/jniLibs/x86_64/libbichen_core.so ./bichenbridge
          CGO_ENABLED=1 GOOS=android GOARCH=arm64 CC="$NDK/aarch64-linux-android26-clang" go build -tags with_gvisor -trimpath -ldflags='-s -w -extldflags=-Wl,-z,max-page-size=16384' -o ../android-app/app/src/main/assets/mihomo-root/arm64-v8a/mihomo .
          CGO_ENABLED=1 GOOS=android GOARCH=amd64 CC="$NDK/x86_64-linux-android26-clang" go build -tags with_gvisor -trimpath -ldflags='-s -w -extldflags=-Wl,-z,max-page-size=16384' -o ../android-app/app/src/main/assets/mihomo-root/x86_64/mihomo .
          mkdir -p ../android-app/app/src/main/assets
          cp LICENSE ../android-app/app/src/main/assets/MIHOMO-LICENSE
          git rev-parse HEAD > ../android-app/app/src/main/assets/mihomo-revision.txt
          file ../android-app/app/src/main/assets/mihomo-root/*/mihomo
          sha256sum ../android-app/app/src/main/jniLibs/*/libbichen_core.so ../android-app/app/src/main/assets/mihomo-root/*/mihomo
      - name: Build preview and run existing regressions
        run: |
          mkdir -p out/preview
          set -o pipefail
          python3 tools/build_preview.py 2>&1 | tee out/preview/build.log
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify installed UI, storage and applicable traffic path
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 360
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none
          script: |
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            python3 tools/test_device.py
            python3 tools/test_proxy_ui.py
            if [ "${{ github.ref_name }}" = "feature/mihomo-ui" ] || [ "${{ github.ref_name }}" = "feature/mihomo-filter-hardening" ]; then
              python3 tools/test_mihomo_device.py
            else
              echo 'Root proxy architecture requires rooted kernel/iptables validation on a real device; Android TUN E2E remains covered on feature/mihomo-ui.'
            fi
      - name: Preserve unsigned build and verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: INTERNAL-Bichen-proxy-architecture-unsigned
          path: |
            out/preview/*-unsigned.apk
            out/preview/*-source.zip
            out/preview/*-module.zip
            out/preview/apksigner.jar
            out/preview/build.log
            out/preview/build-info.json
            out/preview/apk-badging.txt
            out/device/device-results.txt
            out/device/screenshots/*.png
            out/proxyui/results.txt
            out/proxyui/screenshots/ui-*.png
            out/mihomo/*.txt
            out/mihomo/*.json
            out/mihomo/*.png
          if-no-files-found: error
          retention-days: 14
