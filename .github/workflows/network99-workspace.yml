name: Network regression workspace
on:
  push:
    branches: [feature/hetu-rebrand-root-app]
    paths: [.github/workflows/network99-workspace.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar HEAD | gzip > /tmp/hetu99-baseline.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: Hetu99-baseline
          path: /tmp/hetu99-baseline.tar.gz
          retention-days: 1
          if-no-files-found: error
