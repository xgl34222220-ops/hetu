name: Rebuild adblock observability dashboard

on:
  push:
    branches: ['feature/compose-luoshu-ui']

permissions:
  contents: write
  actions: read

jobs:
  rebuild:
    if: github.event.head_commit.message == 'Run adblock dashboard rebuild'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild realtime adblock observability and UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dns = Path('android-app/app/src/main/java/io/github/xgl34222220/bichen/DnsVpnService.java')
          s = dns.read_text()
          old = '    private final AtomicLong queries = new AtomicLong(), blocked = new AtomicLong(), errors = new AtomicLong();\n'
          new = old + '    private long sessionStartQueries, sessionStartBlocked;\n    private static volatile String liveLastBlockedDomain = "";\n    private static volatile long liveLastBlockedAt;\n'
          assert old in s
          s = s.replace(old, new, 1)
          old = '        queries.set(prefs.getLong("queries", 0)); blocked.set(prefs.getLong("blocked", 0)); errors.set(prefs.getLong("errors", 0));\n'
          new = old + '        sessionStartQueries = queries.get(); sessionStartBlocked = blocked.get();\n'
          assert old in s
          s = s.replace(old, new, 1)
          marker = '    @Override public int onStartCommand(Intent intent, int flags, int startId) {'
          methods = '''    public static long currentQueries(Context context) {\n        DnsVpnService instance = latestInstance;\n        return running && instance != null ? instance.queries.get() : context.getSharedPreferences("bichen", MODE_PRIVATE).getLong("queries", 0L);\n    }\n    public static long currentBlocked(Context context) {\n        DnsVpnService instance = latestInstance;\n        return running && instance != null ? instance.blocked.get() : context.getSharedPreferences("bichen", MODE_PRIVATE).getLong("blocked", 0L);\n    }\n    public static long currentErrors(Context context) {\n        DnsVpnService instance = latestInstance;\n        return running && instance != null ? instance.errors.get() : context.getSharedPreferences("bichen", MODE_PRIVATE).getLong("errors", 0L);\n    }\n    public static long sessionQueries() {\n        DnsVpnService instance = latestInstance;\n        return running && instance != null ? Math.max(0L, instance.queries.get() - instance.sessionStartQueries) : 0L;\n    }\n    public static long sessionBlocked() {\n        DnsVpnService instance = latestInstance;\n        return running && instance != null ? Math.max(0L, instance.blocked.get() - instance.sessionStartBlocked) : 0L;\n    }\n    public static String lastBlockedDomain() { return liveLastBlockedDomain == null ? "" : liveLastBlockedDomain; }\n    public static long lastBlockedAt() { return liveLastBlockedAt; }\n\n'''
          assert marker in s
          s = s.replace(marker, methods + marker, 1)
          count = s.count('blocked.incrementAndGet();')
          assert count >= 2, count
          s = s.replace('blocked.incrementAndGet();', 'blocked.incrementAndGet(); liveLastBlockedDomain = query.domain; liveLastBlockedAt = System.currentTimeMillis();')
          old = 'next.put(new JSONObject().put("time", System.currentTimeMillis()).put("domain", domain).put("result", outcome).put("matchedDomain", matchedDomain));'
          new = 'next.put(new JSONObject().put("time", System.currentTimeMillis()).put("domain", domain).put("result", outcome).put("matchedDomain", matchedDomain).put("blocked", outcome.startsWith("blocked")));'
          assert old in s
          s = s.replace(old, new, 1)
          dns.write_text(s)

          ctl = Path('android-app/app/src/main/java/io/github/xgl34222220/bichen/ui/BichenComposeController.kt')
          s = ctl.read_text()
          s = s.replace('import java.text.Collator\n', 'import java.text.Collator\nimport java.text.SimpleDateFormat\nimport java.util.Date\n', 1)
          old = '''internal data class DnsCounters(\n    val queries: Long = 0,\n    val blocked: Long = 0,\n    val errors: Long = 0,\n) {\n    val blockRate: Int get() = if (queries <= 0L) 0 else ((blocked * 100L) / queries).coerceIn(0L, 100L).toInt()\n}\n'''
          new = '''internal data class DnsCounters(\n    val queries: Long = 0,\n    val blocked: Long = 0,\n    val errors: Long = 0,\n    val sessionQueries: Long = 0,\n    val sessionBlocked: Long = 0,\n    val lastBlockedDomain: String = "",\n    val lastBlockedAt: Long = 0,\n) {\n    val blockRate: Int get() = if (queries <= 0L) 0 else ((blocked * 100L) / queries).coerceIn(0L, 100L).toInt()\n}\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''            blockedQueries = prefs.getLong("blocked", 0),\n            queries = prefs.getLong("queries", 0),\n            errors = prefs.getLong("errors", 0),\n'''
          new = '''            blockedQueries = DnsVpnService.currentBlocked(app),\n            queries = DnsVpnService.currentQueries(app),\n            errors = DnsVpnService.currentErrors(app),\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''    fun dnsCounters(): DnsCounters = DnsCounters(\n        queries = prefs.getLong("queries", 0L),\n        blocked = prefs.getLong("blocked", 0L),\n        errors = prefs.getLong("errors", 0L),\n    )\n'''
          new = '''    fun dnsCounters(): DnsCounters = DnsCounters(\n        queries = DnsVpnService.currentQueries(app),\n        blocked = DnsVpnService.currentBlocked(app),\n        errors = DnsVpnService.currentErrors(app),\n        sessionQueries = DnsVpnService.sessionQueries(),\n        sessionBlocked = DnsVpnService.sessionBlocked(),\n        lastBlockedDomain = DnsVpnService.lastBlockedDomain(),\n        lastBlockedAt = DnsVpnService.lastBlockedAt(),\n    )\n'''
          assert old in s
          s = s.replace(old, new, 1)
          marker = '    fun requestItems(): List<RequestItem> {'
          helper = '''    private fun requestTime(o: JSONObject): String {\n        val millis = o.optLong("time", 0L)\n        return if (millis > 0L) SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date(millis))\n        else o.optString("timestamp", "")\n    }\n\n'''
          assert marker in s
          s = s.replace(marker, helper + marker, 1)
          old = '''                blocked = o.optBoolean("blocked", false),\n                time = o.optString("time", o.optString("timestamp", "")),\n'''
          new = '''                blocked = o.optBoolean("blocked", o.optString("result", "").startsWith("blocked")),\n                time = requestTime(o),\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''    fun clearRequests() {\n        prefs.edit().putString("dnsLogs", "[]").remove("dnsLogError").remove("dnsLogNotice").apply()\n    }\n\n'''
          new = old + '''    fun requestLoggingEnabled(): Boolean = prefs.getBoolean("requestLogs", false)\n    fun setRequestLogging(enabled: Boolean) = DnsVpnService.setRequestLogging(app, enabled)\n\n'''
          assert old in s
          s = s.replace(old, new, 1)
          ctl.write_text(s)

          ui = Path('android-app/app/src/main/java/io/github/xgl34222220/bichen/CompactMainActivity.kt')
          s = ui.read_text()
          old = '''        item("metrics") {\n            Surface(\n                shape = RoundedCornerShape(18.dp),\n                color = tokens.cardBackground,\n                border = BorderStroke(1.dp, tokens.outline),\n            ) {\n                Row(\n                    Modifier.fillMaxWidth().padding(horizontal = 16.dp, vertical = 14.dp),\n                    horizontalArrangement = Arrangement.spacedBy(8.dp),\n                    verticalAlignment = Alignment.CenterVertically,\n                ) {\n                    CompactMetric(counters.blocked.toString(), "累计拦截", Modifier.weight(1f))\n                    VerticalDivider(Modifier.height(36.dp), color = tokens.outline)\n                    CompactMetric(snapshot.ruleCount.toString(), "有效规则", Modifier.weight(1f))\n                    VerticalDivider(Modifier.height(36.dp), color = tokens.outline)\n                    CompactMetric("${counters.blockRate}%", "拦截率", Modifier.weight(1f))\n                }\n            }\n        }\n'''
          new = '''        item("metrics") {\n            Surface(\n                shape = RoundedCornerShape(20.dp),\n                color = tokens.cardBackground,\n                border = BorderStroke(1.dp, tokens.outline),\n                shadowElevation = 0.dp,\n            ) {\n                Column(Modifier.fillMaxWidth().padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {\n                    Row(verticalAlignment = Alignment.CenterVertically) {\n                        Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(2.dp)) {\n                            Text(if (vpnMode) "实时拦截" else "模块保护", color = tokens.textPrimary, fontSize = 16.sp, fontWeight = FontWeight.SemiBold)\n                            Text(\n                                if (vpnMode) {\n                                    if (snapshot.vpnRunning) "正在实时统计 DNS 命中" else "未运行，开启后会实时显示命中"\n                                } else {\n                                    if (active) "hosts 规则已加载并生效" else "模块保护未开启"\n                                },\n                                color = tokens.textSecondary, style = MaterialTheme.typography.bodySmall,\n                            )\n                        }\n                        Surface(\n                            shape = RoundedCornerShape(999.dp),\n                            color = if (active) tokens.success.copy(alpha = .12f) else tokens.warning.copy(alpha = .12f),\n                        ) {\n                            Text(\n                                if (active) "保护中" else "未保护",\n                                Modifier.padding(horizontal = 10.dp, vertical = 6.dp),\n                                color = if (active) tokens.success else tokens.warning,\n                                style = MaterialTheme.typography.labelMedium, fontWeight = FontWeight.SemiBold,\n                            )\n                        }\n                    }\n                    if (vpnMode) {\n                        Row(verticalAlignment = Alignment.Bottom) {\n                            Text(counters.blocked.toString(), color = tokens.textPrimary, fontSize = 38.sp, lineHeight = 42.sp, fontWeight = FontWeight.Bold)\n                            Spacer(Modifier.width(7.dp))\n                            Text("次拦截", color = tokens.textSecondary, style = MaterialTheme.typography.titleSmall, modifier = Modifier.padding(bottom = 5.dp))\n                            Spacer(Modifier.weight(1f))\n                            Text("${counters.blockRate}%", color = if (counters.blocked > 0) tokens.success else MaterialTheme.colorScheme.primary, fontSize = 20.sp, fontWeight = FontWeight.SemiBold)\n                        }\n                        LinearProgressIndicator(\n                            progress = { (counters.blockRate / 100f).coerceIn(0f, 1f) },\n                            modifier = Modifier.fillMaxWidth().height(5.dp).clip(CircleShape),\n                        )\n                        Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {\n                            CompactMetric(counters.queries.toString(), "累计 DNS", Modifier.weight(1f))\n                            CompactMetric(counters.sessionBlocked.toString(), "本次拦截", Modifier.weight(1f))\n                            CompactMetric(counters.sessionQueries.toString(), "本次请求", Modifier.weight(1f))\n                        }\n                        if (counters.lastBlockedDomain.isNotBlank()) {\n                            Row(\n                                Modifier.fillMaxWidth().background(tokens.controlBackground, RoundedCornerShape(13.dp)).padding(horizontal = 12.dp, vertical = 10.dp),\n                                verticalAlignment = Alignment.CenterVertically,\n                            ) {\n                                Box(Modifier.size(8.dp).background(tokens.danger, CircleShape))\n                                Spacer(Modifier.width(9.dp))\n                                Column(Modifier.weight(1f)) {\n                                    Text("最近拦截", color = tokens.textSecondary, style = MaterialTheme.typography.labelSmall)\n                                    Text(counters.lastBlockedDomain, color = tokens.textPrimary, style = MaterialTheme.typography.bodyMedium, maxLines = 1, overflow = TextOverflow.Ellipsis)\n                                }\n                            }\n                        }\n                    } else {\n                        Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {\n                            CompactMetric(snapshot.ruleCount.toString(), "有效规则", Modifier.weight(1f))\n                            CompactMetric(snapshot.blockCount.toString(), "拦截规则", Modifier.weight(1f))\n                            CompactMetric(snapshot.allowCount.toString(), "放行规则", Modifier.weight(1f))\n                        }\n                        Text(\n                            "模块模式是系统 hosts 静态拦截，Android 不会回传每一次命中，所以这里不伪造次数；状态 + 规则数量用于确认是否生效。需要看实时拦截次数时切到应用保护。",\n                            color = tokens.textSecondary, style = MaterialTheme.typography.bodySmall, lineHeight = 17.sp,\n                        )\n                    }\n                }\n            }\n        }\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''    val requests = remember(refresh) { controller.requestItems() }\n    val counters by produceState(initialValue = controller.dnsCounters(), refresh) {\n        while (true) {\n            value = controller.dnsCounters()\n            delay(1000)\n        }\n    }\n    val tokens = LocalBichenTokens.current\n    val vpnMode = controller.preferredVpnMode()\n'''
          new = '''    val requests by produceState(initialValue = controller.requestItems(), refresh) {\n        while (true) {\n            value = controller.requestItems()\n            delay(1000)\n        }\n    }\n    val counters by produceState(initialValue = controller.dnsCounters(), refresh) {\n        while (true) {\n            value = controller.dnsCounters()\n            delay(500)\n        }\n    }\n    val tokens = LocalBichenTokens.current\n    val vpnMode = controller.preferredVpnMode()\n    var logging by rememberSaveable { mutableStateOf(controller.requestLoggingEnabled()) }\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''                    Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {\n                        CompactMetric(counters.queries.toString(), "DNS 请求", Modifier.weight(1f))\n                        CompactMetric(counters.blocked.toString(), "累计拦截", Modifier.weight(1f))\n                        CompactMetric("${counters.blockRate}%", "拦截率", Modifier.weight(1f))\n                    }\n                    Text(\n                        if (vpnMode) "应用保护统计会每秒刷新；错误 ${counters.errors} 次。"\n                        else "当前是模块保护：这里只展示应用保护的历史精确统计，模块 hosts 命中不会伪造计数。",\n                        color = tokens.textSecondary,\n                        style = MaterialTheme.typography.bodySmall,\n                    )\n'''
          new = '''                    Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {\n                        CompactMetric(counters.blocked.toString(), "累计拦截", Modifier.weight(1f))\n                        CompactMetric(counters.sessionBlocked.toString(), "本次拦截", Modifier.weight(1f))\n                        CompactMetric("${counters.blockRate}%", "拦截率", Modifier.weight(1f))\n                    }\n                    Row(horizontalArrangement = Arrangement.spacedBy(12.dp)) {\n                        CompactMetric(counters.queries.toString(), "累计请求", Modifier.weight(1f))\n                        CompactMetric(counters.sessionQueries.toString(), "本次请求", Modifier.weight(1f))\n                        CompactMetric(counters.errors.toString(), "错误", Modifier.weight(1f))\n                    }\n                    if (vpnMode && counters.lastBlockedDomain.isNotBlank()) {\n                        Text("最近拦截 · ${counters.lastBlockedDomain}", color = tokens.danger, style = MaterialTheme.typography.bodySmall, maxLines = 1, overflow = TextOverflow.Ellipsis)\n                    }\n                    Text(\n                        if (vpnMode) "统计直接读取正在运行的 DNS 防护计数器，约 0.5 秒刷新，不再等 10 秒写入磁盘。"\n                        else "当前是模块保护：hosts 模式没有逐次命中回调，因此只展示应用保护的历史精确统计，不伪造数字。",\n                        color = tokens.textSecondary,\n                        style = MaterialTheme.typography.bodySmall,\n                    )\n'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''        item("recent") {\n            Row(verticalAlignment = Alignment.CenterVertically) {\n                Box(Modifier.weight(1f)) { CompactSectionHeading("最近记录", if (requests.isEmpty()) "尚无可统计 DNS 请求" else "${requests.size} 条本地记录") }\n                if (requests.isNotEmpty()) TextButton({ controller.clearRequests(); refresh++ }) { Text("清空记录") }\n            }\n        }\n'''
          new = '''        item("recent") {\n            Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {\n                Row(verticalAlignment = Alignment.CenterVertically) {\n                    Box(Modifier.weight(1f)) { CompactSectionHeading("最近记录", if (!logging) "记录默认关闭，打开后只保留最近 100 条" else if (requests.isEmpty()) "等待新的 DNS 请求" else "${requests.size} 条本地记录") }\n                    Switch(checked = logging, onCheckedChange = { logging = it; controller.setRequestLogging(it); refresh++ })\n                }\n                if (requests.isNotEmpty()) Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.End) {\n                    TextButton({ controller.clearRequests(); refresh++ }) { Text("清空记录") }\n                }\n            }\n        }\n'''
          assert old in s
          s = s.replace(old, new, 1)
          s = s.replace('if (item.time.isNotBlank()) Text(item.time.takeLast(8),', 'if (item.time.isNotBlank()) Text(item.time,', 1)
          # Slightly tighten the utility pages so they no longer feel like oversized demo cards.
          s = s.replace('contentPadding = PaddingValues(start = 20.dp, end = 20.dp, bottom = 124.dp)', 'contentPadding = PaddingValues(start = 16.dp, end = 16.dp, bottom = 112.dp)')
          s = s.replace('Row(Modifier.padding(18.dp), verticalAlignment = Alignment.CenterVertically)', 'Row(Modifier.padding(horizontal = 12.dp, vertical = 11.dp), verticalAlignment = Alignment.CenterVertically)')
          ui.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-app/app/src/main/java/io/github/xgl34222220/bichen/DnsVpnService.java \
                  android-app/app/src/main/java/io/github/xgl34222220/bichen/ui/BichenComposeController.kt \
                  android-app/app/src/main/java/io/github/xgl34222220/bichen/CompactMainActivity.kt
          git rm .github/workflows/patch-adblock-observability.yml
          git commit -m 'Rebuild adblock realtime observability and dashboard'
          git push
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false
      - name: Reuse verified Mihomo runtime
        uses: actions/download-artifact@v4
        with:
          name: Bichen-0.4.0-test.23-compose
          path: previous-artifact
          github-token: ${{ github.token }}
          repository: xgl34222220-ops/pichen
          run-id: 35035986825
      - name: Restore native runtime
        shell: bash
        run: |
          set -euo pipefail
          PREV=$(find previous-artifact -name '*.apk' -type f | head -n 1)
          test -n "$PREV"
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a android-app/app/src/main/jniLibs/x86_64
          mkdir -p android-app/app/src/main/assets/mihomo-root/arm64-v8a android-app/app/src/main/assets/mihomo-root/x86_64
          unzip -p "$PREV" lib/arm64-v8a/libbichen_core.so > android-app/app/src/main/jniLibs/arm64-v8a/libbichen_core.so
          unzip -p "$PREV" lib/x86_64/libbichen_core.so > android-app/app/src/main/jniLibs/x86_64/libbichen_core.so
          unzip -p "$PREV" assets/mihomo-root/arm64-v8a/mihomo > android-app/app/src/main/assets/mihomo-root/arm64-v8a/mihomo
          unzip -p "$PREV" assets/mihomo-root/x86_64/mihomo > android-app/app/src/main/assets/mihomo-root/x86_64/mihomo
          unzip -p "$PREV" assets/MIHOMO-LICENSE > android-app/app/src/main/assets/MIHOMO-LICENSE
          unzip -p "$PREV" assets/mihomo-revision.txt > android-app/app/src/main/assets/mihomo-revision.txt
      - name: Build APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: Bichen-0.4.0-test.24-observability
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
