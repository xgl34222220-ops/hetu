name: Fix proxy launch crash

on:
  push:
    branches: ['feature/compose-luoshu-ui']

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Fix proxy launch crash'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compose-luoshu-ui
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: true
      - name: Disable unstable per-card RuntimeShader blur
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android-app/app/src/main/java/io/github/xgl34222220/bichen/ComposeProxyActivity.kt')
          s = p.read_text()
          old = '''    var surface = modifier\n    if (backdrop != null) {\n        surface = surface.textureBlur(backdrop = backdrop, shape = shape, blurRadius = 18f)\n    }\n    surface = surface\n        .background(tokens.cardBackground.copy(alpha = if (backdrop != null) tintAlpha else .98f), shape)\n        .border(1.dp, tokens.outline.copy(alpha = if (backdrop != null) .42f else .60f), shape)\n        .clip(shape)\n'''
          new = '''    // Do not attach a RuntimeShader blur to every scrolling card. Some OEM GPU/WebView\n    // combinations crash the whole activity while Compose creates multiple blur RenderNodes.\n    // Keep the glass hierarchy with a translucent one-layer surface; the dock can still use\n    // the single, already-proven backdrop blur.\n    var surface = modifier\n        .background(tokens.cardBackground.copy(alpha = if (backdrop != null) tintAlpha else .98f), shape)\n        .border(1.dp, tokens.outline.copy(alpha = if (backdrop != null) .42f else .60f), shape)\n        .clip(shape)\n'''
          if old not in s:
              raise SystemExit('GlassBlock blur block not found')
          s = s.replace(old, new, 1)
          # Drop the direct textureBlur import from this activity; only BichenGlassDock owns blur now.
          s = s.replace('import top.yukonga.miuix.kmp.blur.textureBlur\n', '')
          p.write_text(s)
          PY
      - name: Compile proxy UI
        working-directory: android-app
        run: gradle :app:compileDebugKotlin --stacktrace
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-app/app/src/main/java/io/github/xgl34222220/bichen/ComposeProxyActivity.kt
          git commit -m 'Stabilize proxy launch by limiting RuntimeShader blur'
          git push origin HEAD:feature/compose-luoshu-ui
