name: Patch proxy panel entry density

on:
  push:
    branches: ['feature/compose-luoshu-ui']

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run proxy panel entry density'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compose-luoshu-ui
          fetch-depth: 0
      - name: Patch proxy panel and WebUI entry
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('android-app/app/src/main/java/io/github/xgl34222220/bichen/ComposeProxyActivity.kt')
          s = p.read_text()

          # Home: always-visible WebUI action.
          s = s.replace(
          '''    val tokens = LocalBichenTokens.current\n    val scheme = MaterialTheme.colorScheme\n    val good = delays.values.filter { it > 0L }''',
          '''    val tokens = LocalBichenTokens.current\n    val scheme = MaterialTheme.colorScheme\n    val context = LocalContext.current\n    val good = delays.values.filter { it > 0L }''', 1)
          s = s.replace(
          '''                actions = {\n                    ProxyHeaderAction(\n                        icon = Icons.Rounded.Refresh,''',
          '''                actions = {\n                    ProxyHeaderAction(\n                        icon = Icons.Rounded.Language,\n                        description = "WebUI",\n                        onClick = { context.startActivity(Intent(context, ProxyWebUiActivity::class.java)) },\n                    )\n                    ProxyHeaderAction(\n                        icon = Icons.Rounded.Refresh,''', 1)

          # Panel: WebUI becomes a first-class action. Sorting remains in Tune dialog.
          old_actions = '''                actions = {\n                    ProxyHeaderAction(\n                        icon = Icons.Rounded.Search,\n                        description = "搜索",\n                        onClick = { searchVisible = !searchVisible },\n                    )\n                    ProxyHeaderAction(\n                        icon = Icons.Rounded.Sort,\n                        description = "排序",\n                        onClick = {\n                            sort = if (sort == GroupSort.Config) GroupSort.Delay else GroupSort.Config\n                        },\n                    )\n                    ProxyHeaderAction(\n                        icon = Icons.Rounded.Tune,'''
          new_actions = '''                actions = {\n                    ProxyHeaderAction(\n                        icon = Icons.Rounded.Language,\n                        description = "WebUI",\n                        onClick = { context.startActivity(Intent(context, ProxyWebUiActivity::class.java)) },\n                    )\n                    ProxyHeaderAction(\n                        icon = Icons.Rounded.Search,\n                        description = "搜索",\n                        onClick = { searchVisible = !searchVisible },\n                    )\n                    ProxyHeaderAction(\n                        icon = Icons.Rounded.Tune,'''
          if old_actions not in s:
              raise SystemExit('panel actions block not found')
          s = s.replace(old_actions, new_actions, 1)

          # Strategy group expansion becomes a bottom sheet instead of stretching the grid inline.
          inline = '''\n                        row.firstOrNull { it.name == expandedGroup }?.let { group ->\n                            item("expanded-${group.name}") {\n                                ExpandedGroupNodes(\n                                    group = group,\n                                    delays = delays,\n                                    controller = controller,\n                                    activity = activity,\n                                    onStateChanged = onStateChanged,\n                                )\n                            }\n                        }\n'''
          if inline not in s:
              raise SystemExit('inline expanded group block not found')
          s = s.replace(inline, '\n', 1)

          marker = '''    if (showPanelSettings) {\n        PanelSettingsDialog('''
          sheet = '''    expandedGroup?.let { groupName ->\n        state.groups.firstOrNull { it.name == groupName }?.let { group ->\n            ModalBottomSheet(\n                onDismissRequest = { expandedGroup = null },\n                containerColor = tokens.pageBackground,\n                shape = RoundedCornerShape(topStart = 28.dp, topEnd = 28.dp),\n                dragHandle = { BottomSheetDefaults.DragHandle() },\n            ) {\n                ExpandedGroupNodes(\n                    group = group,\n                    delays = delays,\n                    controller = controller,\n                    activity = activity,\n                    onStateChanged = onStateChanged,\n                )\n            }\n        }\n    }\n\n    if (showPanelSettings) {\n        PanelSettingsDialog('''
          if marker not in s:
              raise SystemExit('panel settings marker not found')
          s = s.replace(marker, sheet, 1)

          # Compact bottom-sheet node list.
          start = s.index('@Composable\nprivate fun ExpandedGroupNodes(')
          end = s.index('@Composable\nprivate fun StrategyCard(', start)
          expanded = r'''@Composable
private fun ExpandedGroupNodes(
    group: ProxyGroupUi,
    delays: MutableMap<String, Long>,
    controller: ProxyComposeController,
    activity: ComponentActivity,
    onStateChanged: () -> Unit,
) {
    val tokens = LocalBichenTokens.current
    Column(
        Modifier.fillMaxWidth().padding(horizontal = 18.dp),
        verticalArrangement = Arrangement.spacedBy(12.dp),
    ) {
        Row(verticalAlignment = Alignment.CenterVertically) {
            MiniGroupIcon(group)
            Spacer(Modifier.width(10.dp))
            Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(2.dp)) {
                Text(
                    group.name,
                    color = tokens.textPrimary,
                    style = MaterialTheme.typography.titleMedium,
                    fontWeight = FontWeight.SemiBold,
                    maxLines = 1,
                    overflow = TextOverflow.Ellipsis,
                )
                Text(
                    "${group.nodes.size} 个节点 · 当前 ${group.now}",
                    color = tokens.textSecondary,
                    style = MaterialTheme.typography.bodySmall,
                    maxLines = 1,
                    overflow = TextOverflow.Ellipsis,
                )
            }
        }

        LazyColumn(
            modifier = Modifier.fillMaxWidth().heightIn(max = 560.dp),
            verticalArrangement = Arrangement.spacedBy(8.dp),
            contentPadding = PaddingValues(bottom = 22.dp),
        ) {
            items(group.nodes, key = { it.name }) { node ->
                NodeCard(
                    node = node,
                    delay = delays[node.name],
                    selected = group.now == node.name,
                    modifier = Modifier.fillMaxWidth(),
                    onSelect = {
                        activity.lifecycleScope.launch {
                            try {
                                controller.select(group.name, node.name)
                                onStateChanged()
                            } catch (_: Exception) {
                            }
                        }
                    },
                    onDelay = {
                        activity.lifecycleScope.launch {
                            delays[node.name] = -2L
                            val value = try {
                                controller.delay(node.name)
                            } catch (_: Exception) {
                                -1L
                            }
                            delays[node.name] = value
                        }
                    },
                )
            }
        }
    }
}

'''
          s = s[:start] + expanded + s[end:]

          # Strategy cards: compact single-layer glass-like surface rather than bulky white tiles.
          start = s.index('@Composable\nprivate fun StrategyCard(')
          end = s.index('@Composable\nprivate fun NodeCard(', start)
          strategy = r'''@Composable
private fun StrategyCard(
    group: ProxyGroupUi,
    delay: Long?,
    measured: Int,
    expanded: Boolean,
    modifier: Modifier,
    onClick: () -> Unit,
) {
    val tokens = LocalBichenTokens.current
    val scheme = MaterialTheme.colorScheme
    Surface(
        onClick = onClick,
        modifier = modifier,
        shape = RoundedCornerShape(18.dp),
        color = if (expanded) tokens.selectionBackground.copy(alpha = .74f) else tokens.cardBackground.copy(alpha = .88f),
        border = BorderStroke(1.dp, if (expanded) scheme.primary.copy(alpha = .22f) else tokens.outline.copy(alpha = .58f)),
        shadowElevation = 0.dp,
    ) {
        Column(
            Modifier.padding(horizontal = 12.dp, vertical = 11.dp),
            verticalArrangement = Arrangement.spacedBy(7.dp),
        ) {
            Row(verticalAlignment = Alignment.CenterVertically) {
                MiniGroupIcon(group)
                Spacer(Modifier.width(7.dp))
                Text(
                    group.name,
                    modifier = Modifier.weight(1f),
                    color = tokens.textPrimary,
                    style = MaterialTheme.typography.titleSmall,
                    fontWeight = FontWeight.SemiBold,
                    maxLines = 1,
                    overflow = TextOverflow.Ellipsis,
                )
                DelayPill(delay)
            }
            Text(
                group.now,
                color = tokens.textSecondary,
                style = MaterialTheme.typography.bodySmall,
                maxLines = 1,
                overflow = TextOverflow.Ellipsis,
            )
            Text(
                "${normalizedGroupType(group.type)} · $measured/${group.nodes.size}",
                color = tokens.textSecondary,
                style = MaterialTheme.typography.labelSmall,
                maxLines = 1,
            )
        }
    }
}

'''
          s = s[:start] + strategy + s[end:]

          # Node cards also use compact one-layer styling.
          start = s.index('@Composable\nprivate fun NodeCard(')
          end = s.index('@Composable\nprivate fun ConnectionCard(', start)
          node = r'''@Composable
private fun NodeCard(
    node: ProxyNodeUi,
    delay: Long?,
    selected: Boolean,
    modifier: Modifier,
    onSelect: () -> Unit,
    onDelay: () -> Unit,
) {
    val tokens = LocalBichenTokens.current
    val scheme = MaterialTheme.colorScheme
    Surface(
        onClick = onSelect,
        modifier = modifier,
        shape = RoundedCornerShape(16.dp),
        color = if (selected) tokens.selectionBackground.copy(alpha = .72f) else tokens.cardBackground.copy(alpha = .92f),
        border = BorderStroke(1.dp, if (selected) scheme.primary.copy(alpha = .22f) else tokens.outline.copy(alpha = .52f)),
        shadowElevation = 0.dp,
    ) {
        Row(
            Modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 10.dp),
            verticalAlignment = Alignment.CenterVertically,
        ) {
            Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(3.dp)) {
                Row(verticalAlignment = Alignment.CenterVertically) {
                    Text(
                        node.name,
                        modifier = Modifier.weight(1f),
                        color = tokens.textPrimary,
                        style = MaterialTheme.typography.bodyMedium,
                        fontWeight = if (selected) FontWeight.SemiBold else FontWeight.Medium,
                        maxLines = 1,
                        overflow = TextOverflow.Ellipsis,
                    )
                    if (selected) {
                        Spacer(Modifier.width(6.dp))
                        Icon(Icons.Rounded.CheckCircle, "已选择", tint = scheme.primary, modifier = Modifier.size(17.dp))
                    }
                }
                Text(
                    buildString {
                        if (node.udp) append("UDP")
                        if (node.udp && node.type.isNotBlank()) append(" · ")
                        if (node.type.isNotBlank()) append(node.type)
                        if (isEmpty()) append("节点")
                    },
                    color = tokens.textSecondary,
                    style = MaterialTheme.typography.labelSmall,
                    maxLines = 1,
                    overflow = TextOverflow.Ellipsis,
                )
            }
            Spacer(Modifier.width(10.dp))
            DelayPill(delay)
            IconButton(onClick = onDelay, modifier = Modifier.size(38.dp)) {
                Icon(Icons.Rounded.Speed, "测速", tint = scheme.primary, modifier = Modifier.size(18.dp))
            }
        }
    }
}

'''
          s = s[:start] + node + s[end:]

          # Top bars/actions/tabs: reduce visual bulk.
          s = s.replace('''.heightIn(min = 64.dp)\n            .padding(vertical = 8.dp),''', '''.heightIn(min = 58.dp)\n            .padding(vertical = 6.dp),''', 1)
          s = s.replace('''fontSize = 26.sp,\n            lineHeight = 34.sp,''', '''fontSize = 24.sp,\n            lineHeight = 30.sp,''', 1)
          s = s.replace('''    Box(Modifier.size(48.dp), contentAlignment = Alignment.Center) {\n        Surface(\n            modifier = Modifier.size(44.dp),\n            shape = CircleShape,\n            color = tokens.cardBackground,\n            contentColor = contentColor,\n            shadowElevation = 1.dp,''', '''    Box(Modifier.size(44.dp), contentAlignment = Alignment.Center) {\n        Surface(\n            modifier = Modifier.size(40.dp),\n            shape = RoundedCornerShape(14.dp),\n            color = tokens.controlBackground.copy(alpha = .88f),\n            contentColor = contentColor,\n            shadowElevation = 0.dp,''', 1)
          s = s.replace('''                Icon(icon, description, modifier = Modifier.size(21.dp))''', '''                Icon(icon, description, modifier = Modifier.size(20.dp))''', 1)

          # Replace tab styling with compact segmented chips.
          start = s.index('@Composable\nprivate fun PanelTabs(')
          end = s.index('@Composable\nprivate fun StatusPill(', start)
          tabs = r'''@Composable
private fun PanelTabs(tab: PanelTab, onSelect: (PanelTab) -> Unit) {
    val tokens = LocalBichenTokens.current
    Row(
        Modifier.fillMaxWidth().horizontalScroll(rememberScrollState()),
        horizontalArrangement = Arrangement.spacedBy(6.dp),
    ) {
        PanelTab.entries.forEach { item ->
            val selected = tab == item
            Surface(
                onClick = { onSelect(item) },
                shape = RoundedCornerShape(13.dp),
                color = if (selected) tokens.selectionBackground else tokens.controlBackground.copy(alpha = .78f),
                border = BorderStroke(1.dp, if (selected) MaterialTheme.colorScheme.primary.copy(alpha = .18f) else Color.Transparent),
                shadowElevation = 0.dp,
            ) {
                Text(
                    item.title,
                    modifier = Modifier.padding(horizontal = 13.dp, vertical = 7.dp),
                    color = if (selected) MaterialTheme.colorScheme.primary else tokens.textSecondary,
                    style = MaterialTheme.typography.labelMedium,
                    fontWeight = if (selected) FontWeight.SemiBold else FontWeight.Medium,
                )
            }
        }
    }
}

'''
          s = s[:start] + tabs + s[end:]

          # Tools: obvious WebUI entry even if user never notices the header icon.
          tools_marker = '''        item("speed") {\n            WorkspaceActionCard('''
          tools_webui = '''        item("webui") {\n            WorkspaceActionCard(\n                icon = Icons.Rounded.Language,\n                title = "WebUI",\n                subtitle = "打开本机 Zashboard · 与 Mihomo 控制接口同源",\n                trailing = if (state.running) "打开" else "未运行",\n                enabled = state.running,\n            ) {\n                context.startActivity(Intent(context, ProxyWebUiActivity::class.java))\n            }\n        }\n\n        item("speed") {\n            WorkspaceActionCard('''
          if tools_marker not in s:
              raise SystemExit('tools speed marker not found')
          s = s.replace(tools_marker, tools_webui, 1)

          p.write_text(s)

          # Mihomo itself should also point external-ui-url at Zashboard, not the old MetaCubeXD ZIP.
          m = Path('android-app/app/src/main/java/io/github/xgl34222220/bichen/MihomoStartupConfig.java')
          t = m.read_text()
          t = t.replace(
              'static final String EXTERNAL_UI_URL="https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip";',
              'static final String EXTERNAL_UI_URL="https://github.com/Zephyruso/zashboard/releases/latest/download/dist-no-fonts.zip";'
          )
          m.write_text(t)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-app/app/src/main/java/io/github/xgl34222220/bichen/ComposeProxyActivity.kt android-app/app/src/main/java/io/github/xgl34222220/bichen/MihomoStartupConfig.java
          git diff --cached --quiet && exit 0
          git commit -m 'Restore WebUI entry and compact proxy panel'
          git push origin HEAD:feature/compose-luoshu-ui
