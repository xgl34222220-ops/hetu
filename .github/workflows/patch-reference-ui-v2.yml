name: Patch native proxy settings

on:
  push:
    branches: ['feature/compose-luoshu-ui']

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run native settings patch 2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compose-luoshu-ui
          fetch-depth: 0
      - name: Apply native settings patch
        run: python3 .github/patch_native_settings.py
      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          grep -q 'private fun RefSettings(state: ProxyComposeState, onChanged: () -> Unit)' android-app/app/src/main/java/io/github/xgl34222220/bichen/ReferenceProxyActivity.kt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app/app/src/main/java/io/github/xgl34222220/bichen/ReferenceProxyActivity.kt
          git commit -m "Use native proxy settings pickers instead of generic page"
          git push origin HEAD:feature/compose-luoshu-ui
