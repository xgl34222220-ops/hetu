name: Patch WebUI bootstrap

on:
  push:
    branches: ['feature/compose-luoshu-ui']

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run WebUI bootstrap fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compose-luoshu-ui
          fetch-depth: 0
      - name: Apply WebUI bootstrap fix
        run: python3 tools/patch_webui_remote_bootstrap.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-app/app/src/main/java/io/github/xgl34222220/bichen/ProxyWebUiActivity.kt
          git commit -m "Fix hosted MetaCubeXD bootstrap reload"
          git push origin HEAD:feature/compose-luoshu-ui
