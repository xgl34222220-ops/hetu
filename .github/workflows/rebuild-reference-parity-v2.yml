name: Rebuild reference parity v2

on:
  push:
    branches: ['feature/compose-luoshu-ui']

permissions:
  contents: write
  actions: read

jobs:
  rebuild:
    if: github.event.head_commit.message == 'Run reference parity rebuild v2'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compose-luoshu-ui
      - name: Patch reference parity and dead interactions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('android-app/app/src/main/java/io/github/xgl34222220/bichen/ReferenceProxyActivity.kt')
          s = p.read_text()

          # Reference-video navigation language.
          s = s.replace('Overview("概览"), Nodes("节点")', 'Overview("策略"), Nodes("节点")')
          s = s.replace('var tab by rememberSaveable { mutableStateOf(RefPanelTab.Nodes) }', 'var tab by rememberSaveable { mutableStateOf(RefPanelTab.Overview) }', 1)
          s = s.replace('''    val scope = rememberCoroutineScope()\n    val t = LocalBichenTokens.current\n    var tab by rememberSaveable''', '''    val scope = rememberCoroutineScope()\n    val context = LocalContext.current\n    val t = LocalBichenTokens.current\n    var tab by rememberSaveable''', 1)

          # Search state + filtered group/node data.
          marker = '    var error by remember { mutableStateOf("") }\n\n    suspend fun loadTab()'
          if marker in s:
              s = s.replace(marker, '''    var error by remember { mutableStateOf("") }\n    var searchOpen by rememberSaveable { mutableStateOf(false) }\n    var query by rememberSaveable { mutableStateOf("") }\n\n    val filteredGroups = remember(state.groups, query) {\n        state.groups.filter { group ->\n            query.isBlank() || group.name.contains(query, true) || group.now.contains(query, true) ||\n                group.nodes.any { it.name.contains(query, true) }\n        }\n    }\n    val filteredNodes = remember(state.groups, query) {\n        state.groups.flatMap { it.nodes }.distinctBy { it.name }.filter { node ->\n            query.isBlank() || node.name.contains(query, true) || node.type.contains(query, true)\n        }\n    }\n\n    suspend fun loadTab()''', 1)

          # All-node speed test must work from both Strategy and Nodes tabs.
          s = s.replace('''                    RefPanelTab.Nodes -> delays.putAll(repo.globalDelay())\n                    RefPanelTab.Subscriptions -> providers = repo.refreshSubscriptions()\n                    RefPanelTab.RuleSets -> ruleSets = repo.refreshRuleSets()\n                    RefPanelTab.Rules -> rules = repo.rules()\n                    RefPanelTab.Overview, RefPanelTab.Connections -> onRefreshState()''', '''                    RefPanelTab.Overview, RefPanelTab.Nodes -> delays.putAll(repo.globalDelay())\n                    RefPanelTab.Subscriptions -> providers = repo.refreshSubscriptions()\n                    RefPanelTab.RuleSets -> ruleSets = repo.refreshRuleSets()\n                    RefPanelTab.Rules -> rules = repo.rules()\n                    RefPanelTab.Connections -> onRefreshState()''', 1)

          # Header: match video — title/subtitle + WebUI + search, no oversized floating circles.
          old_header = '''            item {\n                Column(Modifier.statusBarsPadding(), verticalArrangement = Arrangement.spacedBy(8.dp)) {\n                    Row(verticalAlignment = Alignment.CenterVertically) {\n                        Spacer(Modifier.width(44.dp))\n                        Text("面板", color = t.textPrimary, fontSize = 22.sp, fontWeight = FontWeight.Bold, modifier = Modifier.weight(1f))\n                        IconButton(onClick = ::refresh, enabled = !refreshing) {\n                            if (refreshing) CircularProgressIndicator(Modifier.size(20.dp), strokeWidth = 2.dp)\n                            else Icon(Icons.Rounded.Refresh, "刷新")\n                        }\n                    }\n                    RefPanelTabs(tab) { tab = it }\n                }\n            }'''
          new_header = '''            item {\n                Column(Modifier.statusBarsPadding(), verticalArrangement = Arrangement.spacedBy(8.dp)) {\n                    Row(verticalAlignment = Alignment.CenterVertically) {\n                        Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(1.dp)) {\n                            Text("代理面板", color = t.textPrimary, fontSize = 24.sp, lineHeight = 30.sp, fontWeight = FontWeight.Bold)\n                            Text("${state.groups.size} 个策略组", color = t.textSecondary, style = MaterialTheme.typography.labelSmall)\n                        }\n                        IconButton(onClick = { context.startActivity(Intent(context, ProxyWebUiActivity::class.java)) }, modifier = Modifier.size(40.dp)) {\n                            Icon(Icons.Rounded.Language, "WebUI", tint = MaterialTheme.colorScheme.primary, modifier = Modifier.size(19.dp))\n                        }\n                        IconButton(onClick = { searchOpen = !searchOpen; if (!searchOpen) query = "" }, modifier = Modifier.size(40.dp)) {\n                            Icon(if (searchOpen) Icons.Rounded.Close else Icons.Rounded.Search, "搜索", tint = t.textSecondary, modifier = Modifier.size(19.dp))\n                        }\n                    }\n                    RefPanelTabs(tab) { tab = it }\n                    if (searchOpen) {\n                        OutlinedTextField(\n                            value = query,\n                            onValueChange = { query = it },\n                            modifier = Modifier.fillMaxWidth(),\n                            singleLine = true,\n                            placeholder = { Text("搜索策略组或节点") },\n                            leadingIcon = { Icon(Icons.Rounded.Search, null, Modifier.size(18.dp)) },\n                            shape = RoundedCornerShape(13.dp),\n                        )\n                    }\n                }\n            }'''
          if old_header in s:
              s = s.replace(old_header, new_header, 1)

          # Strategy tab and real all-nodes tab.
          old_tabs = '''                RefPanelTab.Overview -> item { RefPanelOverview(state, delays) }\n                RefPanelTab.Nodes -> {\n                    item {\n                        Row(verticalAlignment = Alignment.CenterVertically) {\n                            Text("策略组", color = t.textPrimary, style = MaterialTheme.typography.titleMedium, modifier = Modifier.weight(1f))\n                            TextButton(onClick = ::refresh, enabled = !refreshing) { Text(if (refreshing) "测速中" else "全部测速") }\n                        }\n                    }\n                    itemsIndexed(state.groups.chunked(2), key = { index, _ -> "groups-$index" }) { _, pair ->\n                        Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {\n                            pair.forEach { group ->\n                                val selected = selectedLocal[group.name] ?: group.now\n                                RefGroupCard(\n                                    group = group,\n                                    selected = selected,\n                                    expanded = selectedGroupName == group.name,\n                                    delay = delays[selected] ?: group.nodes.firstOrNull { it.name == selected }?.lastDelay,\n                                    modifier = Modifier.weight(1f),\n                                    onClick = {\n                                        selectedGroupName = group.name\n                                        pendingNode = selected\n                                    },\n                                )\n                            }\n                            if (pair.size == 1) Spacer(Modifier.weight(1f))\n                        }\n                    }\n                }'''
          new_tabs = '''                RefPanelTab.Overview -> {\n                    item {\n                        Surface(shape = RoundedCornerShape(15.dp), color = t.cardBackground, shadowElevation = 0.dp) {\n                            Row(Modifier.fillMaxWidth().padding(horizontal = 14.dp, vertical = 10.dp), verticalAlignment = Alignment.CenterVertically) {\n                                Box(Modifier.size(34.dp).background(t.selectionBackground, RoundedCornerShape(11.dp)), contentAlignment = Alignment.Center) {\n                                    Icon(Icons.Rounded.Speed, null, tint = MaterialTheme.colorScheme.primary, modifier = Modifier.size(19.dp))\n                                }\n                                Spacer(Modifier.width(10.dp))\n                                Column(Modifier.weight(1f)) {\n                                    Text("策略组", color = t.textPrimary, style = MaterialTheme.typography.titleMedium)\n                                    Text("${filteredGroups.size} 个策略组 · 点击卡片选择节点", color = t.textSecondary, style = MaterialTheme.typography.labelSmall)\n                                }\n                                TextButton(onClick = ::refresh, enabled = !refreshing) { Text(if (refreshing) "测速中" else "全部测速") }\n                            }\n                        }\n                    }\n                    itemsIndexed(filteredGroups.chunked(2), key = { index, _ -> "groups-$index" }) { _, pair ->\n                        Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {\n                            pair.forEach { group ->\n                                val selected = selectedLocal[group.name] ?: group.now\n                                RefGroupCard(\n                                    group = group,\n                                    selected = selected,\n                                    expanded = selectedGroupName == group.name,\n                                    delay = delays[selected] ?: group.nodes.firstOrNull { it.name == selected }?.lastDelay,\n                                    modifier = Modifier.weight(1f),\n                                    onClick = { selectedGroupName = group.name; pendingNode = selected },\n                                )\n                            }\n                            if (pair.size == 1) Spacer(Modifier.weight(1f))\n                        }\n                    }\n                }\n                RefPanelTab.Nodes -> {\n                    item {\n                        Row(verticalAlignment = Alignment.CenterVertically) {\n                            Text("全部节点", color = t.textPrimary, style = MaterialTheme.typography.titleMedium, modifier = Modifier.weight(1f))\n                            TextButton(onClick = ::refresh, enabled = !refreshing) { Text(if (refreshing) "测速中" else "全部测速") }\n                        }\n                    }\n                    itemsIndexed(filteredNodes.chunked(2), key = { index, _ -> "nodes-$index" }) { _, pair ->\n                        Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {\n                            pair.forEach { node ->\n                                RefLeafNodeCard(node, delays[node.name] ?: node.lastDelay, Modifier.weight(1f)) {\n                                    if (testing[node.name] != true) scope.launch {\n                                        testing[node.name] = true\n                                        try { delays[node.name] = repo.delay(node.name) }\n                                        catch (_: Exception) { delays[node.name] = -1L }\n                                        finally { testing.remove(node.name) }\n                                    }\n                                }\n                            }\n                            if (pair.size == 1) Spacer(Modifier.weight(1f))\n                        }\n                    }\n                }'''
          if old_tabs in s:
              s = s.replace(old_tabs, new_tabs, 1)

          # Subscription rows should actually open something.
          s = s.replace('RefPanelTab.Subscriptions -> items(providers, key = { it.name }) { RefProviderRow(it) }', '''RefPanelTab.Subscriptions -> items(providers, key = { it.name }) { item ->\n                    RefProviderRow(item) { context.startActivity(Intent(context, ProxySubscriptionActivity::class.java)) }\n                }''', 1)

          # Strategy cards with the icon hierarchy visible in the reference video.
          start = s.index('private fun RefGroupCard(')
          end = s.index('\n@Composable\nprivate fun RefDelayBadge', start)
          replacement = '''private fun RefGroupCard(group: ProxyGroupUi, selected: String, expanded: Boolean, delay: Long?, modifier: Modifier, onClick: () -> Unit) {\n    val t = LocalBichenTokens.current\n    val scheme = MaterialTheme.colorScheme\n    val shape = RoundedCornerShape(15.dp)\n    val glass = if (expanded) {\n        Brush.verticalGradient(listOf(t.selectionBackground.copy(alpha = .96f), scheme.primaryContainer.copy(alpha = .38f)))\n    } else {\n        Brush.verticalGradient(listOf(t.cardBackground.copy(alpha = .98f), t.elevatedCardBackground.copy(alpha = .72f)))\n    }\n    Column(\n        modifier.background(glass, shape)\n            .border(.7.dp, if (expanded) scheme.primary.copy(alpha = .24f) else t.outline.copy(alpha = .46f), shape)\n            .clickable(onClick = onClick)\n            .padding(horizontal = 11.dp, vertical = 10.dp),\n        verticalArrangement = Arrangement.spacedBy(8.dp),\n    ) {\n        Row(verticalAlignment = Alignment.CenterVertically) {\n            Box(Modifier.size(32.dp).background(scheme.primary.copy(alpha = .09f), RoundedCornerShape(10.dp)), contentAlignment = Alignment.Center) {\n                Icon(refGroupIcon(group.type), null, tint = scheme.primary, modifier = Modifier.size(18.dp))\n            }\n            Spacer(Modifier.width(8.dp))\n            Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(1.dp)) {\n                Text(group.name, color = t.textPrimary, style = MaterialTheme.typography.titleSmall, maxLines = 1, overflow = TextOverflow.Ellipsis)\n                Text(refGroupType(group.type), color = t.textSecondary, style = MaterialTheme.typography.labelSmall, maxLines = 1)\n            }\n            RefDelayBadge(delay, false, null)\n        }\n        Row(verticalAlignment = Alignment.CenterVertically) {\n            Text(selected.ifBlank { "未选择" }, color = t.textSecondary, style = MaterialTheme.typography.labelSmall, maxLines = 1, overflow = TextOverflow.Ellipsis, modifier = Modifier.weight(1f))\n            Text("${group.nodes.size} 节点", color = t.textSecondary, style = MaterialTheme.typography.labelSmall)\n            if (expanded) { Spacer(Modifier.width(5.dp)); Icon(Icons.Rounded.CheckCircle, "已打开", tint = scheme.primary, modifier = Modifier.size(15.dp)) }\n        }\n    }\n}\n\n@Composable\nprivate fun RefLeafNodeCard(node: ProxyNodeUi, delay: Long?, modifier: Modifier, onClick: () -> Unit) {\n    val t = LocalBichenTokens.current\n    val scheme = MaterialTheme.colorScheme\n    val shape = RoundedCornerShape(14.dp)\n    Column(\n        modifier.background(t.cardBackground, shape).border(.7.dp, t.outline.copy(alpha = .45f), shape).clickable(onClick = onClick).padding(11.dp),\n        verticalArrangement = Arrangement.spacedBy(7.dp),\n    ) {\n        Row(verticalAlignment = Alignment.CenterVertically) {\n            Box(Modifier.size(28.dp).background(scheme.primary.copy(alpha = .08f), RoundedCornerShape(9.dp)), contentAlignment = Alignment.Center) {\n                Icon(Icons.Rounded.Public, null, tint = scheme.primary, modifier = Modifier.size(16.dp))\n            }\n            Spacer(Modifier.width(7.dp))\n            Text(node.name, color = t.textPrimary, style = MaterialTheme.typography.titleSmall, maxLines = 1, overflow = TextOverflow.Ellipsis, modifier = Modifier.weight(1f))\n            RefDelayBadge(delay, false, null)\n        }\n        Text(listOf(node.type.ifBlank { "节点" }, if (node.udp) "UDP" else "").filter { it.isNotBlank() }.joinToString(" · "), color = t.textSecondary, style = MaterialTheme.typography.labelSmall, maxLines = 1, overflow = TextOverflow.Ellipsis)\n    }\n}\n\nprivate fun refGroupIcon(type: String): ImageVector = when (type.lowercase()) {\n    "urltest", "fallback" -> Icons.Rounded.Speed\n    "selector" -> Icons.Rounded.Tune\n    "loadbalance" -> Icons.Rounded.SwapHoriz\n    else -> Icons.Rounded.Hub\n}\n\nprivate fun refGroupType(type: String): String = when (type.lowercase()) {\n    "urltest" -> "自动测速"\n    "selector" -> "手动选择"\n    "fallback" -> "故障转移"\n    "loadbalance" -> "负载均衡"\n    else -> type.ifBlank { "策略组" }\n}\n'''
          s = s[:start] + replacement + s[end:]

          # Bottom sheet gets the same group icon so it visually connects with the tapped card.
          sheet_old = '''        Column(Modifier.fillMaxWidth(), horizontalAlignment = Alignment.CenterHorizontally) {\n            Text(group.name, color = t.textPrimary, fontSize = 20.sp, fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis)\n            Text("${group.nodes.size} 个节点", color = t.textSecondary, style = MaterialTheme.typography.bodySmall)\n        }'''
          sheet_new = '''        Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {\n            Box(Modifier.size(38.dp).background(scheme.primary.copy(alpha = .09f), RoundedCornerShape(12.dp)), contentAlignment = Alignment.Center) {\n                Icon(refGroupIcon(group.type), null, tint = scheme.primary, modifier = Modifier.size(21.dp))\n            }\n            Spacer(Modifier.width(10.dp))\n            Column(Modifier.weight(1f)) {\n                Text(group.name, color = t.textPrimary, fontSize = 19.sp, fontWeight = FontWeight.Bold, maxLines = 1, overflow = TextOverflow.Ellipsis)\n                Text("${refGroupType(group.type)} · ${group.nodes.size} 个节点", color = t.textSecondary, style = MaterialTheme.typography.bodySmall)\n            }\n        }'''
          s = s.replace(sheet_old, sheet_new, 1)

          # Provider cards + settings rows are no longer dead-looking taps.
          s = s.replace('private fun RefProviderRow(item: DashboardProviderUi) {', 'private fun RefProviderRow(item: DashboardProviderUi, onClick: () -> Unit) {', 1)
          s = s.replace('Surface(shape = RoundedCornerShape(12.dp), color = t.cardBackground, shadowElevation = 0.dp) {\n        Column(Modifier.fillMaxWidth().padding(12.dp), verticalArrangement = Arrangement.spacedBy(5.dp)) {\n            Text(item.name', 'Surface(onClick = onClick, shape = RoundedCornerShape(12.dp), color = t.cardBackground, shadowElevation = 0.dp) {\n        Column(Modifier.fillMaxWidth().padding(12.dp), verticalArrangement = Arrangement.spacedBy(5.dp)) {\n            Text(item.name', 1)
          s = s.replace('RefValueRow("核心", state.core, null)', 'RefValueRow("核心", state.core) { context.startActivity(Intent(context, RootTproxyActivity::class.java)) }', 1)
          s = s.replace('RefValueRow("运行模式", state.mode, null)', 'RefValueRow("运行模式", state.mode) { context.startActivity(Intent(context, RootTproxyActivity::class.java)) }', 1)
          s = s.replace('RefValueRow("IPv6", state.ipv6, null)', 'RefValueRow("IPv6", state.ipv6) { context.startActivity(Intent(context, RootTproxyActivity::class.java)) }', 1)
          s = s.replace('RefValueRow("当前配置", state.config, null)', 'RefValueRow("当前配置", state.config) { context.startActivity(Intent(context, ProxySubscriptionActivity::class.java)) }', 1)

          # Proxy home closer to the video: smaller title, remove giant watermark icon and oversized status block.
          s = s.replace('Text("辟尘", color = t.textPrimary, fontSize = 32.sp, lineHeight = 38.sp, fontWeight = FontWeight.Bold, modifier = Modifier.weight(1f))', 'Text("代理", color = t.textPrimary, fontSize = 26.sp, lineHeight = 32.sp, fontWeight = FontWeight.Bold, modifier = Modifier.weight(1f))', 1)
          s = s.replace('.heightIn(min = 158.dp),', '.heightIn(min = 118.dp),', 1)
          icon_block = '''                Icon(\n                    if (state.running) Icons.Rounded.CheckCircle else Icons.Rounded.PowerSettingsNew,\n                    contentDescription = null,\n                    tint = scheme.primary.copy(alpha = .50f),\n                    modifier = Modifier.align(Alignment.BottomEnd).offset(x = 22.dp, y = 22.dp).size(114.dp),\n                )\n'''
          s = s.replace(icon_block, '', 1)
          s = s.replace('Modifier.fillMaxWidth().padding(18.dp)', 'Modifier.fillMaxWidth().padding(15.dp)', 1)
          s = s.replace('fontSize = 21.sp, fontWeight = FontWeight.Bold', 'fontSize = 18.sp, fontWeight = FontWeight.SemiBold', 1)

          p.write_text(s)

          # Adblock: request activity is live, and starting application protection turns request recording on.
          p = Path('android-app/app/src/main/java/io/github/xgl34222220/bichen/ui/BichenComposeController.kt')
          s = p.read_text()
          s = s.replace('prefs.edit().putBoolean("vpnWanted", true).remove("vpnError").apply()', 'prefs.edit().putBoolean("vpnWanted", true).putBoolean("requestLogs", true).remove("vpnError").apply()', 1)
          p.write_text(s)

          p = Path('android-app/app/src/main/java/io/github/xgl34222220/bichen/CompactMainActivity.kt')
          s = p.read_text()
          if 'val requests = remember(refresh) { controller.requestItems() }' in s:
              s = s.replace('val requests = remember(refresh) { controller.requestItems() }', '''val requests by produceState(initialValue = controller.requestItems(), refresh) {\n        while (true) {\n            value = controller.requestItems()\n            delay(700)\n        }\n    }''', 1)
          s = s.replace('modifier = modifier.height(108.dp)', 'modifier = modifier.height(92.dp)')
          p.write_text(s)

          p = Path('android-app/app/src/main/java/io/github/xgl34222220/bichen/ui/BichenGlassDock.kt')
          s = p.read_text().replace('.shadow(7.dp, shape, clip = false)', '.shadow(4.dp, shape, clip = false)')
          p.write_text(s)

          # Fail early only on the actual required outcomes.
          proxy = Path('android-app/app/src/main/java/io/github/xgl34222220/bichen/ReferenceProxyActivity.kt').read_text()
          assert 'refGroupIcon' in proxy
          assert 'Text("代理面板"' in proxy
          assert 'ProxyWebUiActivity::class.java' in proxy
          assert 'RefPanelTab.Overview, RefPanelTab.Nodes -> delays.putAll(repo.globalDelay())' in proxy
          assert 'RefLeafNodeCard' in proxy
          assert 'RefProviderRow(item) {' in proxy
          controller = Path('android-app/app/src/main/java/io/github/xgl34222220/bichen/ui/BichenComposeController.kt').read_text()
          assert 'putBoolean("requestLogs", true)' in controller
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add android-app/app/src/main/java/io/github/xgl34222220/bichen/ReferenceProxyActivity.kt android-app/app/src/main/java/io/github/xgl34222220/bichen/CompactMainActivity.kt android-app/app/src/main/java/io/github/xgl34222220/bichen/ui/BichenComposeController.kt android-app/app/src/main/java/io/github/xgl34222220/bichen/ui/BichenGlassDock.kt
          git commit -m 'Match reference strategy UI and repair dead interactions'
          git push origin HEAD:feature/compose-luoshu-ui
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Reuse verified Mihomo runtime
        uses: actions/download-artifact@v4
        with:
          name: Bichen-0.4.0-test.23-compose
          path: previous-artifact
          github-token: ${{ github.token }}
          repository: xgl34222220-ops/pichen
          run-id: 35035986825
      - name: Restore native runtime
        shell: bash
        run: |
          set -euo pipefail
          PREV=$(find previous-artifact -name '*.apk' -type f | head -n 1)
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a android-app/app/src/main/jniLibs/x86_64 android-app/app/src/main/assets/mihomo-root/arm64-v8a android-app/app/src/main/assets/mihomo-root/x86_64
          unzip -p "$PREV" lib/arm64-v8a/libbichen_core.so > android-app/app/src/main/jniLibs/arm64-v8a/libbichen_core.so
          unzip -p "$PREV" lib/x86_64/libbichen_core.so > android-app/app/src/main/jniLibs/x86_64/libbichen_core.so
          unzip -p "$PREV" assets/mihomo-root/arm64-v8a/mihomo > android-app/app/src/main/assets/mihomo-root/arm64-v8a/mihomo
          unzip -p "$PREV" assets/mihomo-root/x86_64/mihomo > android-app/app/src/main/assets/mihomo-root/x86_64/mihomo
          unzip -p "$PREV" assets/MIHOMO-LICENSE > android-app/app/src/main/assets/MIHOMO-LICENSE
          unzip -p "$PREV" assets/mihomo-revision.txt > android-app/app/src/main/assets/mihomo-revision.txt
      - name: Build APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: Bichen-0.4.0-test.25-reference-parity
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
