name: Recover stability speed UI fixes

on:
  push:
    branches: ['feature/compose-luoshu-ui']

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Recover stability speed UI fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compose-luoshu-ui
          fetch-depth: 0
      - name: Recover and apply patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/apply-stability-speed-ui-fixes.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          raw = source[start:end]
          fixed = []
          for line in raw.splitlines():
              fixed.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/bichen_patch.py').write_text('\n'.join(fixed) + '\n')
          PY
          python3 /tmp/bichen_patch.py
      - name: Commit fixes
        shell: bash
        run: |
          rm -f .github/workflows/apply-stability-speed-ui-fixes.yml .github/workflows/recover-stability-speed-ui-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix protection startup app preload rules and latency feedback"
          git push origin HEAD:feature/compose-luoshu-ui
