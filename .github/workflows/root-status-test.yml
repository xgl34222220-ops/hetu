name: Bichen request logs test6
on:
  push:
    branches: ['fix/root-status-test4']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install build and test tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          sudo apt-get update -qq
          sudo apt-get install -y -qq mksh busybox
      - name: Apply checked request-log repair source
        run: |
          if [ -f tools/prepare_logs6.py ]; then
            python3 tools/prepare_logs6.py
            python3 tools/test_java.py --protocol-only
            python3 -m unittest discover -s tests -p '*test.py' -v
            rm tools/prepare_logs6.py
            git add android-app/app/src/main/java tools tests
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Fix request log recovery and live refresh; explain DNS-only recording'
            git push origin HEAD:fix/root-status-test4
          fi
      - name: Build preview and execute regressions
        run: python3 tools/build_preview.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test log writer and live activity on installed APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 360
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: |
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            python3 tools/test_device.py
      - name: Preserve internal build and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: INTERNAL-Bichen-test6-unsigned-not-flashable
          path: |
            out/preview/*-unsigned.apk
            out/preview/*-module.zip
            out/preview/*-source.zip
            out/preview/apksigner.jar
            out/preview/build-info.json
            out/preview/apk-badging.txt
            out/preview/SHA256SUMS.txt
            out/device/device-results.txt
            out/device/screenshots/*.png
          if-no-files-found: error
          retention-days: 14
