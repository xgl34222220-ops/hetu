name: Route reference proxy workspace

on:
  push:
    branches: ['feature/compose-luoshu-ui']

permissions:
  contents: write
  actions: read

jobs:
  route-build:
    if: github.event.head_commit.message == 'Route proxy to reference dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compose-luoshu-ui
          fetch-depth: 0
      - name: Route default proxy entry to complete reference workspace
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android-app/app/src/main/java/io/github/xgl34222220/bichen/CompactMainActivity.kt')
          s = p.read_text()
          old = 'context.startActivity(Intent(context, ComposeProxyActivity::class.java))'
          new = 'context.startActivity(Intent(context, ReferenceProxyActivity::class.java))'
          if old not in s:
              raise SystemExit('default proxy entry not found')
          s = s.replace(old, new)
          p.write_text(s)

          m = Path('android-app/app/src/main/AndroidManifest.xml')
          ms = m.read_text()
          ms = ms.replace('<activity android:name=".ReferenceProxyActivity" android:label="代理（旧参考界面）" android:exported="false" />', '<activity android:name=".ReferenceProxyActivity" android:label="代理" android:exported="false" />')
          ms = ms.replace('<activity android:name=".ComposeProxyActivity" android:label="代理" android:exported="false" />', '<activity android:name=".ComposeProxyActivity" android:label="代理（旧 Compose）" android:exported="false" />')
          m.write_text(ms)
          PY
      - name: Commit routed proxy workspace
        shell: bash
        run: |
          git config user.name 'xgl34222220-ops'
          git config user.email 'xgl34222220@gmail.com'
          git add android-app/app/src/main/java/io/github/xgl34222220/bichen/CompactMainActivity.kt android-app/app/src/main/AndroidManifest.xml
          git commit -m 'Use complete reference proxy workspace by default'
          git push origin HEAD:feature/compose-luoshu-ui
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: false
      - name: Reuse verified Mihomo runtime
        uses: actions/download-artifact@v4
        with:
          name: Bichen-0.4.0-test.23-compose
          path: previous-artifact
          github-token: ${{ github.token }}
          repository: xgl34222220-ops/pichen
          run-id: 35035986825
      - name: Restore native runtime
        shell: bash
        run: |
          set -euo pipefail
          PREV=$(find previous-artifact -name '*.apk' -type f | head -n 1)
          test -n "$PREV"
          mkdir -p android-app/app/src/main/jniLibs/arm64-v8a android-app/app/src/main/jniLibs/x86_64
          mkdir -p android-app/app/src/main/assets/mihomo-root/arm64-v8a android-app/app/src/main/assets/mihomo-root/x86_64
          unzip -p "$PREV" lib/arm64-v8a/libbichen_core.so > android-app/app/src/main/jniLibs/arm64-v8a/libbichen_core.so
          unzip -p "$PREV" lib/x86_64/libbichen_core.so > android-app/app/src/main/jniLibs/x86_64/libbichen_core.so
          unzip -p "$PREV" assets/mihomo-root/arm64-v8a/mihomo > android-app/app/src/main/assets/mihomo-root/arm64-v8a/mihomo
          unzip -p "$PREV" assets/mihomo-root/x86_64/mihomo > android-app/app/src/main/assets/mihomo-root/x86_64/mihomo
          unzip -p "$PREV" assets/MIHOMO-LICENSE > android-app/app/src/main/assets/MIHOMO-LICENSE
          unzip -p "$PREV" assets/mihomo-revision.txt > android-app/app/src/main/assets/mihomo-revision.txt
      - name: Build reference proxy APK
        working-directory: android-app
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK" >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: Bichen-0.4.0-test.24-reference-proxy
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
