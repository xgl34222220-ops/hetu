name: Run glass strategy patch

on:
  push:
    branches:
      - feature/compose-luoshu-ui

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message == 'Run glass strategy patch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/compose-luoshu-ui
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/bichen_patch_glass.py
      - name: Commit patched UI
        shell: bash
        run: |
          rm -f .github/bichen_patch_glass.py .github/workflows/run-glass-strategy-patch.yml .github/workflows/apply-reference-glass-strategy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Match reference glass strategy cards and node sheet"
          git push origin HEAD:feature/compose-luoshu-ui
