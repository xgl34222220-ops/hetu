name: Smoke BoxProxy 0.4.0-test.26 artifact
on:
  push:
    branches: ['feature/compose-luoshu-ui']
permissions:
  actions: read
  contents: read
jobs:
  smoke:
    if: github.event.head_commit.message == 'Run BoxProxy artifact smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Bichen-0.4.0-test.26-boxproxy-spec
          path: /tmp/boxproxy-artifact
          github-token: ${{ github.token }}
          repository: xgl34222220-ops/pichen
          run-id: '35062470806'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Locate APK
        shell: bash
        run: |
          APK=$(find /tmp/boxproxy-artifact -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 35 BoxProxy smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          disable-animations: false
          emulator-boot-timeout: 360
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back none
          script: APK="$APK" bash tools/smoke_compose_ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bichen-0.4.0-test.26-boxproxy-smoke
          path: out/compose-smoke/*
          if-no-files-found: warn
          retention-days: 7
