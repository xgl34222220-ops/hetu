name: UI audit source snapshot
on:
  push:
    branches: [feature/hetu-rebrand-root-app]
    paths: [.github/workflows/ui-audit-source.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=zip --output="$RUNNER_TEMP/hetu-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: Hetu-UI-Source
          path: ${{ runner.temp }}/hetu-source.zip
          retention-days: 3
          if-no-files-found: error
