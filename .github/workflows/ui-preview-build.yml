name: UI preview build

# Dedicated simple build for the Claude-written UI preview branch.
# Builds the branch as-is (no V20 source restore). Debug-signed only.

on:
  push:
    branches: ['test/v20.49-ui-preview-apk']
  workflow_dispatch:

env:
  HETU_TEST_KEYSTORE: /home/runner/.android/hetu-ui10-debug.jks

permissions:
  contents: read
  actions: read

concurrency:
  group: ui-preview-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Same signing identity as the shipped test builds, so the APK installs
      # over the current app without uninstalling (settings and configs kept).
      - name: Restore signing identity
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.android/hetu-ui10-debug.jks
          key: hetu-ui10-debug-signing-v1
          fail-on-cache-miss: true

      - name: Verify signing identity
        run: |
          set -euo pipefail
          test -s "$HETU_TEST_KEYSTORE"
          keytool -exportcert -keystore "$HETU_TEST_KEYSTORE" -alias androiddebugkey -storepass android \
            | openssl dgst -sha256 -r | cut -d ' ' -f1 | grep -qx '701bbb0aaa5709cf2bebd96ff85ebd64c06cf6c3a2211ec21a9c51e534a5faad'

      - name: Prepare Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' :app:assembleDebug --stacktrace

      - name: Verify APK signatures (v1+v2)
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          echo "--- v1 (JAR) signature files ---"
          unzip -l "$APK" | grep -E 'META-INF/.*\.(SF|RSA)' || { echo 'MISSING v1 signature'; exit 1; }
          echo "--- v2 (APK Signature Scheme) block ---"
          python3 - "$APK" <<'EOF'
          import struct, sys
          p = sys.argv[1]
          with open(p,'rb') as f:
              data = f.read()
          eocd = data.rfind(b'PK\x05\x06')
          cd_offset = struct.unpack('<I', data[eocd+16:eocd+20])[0]
          assert data[cd_offset-16:cd_offset] == b'APK Sig Block 42', 'MISSING v2 signing block'
          print('v2 signing block present, size', len(data), 'bytes')
          EOF
          echo "SIGNATURES OK"

      - uses: actions/upload-artifact@v4
        with:
          name: hetu-ui-preview-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
