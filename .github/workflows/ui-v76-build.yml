name: UI v76 build

# Dedicated build for test/v20.76-new-ui: builds the branch source directly
# (with Claude-written Home/Panel UI integrated) plus the native runtime payload.
# Does NOT wipe android-app like hetu-build.yml does.

on:
  push:
    branches: [test/v20.76-new-ui]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ui-v76-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HETU_TEST_KEYSTORE: /home/runner/.android/hetu-ui10-debug.jks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Restore signing identity
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.android/hetu-ui10-debug.jks
          key: hetu-ui10-debug-signing-v1
          fail-on-cache-miss: true

      - name: Verify signing identity
        run: |
          set -euo pipefail
          test -s "$HETU_TEST_KEYSTORE"
          keytool -exportcert -keystore "$HETU_TEST_KEYSTORE" -alias androiddebugkey -storepass android \
            | openssl dgst -sha256 -r | cut -d ' ' -f1 | grep -qx '701bbb0aaa5709cf2bebd96ff85ebd64c06cf6c3a2211ec21a9c51e534a5faad'

      - name: Restore runtime payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p .ref
          gh release download ui92-r146.15-test --repo "$GITHUB_REPOSITORY" --pattern 'Hetu-UI92-Runtime146-UI15.apk' --dir .ref
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          apk = Path('.ref/Hetu-UI92-Runtime146-UI15.apk')
          expected = json.load(open('UI92_RUNTIME146_INPUTS.json'))['original146_payload']
          with zipfile.ZipFile(apk) as z:
              for name, digest in expected.items():
                  data = z.read(name)
                  assert hashlib.sha256(data).hexdigest() == digest, name
                  if name.startswith('lib/'):
                      out = Path('android-app/app/src/main/jniLibs') / name.removeprefix('lib/')
                  elif name.startswith('assets/'):
                      out = Path('android-app/app/src/main') / name
                  else:
                      continue
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(data)
          print('runtime payload restored', len(expected))
          PY

      - name: Build APK
        working-directory: android-app
        run: gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' :app:assembleDebug --stacktrace

      - name: Verify APK signatures
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep -q 'META-INF/MANIFEST.MF' || { echo "MISSING v1 MANIFEST.MF"; exit 1; }
          unzip -l "$APK" | grep -q 'META-INF/.*\.RSA' || { echo "MISSING v1 RSA"; exit 1; }
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$APK" | grep -qi 'v2 scheme.*true\|Verified using v2'
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | grep -q "package: name='io.github.xgl34222220.hetu'"
          echo "APK signatures OK (v1+v2)"

      - uses: actions/upload-artifact@v4
        with:
          name: Hetu-NewUI-v20.76
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
