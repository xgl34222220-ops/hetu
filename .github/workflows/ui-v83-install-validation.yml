name: Hetu V20.83 fixed APK installation continuation
permissions:
  contents: read
  actions: read
concurrency:
  group: hetu-v2083-fixed-install-${{ github.ref }}
  cancel-in-progress: false
'on':
  push:
    branches:
    - test/v20.76-new-ui
    paths:
    - .github/scripts/native_scroll_bounds.py
    - .github/scripts/test_native_scroll_bounds.py
    - .github/scripts/fixtures/scroll-settings-dock-clearance.xml
    - .github/scripts/verify_ui83_reused_apk.py
    - .github/workflows/ui-v83-install-validation.yml
jobs:
  android-ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Fetch immutable validated build evidence
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        mkdir -p out/android-smoke

        gh api "repos/$GITHUB_REPOSITORY/actions/runs/37238394831" > out/android-smoke/source-run.json

        gh api "repos/$GITHUB_REPOSITORY/actions/runs/37238394831/attempts/1/jobs?per_page=100"
        > out/android-smoke/source-jobs.json

        gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11315943930" > out/android-smoke/source-apk-artifact.json

        gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11316830187" > out/android-smoke/source-verification-artifact.json

        gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11315943930/zip" > candidate-apk.zip

        gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11316830187/zip" > candidate-verification.zip

        '
    - name: Prepare official AOSP emulator
      run: 'set -euo pipefail

        mkdir -p out/android-smoke

        export ANDROID_AVD_HOME="$RUNNER_TEMP/hetu-avd"

        mkdir -p "$ANDROID_AVD_HOME"

        echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"

        SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

        AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"

        yes | "$SDKMANAGER" --licenses >/dev/null || true


        "$SDKMANAGER" ''platform-tools'' ''emulator'' ''build-tools;37.0.0'' ''system-images;android-${{
        matrix.api }};default;x86_64'' 2>&1 | tee out/android-smoke/sdk-prepare.log

        "$AVDMANAGER" list device --compact | grep -qx ''pixel_2''

        echo no | "$AVDMANAGER" create avd --force --device pixel_2 --name hetu-smoke
        --path "$ANDROID_AVD_HOME/hetu-smoke.avd" --package ''system-images;android-${{
        matrix.api }};default;x86_64'' 2>&1 | tee out/android-smoke/avd-prepare.log

        test -f "$ANDROID_AVD_HOME/hetu-smoke.avd/config.ini"

        sed -i ''/^hw.lcd.width=/d;/^hw.lcd.height=/d;/^hw.lcd.density=/d;/^hw.ramSize=/d''
        "$ANDROID_AVD_HOME/hetu-smoke.avd/config.ini"

        cat >> "$ANDROID_AVD_HOME/hetu-smoke.avd/config.ini" <<''EOF''

        hw.lcd.width=393

        hw.lcd.height=852

        hw.lcd.density=160

        hw.ramSize=2048

        EOF

        '
    - name: Verify unchanged compilation inputs and exact signed APK; regress dock
        gestures
      run: 'set -euo pipefail

        python3 .github/scripts/verify_ui83_reused_apk.py

        python3 .github/scripts/test_native_scroll_bounds.py 2>&1 | tee out/android-smoke/native-scroll-bounds-tests.txt

        '
    - name: Run installed APK navigation and native WebView smoke
      env:
        HETU_EXPECTED_VERSION: '2083'
        HETU_EXPECT_NEW_UI: '1'
      run: 'set -euo pipefail

        mkdir -p out/android-smoke

        export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"

        test -x "$ANDROID_HOME/platform-tools/adb"

        "$ANDROID_HOME/platform-tools/adb" version | tee out/android-smoke/adb-version.txt

        # Uses only this runner''s existing KVM or sudo access. No device permission,

        # group, ACL or SELinux changes; owned supervisor verifies process cleanup.

        python3 .github/scripts/run_hetu_emulator.py

        '
    - name: Upload Android smoke evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Hetu-V20.83-Android-${{ matrix.api }}-installation-continuation
        path: out/android-smoke/
        if-no-files-found: warn
    strategy:
      fail-fast: false
      matrix:
        api:
        - 35
        - 36
    name: Validate fixed V20.83 APK on API ${{ matrix.api }}
