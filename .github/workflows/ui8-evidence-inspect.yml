name: Inspect UI8 saved certificate evidence
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ui8-evidence-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Hetu-UI92-Runtime146-UI8-evidence
          run-id: 36409234584
          github-token: ${{ github.token }}
          path: evidence
      - name: Read already verified public certificate output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['apk-signature.txt','ui7-signature.txt','apk-identity.txt']:
              path=next(Path('evidence').rglob(name))
              print('PUBLIC_APK_METADATA',name)
              text=path.read_text()
              print(text if 'signature' in name else text.splitlines()[0])
          PY
