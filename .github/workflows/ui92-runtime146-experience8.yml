name: UI92 Runtime146 experience UI8
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: ui92-runtime146-experience8
  cancel-in-progress: false
jobs:
  experience:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact-base reviewed native UI8 changes
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ba2a6be65b03a1e1cdb190b08b431aa49a860cc0 HEAD
          mkdir -p integration-evidence
          git rev-parse HEAD > integration-evidence/input-commit.txt
          if grep -q '0.4.0-ui92-r146.7' android-app/app/build.gradle.kts; then
            python3 tools/apply_ui92_runtime146_experience8.py
          else
            grep -q '0.4.0-ui92-r146.8' android-app/app/build.gradle.kts
          fi
          if test -f tools/fix_ui8_layout.py; then python3 tools/fix_ui8_layout.py; fi
          git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare the existing SDK and build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Restore only verified original146 assets from UI7
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download ui92-r146.7-test --repo "$GITHUB_REPOSITORY" --pattern 'Hetu-UI92-Runtime146-UI7.apk' --dir .reference-ui7
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,zipfile
          apk=Path('.reference-ui7/Hetu-UI92-Runtime146-UI7.apk')
          assert hashlib.sha256(apk.read_bytes()).hexdigest()=='48835b0ea743cef760c471af3621c561a25c6164614b871bca4907879b0aa052'
          expected=json.load(open('UI92_RUNTIME146_INPUTS.json'))['original146_payload']
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              for name,digest in expected.items():
                  data=z.read(name)
                  assert hashlib.sha256(data).hexdigest()==digest,name
                  if name.startswith('lib/'): out=Path('android-app/app/src/main/jniLibs')/name.removeprefix('lib/')
                  elif name.startswith('assets/'): out=Path('android-app/app/src/main')/name
                  else: raise AssertionError(name)
                  out.parent.mkdir(parents=True,exist_ok=True)
                  if out.exists(): assert out.read_bytes()==data,name
                  else: out.write_bytes(data)
          print('Original146 runtime entries verified:',len(expected))
          PY
      - name: Compile APK and execute all ten regression suites
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' :app:assembleDebug :app:testDebugUnitTest --tests '*CompactHomeDashboardTest' --tests '*Runtime146ContractTest' --tests '*Ui92IntegrationTest' --tests '*NodeSelectionContinuityTest' --tests '*ProxyLatencyRegressionTest' --tests '*NativeDockUi4Test' --tests '*HomeUi5RegressionTest' --tests '*HomeUi6RegressionTest' --tests '*HomeUi7InteractionTest' --tests '*HomeUi8ExperienceTest' --stacktrace 2>&1 | tee ../integration-evidence/build.log
      - name: Report actual outcomes including all failures
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET,json
          Path('integration-evidence').mkdir(exist_ok=True)
          suites=[]
          for p in Path('android-app/app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'):
              r=ET.parse(p).getroot()
              row={k:r.get(k) for k in ('name','tests','failures','errors','skipped')}
              suites.append(row);print(row)
              for line in (r.findtext('system-out') or '').splitlines():
                  if line.startswith('ADDRESS_LAYOUT'): print(line)
              for case in r.findall('testcase'):
                  for e in list(case.findall('failure'))+list(case.findall('error')):
                      print('FAILURE',case.get('name'),e.get('message'),(e.text or '')[:1800])
          Path('integration-evidence/test-suites.json').write_text(json.dumps(suites,indent=2))
          PY
      - name: Verify APK identity signature and unchanged runtime code
        shell: bash
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" > integration-evidence/apk-identity.txt
          grep -q "package: name='io.github.xgl34222220.hetu'" integration-evidence/apk-identity.txt
          grep -q "versionCode='1009'" integration-evidence/apk-identity.txt
          grep -q "versionName='0.4.0-ui92-r146.8'" integration-evidence/apk-identity.txt
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK" > integration-evidence/apk-signature.txt
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs .reference-ui7/Hetu-UI92-Runtime146-UI7.apk > integration-evidence/ui7-signature.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess,zipfile,re
          base='ba2a6be65b03a1e1cdb190b08b431aa49a860cc0'
          root='android-app/app/src/main/java/io/github/xgl34222220/hetu/'
          allowed={root+n for n in ['CompactHomeDashboard.kt','NativeHomePolish.kt','HomeInteraction7.kt','HomeExperience8.kt','ReferenceProxyActivity.kt','ui/HetuTheme.kt','ui/HetuGlassDock.kt']}
          allowed.add('android-app/app/src/main/res/values/styles.xml')
          protected=[]
          for p in subprocess.check_output(['git','ls-tree','-r','--name-only',base]).decode().splitlines():
              if (p.startswith('android-app/app/src/main/') or p.startswith('native/')) and p not in allowed:
                  assert Path(p).read_bytes()==subprocess.check_output(['git','show',base+':'+p]),p
                  protected.append(p)
          p=root+'ReferenceProxyActivity.kt'
          old=subprocess.check_output(['git','show',base+':'+p]).decode();new=Path(p).read_text()
          assert old[:old.index('    val shellBackground')]==new[:new.index('    val shellBackground')], 'Runtime functions above home adapter changed'
          marker='\n@Composable\nprivate fun RefActionText('
          assert old[old.index(marker):]==new[new.index(marker):], 'Non-home pages changed'
          home=Path(root+'CompactHomeDashboard.kt').read_text()
          assert 'SnackbarHost(' not in home
          assert 'rememberHomeElasticity(' not in home
          assert 'RefProxyPage.Home -> PullToRefreshBox(' not in new
          assert '30.dp.toPx()' in home
          suites=json.load(open('integration-evidence/test-suites.json'))
          totals={k:sum(int(r[k]) for r in suites) for k in ['tests','failures','errors','skipped']}
          assert len(suites)==10,suites
          assert totals==dict(tests=113,failures=0,errors=0,skipped=0),totals
          expected=json.load(open('UI92_RUNTIME146_INPUTS.json'))['original146_payload']
          apk=Path('android-app/app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              for name,digest in expected.items(): assert hashlib.sha256(z.read(name)).hexdigest()==digest,name
          def signer(p):
              # Build-tools 37 prints 'V2 Signer:' rather than the old 'Signer #1'.
              # Both APKs have already passed apksigner verification. Extract only certificates,
              # not public-key hashes; fail closed on zero or multiple distinct certificates.
              fingerprints=set(re.findall(r'(?im)^.*\bcertificate SHA-256 digest:\s*([0-9a-f]{64})\s*$',Path(p).read_text()))
              assert len(fingerprints)==1, ('Expected one verified certificate fingerprint',p,sorted(fingerprints))
              return next(iter(fingerprints)).lower()
          current_signer=signer('integration-evidence/apk-signature.txt')
          previous_signer=signer('integration-evidence/ui7-signature.txt')
          result=dict(totals,base=base,protected_source_files=len(protected),runtime_payload_entries=len(expected),
              apk_bytes=apk.stat().st_size,apk_sha256=hashlib.sha256(apk.read_bytes()).hexdigest(),
              version='0.4.0-ui92-r146.8',versionCode=1009,device_tested=False,
              apk_certificate_sha256=current_signer,ui7_certificate_sha256=previous_signer,
              same_signer_as_ui7=current_signer==previous_signer)
          Path('integration-evidence/result.json').write_text(json.dumps(result,indent=2))
          Path('integration-evidence/protected-source-paths.json').write_text(json.dumps(protected,indent=2))
          Path('Hetu-UI92-Runtime146-UI8.apk').write_bytes(apk.read_bytes())
          print(json.dumps(result,indent=2))
          PY
      - name: Push only tested application changes without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess,os
          r=json.load(open('integration-evidence/result.json'))
          doc='''# 河图 UI8：完整地址、非线性刷新与顶部反馈

          从UI7继续，保留分组主卡、网络双栏、玻璃Dock、原生详情/日志抽屉和原146运行逻辑。本轮以用户最新文件中的五项诊断为范围，不把Vue样例整体覆盖为模拟应用。

          ## 实际改动
          - 首页地址强制单行，无省略号。用实际系统字体测量IPv4，半栏不够则使用单列；IPv6保持单行并可横向查看，详情保留完整复制。单行文字在滚动层内仍使用有限的实际字宽布局，没有将IP尾部隐藏来冒充修复。
          - 移除首页外层默认PullToRefreshBox和内部旧装饰弹性，统一原生nested-scroll手势；位移为110*(1-exp(-raw/190))dp，非线性有界阻力、65dp触发阈值、46dp真实刷新停留、弹簧复位。
          - 水滴展开为双环刷新指示，不再出现默认灰底圆形Loading。刷新只调用原refreshHomeAll；结束由实际refreshing状态控制，不设假网络计时器。
          - 移除首页底部Snackbar，改为安全区固定顶栏下方的半透明炭色小胶囊。成功绿点、错误粉红点、普通信息蓝点；点击可读原始详情，显示时间尊重无障碍设置。通知计时不改变运行状态。
          - 维持一个始终存在的标题和常驻操作，滚动30dp由居左28sp收为居中20sp；顶栏独立于拖动内容，保护打孔区。开启模糊且支持硬件绘制时使用Haze。
          - 公共可交互卡片/操作键与Dock按压改为0.97，释放弹簧。系统字族与tnum不变。
          - 浅色窗口/主题/首页为最新样例#F6F8FD，连续圆角、完整底轨、真实CPU比例和10dp Dock避让保留。

          ## 验证
          '''
          doc+=f"Actions：{os.environ['GITHUB_RUN_ID']}。十组{r['tests']}项检查通过，0失败、0错误、0跳过。\n"
          doc+=f"{r['runtime_payload_entries']}项原146核心资源校验一致；{r['protected_source_files']}个范围外生产文件与UI7字节一致。混合页面文件中的运行函数和其他页面也另做精确比较。\n"
          doc+='新增18项检查覆盖报告中的123.193.18.254、窄屏大字体、高密度、IPv6横滚和详情隔离、非线性阻力、真实长短下拉、反向取消、重复刷新、真实完成、忙碌禁用、30dp吸顶、顶部反馈位置/错误详情和实际按压形变。旧95项全部保留；更新新稿的背景色预期，并把旧顶栏测试明确为下拉与点击各触发一次刷新，两次分别断言，没有删除或跳过检查。\n'
          doc+='此前三轮未发布：首两轮103/113通过，第三轮104/113通过。保存的段落诊断显示无限宽滚动约束导致段落宽度为2.1474836E9、但实际文字盒仅124px；改为有限固有宽度，保留所有地址溢出断言。第四轮36409234584已113/113通过，实际签名验证也通过，但CI仍按旧版Signer #1格式提取证书，遇到V2 Signer格式而报错；本轮只修正证书报告解析后完整重跑，不修改应用与测试。失败证据保留在各次Actions中。\n'
          doc+=f"APK：{r['apk_bytes']}字节；SHA-256：{r['apk_sha256']}。版本{r['version']}，versionCode1009，包名io.github.xgl34222220.hetu。\n与UI7签名相同：{r['same_signer_as_ui7']}。\n"
          doc+='''
          ## 边界
          依据为用户最新文字诊断和模板，不声称看过178030.mp4或完成用户真机验收。Robolectric触摸/布局测试不是实际手机GPU帧率、毛玻璃效果、Root联网、微信消息或长期稳定性验证。
          这是Debug测试包，不升级核心，不改包名，不清理历史分支。签名冲突时保留原应用和配置，不卸载、不清数据。
          超长IPv6在卡片中需要横滑查看，不宣称窄屏可同时完整展示任意长度地址。不硬编码模板IP/CPU/流量，不带入console.log空按钮或setTimeout假刷新。
          '''
          Path('docs/UI92_RUNTIME146_UI8.md').write_text('\n'.join(line.lstrip() for line in doc.splitlines())+'\n')
          paths=json.load(open('integration-evidence/ui8-changed-paths.json')) if Path('integration-evidence/ui8-changed-paths.json').exists() else []
          paths+=['docs/UI92_RUNTIME146_UI8.md']
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(ui): verified UI8 complete addresses, physical refresh and top feedback [skip ci]'
            git push origin HEAD:main
          fi
          git rev-parse HEAD > integration-evidence/source-commit.txt
      - name: Export exact source and evidence even on failure
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess,zipfile
          names=set(subprocess.check_output(['git','ls-files']).decode().splitlines())
          p=Path('integration-evidence/ui8-changed-paths.json')
          if p.exists(): names.update(json.loads(p.read_text()))
          with zipfile.ZipFile('Hetu-UI92-Runtime146-UI8-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in sorted(names):
                  if Path(name).is_file(): z.write(name,name)
          with zipfile.ZipFile('Hetu-UI92-Runtime146-UI8-verification.zip','w',zipfile.ZIP_DEFLATED) as z:
              for root in ['integration-evidence','android-app/app/build/outputs/compact-home','android-app/app/build/test-results/testDebugUnitTest','android-app/app/build/reports/tests/testDebugUnitTest']:
                  for p in Path(root).rglob('*'):
                      if p.is_file(): z.write(p,str(p))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Hetu-UI92-Runtime146-UI8
          path: Hetu-UI92-Runtime146-UI8.apk
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hetu-UI92-Runtime146-UI8-evidence
          path: |
            Hetu-UI92-Runtime146-UI8-source.zip
            Hetu-UI92-Runtime146-UI8-verification.zip
            integration-evidence/
          retention-days: 14
          if-no-files-found: error
      - name: Publish verified test APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create ui92-r146.8-test --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --prerelease --title '河图 UI8 测试版 · 完整地址与原生刷新' --notes-file docs/UI92_RUNTIME146_UI8.md Hetu-UI92-Runtime146-UI8.apk Hetu-UI92-Runtime146-UI8-source.zip Hetu-UI92-Runtime146-UI8-verification.zip integration-evidence/result.json
