name: UI92 Runtime146 four-card UI10
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui92-runtime146-grid10.yml'
      - 'tools/apply_ui92_runtime146_grid10.py'
      - 'tools/fix_ui10_layout.py'
      - 'android-app/app/src/test/java/io/github/xgl34222220/hetu/HomeUi10GridTest.kt'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: ui92-runtime146-grid10
  cancel-in-progress: false
jobs:
  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HETU_TEST_KEYSTORE: /home/runner/.android/hetu-ui10-debug.jks
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact UI9 based UI changes
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 70f3d53a1a70c25d6d55b136328f8219be59eca1 HEAD
          mkdir -p integration-evidence
          git rev-parse HEAD > integration-evidence/input-commit.txt
          if grep -q '0.4.0-ui92-r146.9"' android-app/app/build.gradle.kts; then
            python3 tools/apply_ui92_runtime146_grid10.py
          else
            grep -q '0.4.0-ui92-r146.10"' android-app/app/build.gradle.kts
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-app/app/build.gradle.kts');s=p.read_text()
          if 'HETU_TEST_KEYSTORE' not in s:
              s=s.replace('    testOptions {','''    // Explicit CI debug identity. No private key is committed or exported.
              signingConfigs {
                  getByName("debug") {
                      System.getenv("HETU_TEST_KEYSTORE")?.takeIf { it.isNotBlank() }?.let {
                          storeFile = file(it)
                          storePassword = "android"
                          keyAlias = "androiddebugkey"
                          keyPassword = "android"
                      }
                  }
              }

              testOptions {''',1)
              p.write_text(s)
          Path('integration-evidence/signing-history.txt').write_text('UI9 run 36413534221 reported Path Validation Error: configured cache path did not exist; no signing cache was saved. UI10 first run 36416713176 failed closed on that missing cache. Original UI9 private key is unavailable. This build explicitly creates/reuses a separate test identity and reports certificate compatibility, never claims UI9 upgrade.\n')
          PY
          if test -f tools/fix_ui10_layout.py; then python3 tools/fix_ui10_layout.py; fi
          git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore explicit UI10 test identity
        id: signing
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.android/hetu-ui10-debug.jks
          key: hetu-ui10-debug-signing-v1
      - name: Initialize and inspect the explicitly configured debug identity
        shell: bash
        run: |
          set -euo pipefail
          if ! test -s "$HETU_TEST_KEYSTORE"; then
            umask 077
            mkdir -p "$(dirname "$HETU_TEST_KEYSTORE")"
            keytool -genkeypair -keystore "$HETU_TEST_KEYSTORE" -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Hetu UI10 Debug,O=Android,C=US' >/dev/null 2>&1
          fi
          keytool -exportcert -keystore "$HETU_TEST_KEYSTORE" -alias androiddebugkey -storepass android | openssl dgst -sha256 -r | cut -d ' ' -f1 > integration-evidence/intended-signer.sha256
          test -s integration-evidence/intended-signer.sha256
      - name: Save identity before compiling rather than after a potentially failed build
        if: steps.signing.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.android/hetu-ui10-debug.jks
          key: hetu-ui10-debug-signing-v1
      - name: Prepare unchanged Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Restore verified original146 runtime from UI9
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download ui92-r146.9-test --repo "$GITHUB_REPOSITORY" --pattern 'Hetu-UI92-Runtime146-UI9.apk' --dir .reference-ui9
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          apk=Path('.reference-ui9/Hetu-UI92-Runtime146-UI9.apk')
          assert hashlib.sha256(apk.read_bytes()).hexdigest()=='f6895b36c78c645334b5d531536c4a8f99bff617c9affcbeee74ce15c6cd76ad'
          expected=json.load(open('UI92_RUNTIME146_INPUTS.json'))['original146_payload']
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              for name,digest in expected.items():
                  data=z.read(name)
                  assert hashlib.sha256(data).hexdigest()==digest,name
                  if name.startswith('lib/'): out=Path('android-app/app/src/main/jniLibs')/name.removeprefix('lib/')
                  elif name.startswith('assets/'): out=Path('android-app/app/src/main')/name
                  else: raise AssertionError(name)
                  out.parent.mkdir(parents=True,exist_ok=True)
                  if out.exists(): assert out.read_bytes()==data,name
                  else: out.write_bytes(data)
          print('Original146 runtime verified:',len(expected))
          PY
      - name: Compile APK and execute all twelve regression suites
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' :app:assembleDebug :app:testDebugUnitTest --tests '*CompactHomeDashboardTest' --tests '*Runtime146ContractTest' --tests '*Ui92IntegrationTest' --tests '*NodeSelectionContinuityTest' --tests '*ProxyLatencyRegressionTest' --tests '*NativeDockUi4Test' --tests '*HomeUi5RegressionTest' --tests '*HomeUi6RegressionTest' --tests '*HomeUi7InteractionTest' --tests '*HomeUi8ExperienceTest' --tests '*HomeUi9BentoTest' --tests '*HomeUi10GridTest' --stacktrace 2>&1 | tee ../integration-evidence/build.log
      - name: Record all test outcomes including failures
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET,json
          Path('integration-evidence').mkdir(exist_ok=True)
          suites=[]
          for p in Path('android-app/app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'):
              root=ET.parse(p).getroot()
              row={k:root.get(k) for k in ['name','tests','failures','errors','skipped']}
              suites.append(row);print(row)
              for c in root.findall('testcase'):
                  for e in list(c.findall('failure'))+list(c.findall('error')):
                      print('FAILURE',c.get('name'),e.get('message'),(e.text or '')[:2400])
          Path('integration-evidence/test-suites.json').write_text(json.dumps(suites,indent=2))
          PY
      - name: Verify package signer source boundaries and runtime bytes
        shell: bash
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" > integration-evidence/apk-identity.txt
          grep -q "package: name='io.github.xgl34222220.hetu'" integration-evidence/apk-identity.txt
          grep -q "versionCode='1011'" integration-evidence/apk-identity.txt
          grep -q "versionName='0.4.0-ui92-r146.10'" integration-evidence/apk-identity.txt
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK" > integration-evidence/apk-signature.txt
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs .reference-ui9/Hetu-UI92-Runtime146-UI9.apk > integration-evidence/ui9-signature.txt
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,json,hashlib,zipfile,re
          base='70f3d53a1a70c25d6d55b136328f8219be59eca1'
          root='android-app/app/src/main/java/io/github/xgl34222220/hetu/'
          allowed={root+n for n in ['CompactHomeDashboard.kt','HomeExperience8.kt','HomeProportions.kt','HomeInteraction7.kt','NativeHomePolish.kt','ReferenceProxyActivity.kt','ui/HetuGlassDock.kt','ui/HetuTheme.kt']}
          allowed.add('android-app/app/src/main/res/values/styles.xml')
          protected=[]
          for p in subprocess.check_output(['git','ls-tree','-r','--name-only',base]).decode().splitlines():
              if (p.startswith('android-app/app/src/main/') or p.startswith('native/')) and p not in allowed:
                  assert Path(p).read_bytes()==subprocess.check_output(['git','show',base+':'+p]),p
                  protected.append(p)
          p=root+'ReferenceProxyActivity.kt'
          assert Path(p).read_text()==subprocess.check_output(['git','show',base+':'+p]).decode().replace('F4F6FC','F4F6FB'),'Runtime/page adapter change outside palette'
          home=Path(root+'CompactHomeDashboard.kt').read_text()
          assert 'HomeBentoPair(' not in home
          shortcuts=home[home.index('private fun HomeShortcutStrip('):home.index('private fun HomeLatency(')]
          assert 'ChevronRight' not in shortcuts and 'AutoMirrored' not in shortcuts
          assert home.count('HomeFeedbackPill(')==1 and 'testTag("home-notice-lane")' in home
          suites=json.load(open('integration-evidence/test-suites.json'))
          totals={k:sum(int(s[k]) for s in suites) for k in ['tests','failures','errors','skipped']}
          assert len(suites)==12,suites
          assert totals==dict(tests=145,failures=0,errors=0,skipped=0),totals
          expected=json.load(open('UI92_RUNTIME146_INPUTS.json'))['original146_payload']
          apk=Path('android-app/app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              for name,digest in expected.items(): assert hashlib.sha256(z.read(name)).hexdigest()==digest,name
          def signer(path):
              found=set(re.findall(r'certificate SHA-256 digest:\s*([0-9a-fA-F]{64})',Path(path).read_text()))
              assert len(found)==1,(path,found)
              return next(iter(found)).lower()
          current=signer('integration-evidence/apk-signature.txt');old=signer('integration-evidence/ui9-signature.txt')
          assert old=='9e59901795143dd54fdac4145efbcfb430fd1b44505aaa01bbda99714fb0d90d'
          assert current==Path('integration-evidence/intended-signer.sha256').read_text().strip(),'APK did not use explicitly persisted identity'
          result=dict(totals,base=base,protected_source_files=len(protected),runtime_payload_entries=len(expected),
              version='0.4.0-ui92-r146.10',versionCode=1011,package='io.github.xgl34222220.hetu',device_tested=False,
              same_signer_as_ui9=current==old,signer_sha256=current,ui9_signer_sha256=old,apk_bytes=apk.stat().st_size,
              apk_sha256=hashlib.sha256(apk.read_bytes()).hexdigest())
          Path('integration-evidence/result.json').write_text(json.dumps(result,indent=2))
          Path('integration-evidence/protected-source-paths.json').write_text(json.dumps(protected,indent=2))
          Path('Hetu-UI92-Runtime146-UI10.apk').write_bytes(apk.read_bytes())
          print(json.dumps(result,indent=2))
          PY
      - name: Commit only tested application source without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess,os
          r=json.load(open('integration-evidence/result.json'))
          doc='''# 河图 UI10：独立四宫格、可见IP与顶部通知

          依据最新附件「粘贴的 markdown (1)。md(8)」；该稿明确取代UI9双联方案。从UI9继续，不倒回旧分支，不声称看过文稿提及的178043.mp4。

          ## 实际修改
          - WAN、网速、订阅、资源占用恢复四张独立白卡；20dp连续圆角、12dp内边距、横纵10dp间隙。不再有双联共享材质或中间分隔线。
          - WebUI与日志为无箭头双磁贴，保留真实入口。顺序为主卡、双磁贴、网络延迟、2x2数据区。
          - 地址按最新稿使用系统14sp与tnum、单行无省略。按实际字体测量，标签占位不足时在本卡内移到上方，不改变四宫格列数。新增测试要求普通屏IPv4无需横滑、最后字形在可见区域内，不只检查底层字符串。
          - 标题固定居中20sp；主卡26dp连续圆角、21sp状态、14sp时间与配置、12sp核心、76dp徽标；控制键保持48dp触摸范围。紧凑间距8dp，普通10dp。
          - 通知在顶部安全区下8dp的独立槽内进出，不覆盖主卡，出现时让出实际高度，消失收回。保留错误区分、详情与无障碍时长。
          - Dock视觉高度60dp，触摸目标48dp，首页按实际Dock高度再预留10dp，不隐藏内容或禁用滚动。
          - 背景#F4F6FB，延迟18sp、数值15sp、小单位11sp；订阅/CPU保持6dp完整底轨和真实比例。
          - 原146服务、Root、DNS、路由、配置存储和其他页面业务不变。真实下拉刷新、按压回弹、WAN/LAN过渡、详情点击隔离、可拖动抽屉保留。

          ## 验证
          '''
          doc+=f"Actions {os.environ['GITHUB_RUN_ID']}：12组{r['tests']}项通过，0失败、0错误、0跳过。\n"
          doc+='原131项继续执行，仅更新最新稿明确取代的视觉预期；新增14项含可见IPv4、393x852与360x800首屏加实际Dock、xxhdpi、320dp大字体、独立卡片间隙像素、顶部通知与停止键真实点击。\n'
          doc+=f"{r['runtime_payload_entries']}项原146运行资源一致；{r['protected_source_files']}个范围外生产/原生文件与UI9字节一致。ReferenceProxyActivity全文件除配色字符串外一致。\n"
          doc+=f"APK {r['apk_bytes']}字节，SHA-256 {r['apk_sha256']}。版本{r['version']}，versionCode1011，包名{r['package']}。\n"
          doc+=f"与UI9签名相同：{r['same_signer_as_ui9']}。本次证书SHA-256 {r['signer_sha256']}。\n"
          doc+='''
          ## 签名问题与边界
          UI9保存日志实际报Path Validation Error，配置的路径不存在，缓存从未写入。首轮UI10在缓存缺失处停止，尚未编译。原UI9私钥未保留，无法还原其签名；本包不是UI9覆盖更新包。不得要求用户卸载或清除配置，也不通过改包名掩盖冲突。
          UI10改为显式Gradle测试签名路径，在编译前创建并保存，同一路径恢复；实际APK证书必须等于该路径的证书。密钥不进入源码、报告或发布附件。缓存仍不是生产签名保管方案，不保证永久保留。
          仍为Debug测试版。自动化不代表用户真机安装、高刷/GPU毛玻璃、Root联网、微信消息或长期稳定性验收。长IPv6/极端大字体允许横滑，极小屏、长配置或通知显示时允许纵向滚动，不承诺所有尺寸零滚动。
          未改核心和包名，未清理历史分支。测试截图非用户手机实拍。
          '''
          Path('docs/UI92_RUNTIME146_UI10.md').write_text('\n'.join(l.lstrip() for l in doc.splitlines())+'\n')
          paths=json.load(open('integration-evidence/ui10-changed-paths.json')) if Path('integration-evidence/ui10-changed-paths.json').exists() else []
          subprocess.run(['git','add','--',*paths,'docs/UI92_RUNTIME146_UI10.md'],check=True)
          PY
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(ui): verified UI10 four-card layout and visible addresses [skip ci]'
            git push origin HEAD:main
          fi
          git rev-parse HEAD > integration-evidence/source-commit.txt
      - name: Export exact source and evidence even on failure
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,zipfile,json
          names=set(subprocess.check_output(['git','ls-files']).decode().splitlines())
          p=Path('integration-evidence/ui10-changed-paths.json')
          if p.exists(): names.update(json.loads(p.read_text()))
          with zipfile.ZipFile('Hetu-UI92-Runtime146-UI10-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in sorted(names):
                  if Path(name).is_file(): z.write(name,name)
          with zipfile.ZipFile('Hetu-UI92-Runtime146-UI10-verification.zip','w',zipfile.ZIP_DEFLATED) as z:
              for root in ['integration-evidence','android-app/app/build/outputs/compact-home','android-app/app/build/test-results/testDebugUnitTest','android-app/app/build/reports/tests/testDebugUnitTest']:
                  for p in Path(root).rglob('*'):
                      if p.is_file(): z.write(p,str(p))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Hetu-UI92-Runtime146-UI10
          path: Hetu-UI92-Runtime146-UI10.apk
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hetu-UI92-Runtime146-UI10-evidence
          path: |
            Hetu-UI92-Runtime146-UI10-source.zip
            Hetu-UI92-Runtime146-UI10-verification.zip
            integration-evidence/
          retention-days: 14
          if-no-files-found: error
      - name: Publish verified test package with explicit installation limitation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create ui92-r146.10-test Hetu-UI92-Runtime146-UI10.apk Hetu-UI92-Runtime146-UI10-source.zip Hetu-UI92-Runtime146-UI10-verification.zip integration-evidence/result.json --target "$(git rev-parse HEAD)" --prerelease --title '河图 UI10 测试版 · 独立四宫格与完整IP' --notes-file docs/UI92_RUNTIME146_UI10.md
