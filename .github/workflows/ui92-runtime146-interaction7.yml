name: UI92 Runtime146 native interactions UI7
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui92-runtime146-interaction7.yml'
      - 'tools/apply_ui92_runtime146_interaction7.py'
      - 'tools/fix_ui7_layout.py'
      - 'android-app/app/src/main/java/io/github/xgl34222220/hetu/HomeInteraction7.kt'
      - 'android-app/app/src/test/java/io/github/xgl34222220/hetu/HomeUi7InteractionTest.kt'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: ui92-runtime146-interaction7
  cancel-in-progress: false
jobs:
  interaction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed exact UI6 to UI7 presentation changes
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8d3d30842b81e72f769ba751190f95adf0ecc39e HEAD
          mkdir -p integration-evidence
          git rev-parse HEAD > integration-evidence/input-commit.txt
          if grep -q '0.4.0-ui92-r146.6' android-app/app/build.gradle.kts; then
            python3 tools/apply_ui92_runtime146_interaction7.py
          else
            grep -q '0.4.0-ui92-r146.7' android-app/app/build.gradle.kts
          fi
          if test -f tools/fix_ui7_layout.py; then python3 tools/fix_ui7_layout.py; fi
          git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare exact SDK without upgrading the application toolchain
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Restore exact original146 resources from verified UI6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download ui92-r146.6-test --repo "$GITHUB_REPOSITORY" --pattern 'Hetu-UI92-Runtime146-UI6.apk' --dir .reference-ui6
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,zipfile
          apk=Path('.reference-ui6/Hetu-UI92-Runtime146-UI6.apk')
          assert hashlib.sha256(apk.read_bytes()).hexdigest()=='015794f55ea661a6358e5a7b26463ffdecf603b1a31c1b61ed47207a24b13274'
          expected=json.load(open('UI92_RUNTIME146_INPUTS.json'))['original146_payload']
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              for name,digest in expected.items():
                  data=z.read(name)
                  assert hashlib.sha256(data).hexdigest()==digest,name
                  if name.startswith('lib/'): out=Path('android-app/app/src/main/jniLibs')/name.removeprefix('lib/')
                  elif name.startswith('assets/'): out=Path('android-app/app/src/main')/name
                  else: raise AssertionError(name)
                  out.parent.mkdir(parents=True,exist_ok=True)
                  if out.exists(): assert out.read_bytes()==data,name
                  else: out.write_bytes(data)
          print('Original146 verified runtime entries:',len(expected))
          PY
      - name: Compile APK and execute all 95 selected regression tests
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' :app:assembleDebug :app:testDebugUnitTest --tests '*CompactHomeDashboardTest' --tests '*Runtime146ContractTest' --tests '*Ui92IntegrationTest' --tests '*NodeSelectionContinuityTest' --tests '*ProxyLatencyRegressionTest' --tests '*NativeDockUi4Test' --tests '*HomeUi5RegressionTest' --tests '*HomeUi6RegressionTest' --tests '*HomeUi7InteractionTest' --stacktrace 2>&1 | tee ../integration-evidence/build.log
      - name: Report actual outcomes including failures
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET,json
          suites=[]
          for p in Path('android-app/app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'):
              r=ET.parse(p).getroot()
              row={k:r.get(k) for k in ('name','tests','failures','errors','skipped')}
              suites.append(row);print(row)
              for c in r.findall('testcase'):
                  for e in list(c.findall('failure'))+list(c.findall('error')):
                      print('FAILURE',c.get('name'),e.get('message'),(e.text or '')[:2200])
          Path('integration-evidence/test-suites.json').write_text(json.dumps(suites,indent=2))
          PY
      - name: Verify APK identity signature and unchanged runtime source
        shell: bash
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" > integration-evidence/apk-identity.txt
          grep -q "package: name='io.github.xgl34222220.hetu'" integration-evidence/apk-identity.txt
          grep -q "versionCode='1008'" integration-evidence/apk-identity.txt
          grep -q "versionName='0.4.0-ui92-r146.7'" integration-evidence/apk-identity.txt
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK" > integration-evidence/apk-signature.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess,zipfile,xml.etree.ElementTree as ET
          base='8d3d30842b81e72f769ba751190f95adf0ecc39e'
          root='android-app/app/src/main/java/io/github/xgl34222220/hetu/'
          allowed={root+n for n in ['CompactHomeDashboard.kt','NativeHomePolish.kt','ReferenceProxyActivity.kt','HomeInteraction7.kt','ui/HetuTheme.kt']}
          allowed.add('android-app/app/src/main/res/values/styles.xml')
          protected=[]
          for p in subprocess.check_output(['git','ls-tree','-r','--name-only',base]).decode().splitlines():
              if (p.startswith('android-app/app/src/main/') or p.startswith('native/')) and p not in allowed:
                  assert Path(p).read_bytes()==subprocess.check_output(['git','show',base+':'+p]),p
                  protected.append(p)
          suites=json.load(open('integration-evidence/test-suites.json'))
          totals={k:sum(int(r[k]) for r in suites) for k in ['tests','failures','errors','skipped']}
          assert len(suites)==9,suites
          assert totals==dict(tests=95,failures=0,errors=0,skipped=0),totals
          expected=json.load(open('UI92_RUNTIME146_INPUTS.json'))['original146_payload']
          apk=Path('android-app/app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              for name,digest in expected.items(): assert hashlib.sha256(z.read(name)).hexdigest()==digest,name
          result=dict(totals,base=base,protected_source_files=len(protected),runtime_payload_entries=len(expected),
              apk_bytes=apk.stat().st_size,apk_sha256=hashlib.sha256(apk.read_bytes()).hexdigest(),
              version='0.4.0-ui92-r146.7',versionCode=1008,device_tested=False)
          Path('integration-evidence/result.json').write_text(json.dumps(result,indent=2))
          Path('integration-evidence/protected-source-paths.json').write_text(json.dumps(protected,indent=2))
          Path('Hetu-UI92-Runtime146-UI7.apk').write_bytes(apk.read_bytes())
          print(json.dumps(result,indent=2))
          PY
      - name: Commit only tested application changes without rewriting history
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess,os
          r=json.load(open('integration-evidence/result.json'))
          doc='''# 河图 UI7：分组首页与原生微交互

          基于UI6，原146功能/配置/核心保持。最新文件文字说明要求合并卡片，而Vue例子仍保留八块；本轮明确按文字设计意图合并，不声称逐字复制示例。

          ## 实际改动
          - WebUI与日志并入主卡下方48dp双联轻量入口，不再各占一个独立白色大卡。
          - WAN/LAN与网速共用一个连续白色面板；独立触摸目标、详情点击隔离、同高与基线对齐仍保留。
          - 单个标题由顶部居左28sp随滚动40dp平滑过渡为居中20sp，刷新/更多按钮始终常驻安全区。硬件加速且用户开启模糊时使用真实Haze，关闭时为可读的实色降级。
          - 顶边剩余拖动驱动有界弹性装饰，不消费原有下拉刷新手势，不让标题和主卡进入摄像头安全区。
          - 实时数值采用单文字层整值向上滚动，单位排版/tnum保持；这是整值过渡，不是每一位独立机械滚轮。取消逐帧插值对滚动动画的反复重启。
          - WAN/LAN继续先退后进，增加有景深的正负12度Y轴透视；连点取消旧任务，关闭动效立即收敛。
          - 公共按压比例0.965，释放采用弹簧；不会用透明度变暗假装按下。
          - 网络和现有日志抽屉共用原生锚定拖拽状态；48dp把手触摸区，慢拖120dp阈值，快速甩动允许关闭，小距离松手回弹。保留日志滚动/复制、系统返回与无障碍处理。
          - 浅色窗口/主题/首页统一#F8FAFC；主卡使用线性与两个径向光源混合的多点柔光渐变，双层轻阴影；保留28dp连续圆角、实际Dock测量与10dp避让。

          ## 验证
          '''
          doc+=f"Actions运行：{os.environ['GITHUB_RUN_ID']}。{r['tests']}项检查通过，0失败、0错误、0跳过。\n"
          doc+=f"{r['runtime_payload_entries']}项原146核心及运行资源SHA-256一致；{r['protected_source_files']}个非本轮UI范围的生产/原生文件与UI6逐字节一致。\n"
          doc+='新增12项检查：主卡内入口、组合网络独立点击、展开/折叠标题、真实列表滚动、数值更新与减少动效、透视角度、网络长拖关闭/短拖回弹、实际日志拖拽/滚动复制、大字体IPv6。旧测试只更新最新要求明确取代的标题位置/字号及背景颜色断言。\n'
          doc+=f"APK：{r['apk_bytes']}字节；SHA-256：{r['apk_sha256']}。\n版本0.4.0-ui92-r146.7，versionCode1008，包名io.github.xgl34222220.hetu。\n"
          doc+='''
          ## 边界
          自动化不是用户真机验收。未验证用户设备安装、GPU毛玻璃/帧率、Root联网、微信消息与长期稳定性。组件截图采用明确测试数据，不是手机实拍。本轮没有可逐帧核验的新录屏。
          Debug测试签名不保证覆盖原146/此前测试包；签名冲突时保留原应用与配置，不卸载、不清数据。没有更换包名、升级核心或清理历史分支。
          不采用示例中的空WebUI/日志回调、模拟测速、虚构IP/地区/流量/CPU。字体继续使用系统字族。
          '''
          Path('docs/UI92_RUNTIME146_UI7.md').write_text('\n'.join(line.lstrip() for line in doc.splitlines())+'\n')
          paths=json.load(open('integration-evidence/ui7-changed-paths.json')) if Path('integration-evidence/ui7-changed-paths.json').exists() else []
          paths+=['docs/UI92_RUNTIME146_UI7.md']
          subprocess.run(['git','add','--',*paths],check=True)
          PY
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(ui): verified UI7 grouping, collapsing header, rolling metrics and drawer gestures [skip ci]'
            git push origin HEAD:main
          fi
          git rev-parse HEAD > integration-evidence/source-commit.txt
      - name: Export exact source and test evidence including failures
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,zipfile,json
          names=set(subprocess.check_output(['git','ls-files']).decode().splitlines())
          p=Path('integration-evidence/ui7-changed-paths.json')
          if p.exists(): names.update(json.loads(p.read_text()))
          with zipfile.ZipFile('Hetu-UI92-Runtime146-UI7-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in sorted(names):
                  if Path(name).is_file(): z.write(name,name)
          with zipfile.ZipFile('Hetu-UI92-Runtime146-UI7-verification.zip','w',zipfile.ZIP_DEFLATED) as z:
              for root in ['integration-evidence','android-app/app/build/outputs/compact-home','android-app/app/build/test-results/testDebugUnitTest','android-app/app/build/reports/tests/testDebugUnitTest']:
                  for p in Path(root).rglob('*'):
                      if p.is_file(): z.write(p,str(p))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Hetu-UI92-Runtime146-UI7
          path: Hetu-UI92-Runtime146-UI7.apk
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hetu-UI92-Runtime146-UI7-evidence
          path: |
            Hetu-UI92-Runtime146-UI7-source.zip
            Hetu-UI92-Runtime146-UI7-verification.zip
            integration-evidence/
          retention-days: 14
          if-no-files-found: error
      - name: Publish verified APK as a test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create ui92-r146.7-test --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --prerelease --title '河图 UI7 测试版 · 分组首页与原生微交互' --notes-file docs/UI92_RUNTIME146_UI7.md Hetu-UI92-Runtime146-UI7.apk Hetu-UI92-Runtime146-UI7-source.zip Hetu-UI92-Runtime146-UI7-verification.zip integration-evidence/result.json
