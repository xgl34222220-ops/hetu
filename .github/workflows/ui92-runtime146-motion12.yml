name: UI92 Runtime146 motion UI12
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui92-runtime146-motion12.yml'
      - 'tools/apply_ui12_motion.py'
      - 'tools/fix_ui12.py'
      - 'tools/finish_ui12.py'
      - 'android-app/app/src/main/java/io/github/xgl34222220/hetu/MotionMaterials12.kt'
      - 'android-app/app/src/test/java/io/github/xgl34222220/hetu/Motion*12Test.kt'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: ui92-runtime146-motion12
  cancel-in-progress: false
jobs:
  motion:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HETU_TEST_KEYSTORE: /home/runner/.android/hetu-ui10-debug.jks
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate only UI12 presentation changes on verified UI11
        run: |
          set -euo pipefail
          mkdir -p integration-evidence
          git merge-base --is-ancestor 621e4f22fce4e9c5f5c717eab1147fad20dab950 HEAD
          git rev-parse HEAD > integration-evidence/input-commit.txt
          python3 -m py_compile tools/apply_ui12_motion.py tools/fix_ui12.py tools/finish_ui12.py
          python3 tools/apply_ui12_motion.py 2>&1 | tee integration-evidence/migration.log
          python3 tools/fix_ui12.py 2>&1 | tee -a integration-evidence/migration.log
          git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore the existing UI10 UI11 signing identity
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.android/hetu-ui10-debug.jks
          key: hetu-ui10-debug-signing-v1
          fail-on-cache-miss: true
      - name: Fail closed on missing or different signer
        run: |
          set -euo pipefail
          test -s "$HETU_TEST_KEYSTORE"
          keytool -exportcert -keystore "$HETU_TEST_KEYSTORE" -alias androiddebugkey -storepass android | openssl dgst -sha256 -r | cut -d ' ' -f1 > integration-evidence/intended-signer.sha256
          grep -qx '701bbb0aaa5709cf2bebd96ff85ebd64c06cf6c3a2211ec21a9c51e534a5faad' integration-evidence/intended-signer.sha256
      - name: Prepare unchanged Android toolchain
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Restore and hash-check original146 runtime from verified UI11
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download ui92-r146.11-test --repo "$GITHUB_REPOSITORY" --pattern 'Hetu-UI92-Runtime146-UI11.apk' --dir .reference-ui11
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          apk=Path('.reference-ui11/Hetu-UI92-Runtime146-UI11.apk')
          assert hashlib.sha256(apk.read_bytes()).hexdigest()=='0c8c05dcc1e5e7a0bd910ca49968bfa94debe4f39b7410f81cd8a48cfe241e62'
          expected=json.load(open('UI92_RUNTIME146_INPUTS.json'))['original146_payload']
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              for name,digest in expected.items():
                  data=z.read(name)
                  assert hashlib.sha256(data).hexdigest()==digest,name
                  if name.startswith('lib/'):out=Path('android-app/app/src/main/jniLibs')/name.removeprefix('lib/')
                  elif name.startswith('assets/'):out=Path('android-app/app/src/main')/name
                  else:raise AssertionError(name)
                  out.parent.mkdir(parents=True,exist_ok=True)
                  if out.exists():assert out.read_bytes()==data,name
                  else:out.write_bytes(data)
          print('Verified original146 assets:',len(expected))
          PY
      - name: Record actual resolved UI dependency graph
        working-directory: android-app
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' :app:dependencies --configuration debugRuntimeClasspath > ../integration-evidence/dependencies.txt
          grep 'material3-android:1.5.0-alpha22' ../integration-evidence/dependencies.txt
      - name: Compile APK and run all seventeen suites without exclusions
        working-directory: android-app
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' :app:assembleDebug :app:testDebugUnitTest --tests '*CompactHomeDashboardTest' --tests '*Runtime146ContractTest' --tests '*Ui92IntegrationTest' --tests '*NodeSelectionContinuityTest' --tests '*ProxyLatencyRegressionTest' --tests '*NativeDockUi4Test' --tests '*HomeUi5RegressionTest' --tests '*HomeUi6RegressionTest' --tests '*HomeUi7InteractionTest' --tests '*HomeUi8ExperienceTest' --tests '*HomeUi9BentoTest' --tests '*HomeUi10GridTest' --tests '*HomeUi11Test' --tests '*PanelModel11Test' --tests '*PanelUi11Test' --tests '*MotionModel12Test' --tests '*MotionUi12Test' --stacktrace 2>&1 | tee ../integration-evidence/build.log
      - name: Record all actual compiler and test outcomes
        if: always()
        run: python3 tools/finish_ui12.py record
      - name: Verify package signer runtime assets and protected source
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" > integration-evidence/apk-identity.txt
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK" > integration-evidence/apk-signature.txt
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs .reference-ui11/Hetu-UI92-Runtime146-UI11.apk > integration-evidence/ui11-signature.txt
          python3 tools/finish_ui12.py verify 2>&1 | tee integration-evidence/verification.log
      - name: Preserve actual failures including post-build verification failures
        if: failure()
        run: |
          set -euo pipefail
          python3 tools/finish_ui12.py record
          mkdir -p docs/ci
          cp integration-evidence/attempt.json docs/ci/UI12-last-attempt.json
          git add -- docs/ci/UI12-last-attempt.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: retain actual UI12 failure evidence [skip ci]'
            git push origin HEAD:main
          fi
      - name: Commit tested production code and exact delivery notes
        run: |
          set -euo pipefail
          python3 tools/finish_ui12.py notes
          git add -- android-app/app/src/main/java android-app/app/src/test/java android-app/app/build.gradle.kts docs/UI92_RUNTIME146_UI12.md AGENTS.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: deliver tested UI12 native motion and materials [skip ci]'
          git push origin HEAD:main
          git rev-parse HEAD > integration-evidence/app-commit.txt
      - name: Export exact source and complete evidence without signing files
        if: always()
        run: python3 tools/finish_ui12.py export
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Hetu-UI12-verified-delivery
          path: delivery/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hetu-UI12-actual-build-evidence
          path: delivery/Hetu-UI92-Runtime146-UI12-verification.zip
          if-no-files-found: error
      - name: Publish only the same-signer tested UI12 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create ui92-r146.12-test delivery/Hetu-UI92-Runtime146-UI12.apk delivery/Hetu-UI92-Runtime146-UI12-source.zip delivery/Hetu-UI92-Runtime146-UI12-verification.zip delivery/result.json --repo "$GITHUB_REPOSITORY" --target "$(cat integration-evidence/app-commit.txt)" --prerelease --title '河图 UI12 测试版 · 弹簧与跟手材质' --notes-file docs/UI92_RUNTIME146_UI12.md
