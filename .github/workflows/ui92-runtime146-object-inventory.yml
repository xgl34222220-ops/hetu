name: UI92 runtime146 source inventory
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ui92-runtime146-object-inventory.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export tracked source and public object identifiers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p inventory
          git rev-parse HEAD > inventory/main-commit.txt
          git rev-parse HEAD^{tree} > inventory/main-tree.txt
          git cat-file --batch-all-objects --batch-check='%(objectname) %(objecttype)' | awk '$2 == "blob" { print $1 }' > inventory/blob-ids.txt
          git archive --format=zip HEAD -o inventory/main-source.zip
          git ls-tree -r HEAD > inventory/main-files.txt
          git archive --format=zip refs/remotes/origin/fix/ui146-polish-20260927 -o inventory/reference-source.zip
          git rev-parse refs/remotes/origin/fix/ui146-polish-20260927 > inventory/reference-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: UI92-runtime146-source-inventory
          path: inventory/
          retention-days: 7
          if-no-files-found: error
