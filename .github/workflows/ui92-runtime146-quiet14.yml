name: UI92 Runtime146 quiet nodes and compatibility UI14
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui92-runtime146-quiet14.yml'
      - 'tools/apply_ui14.py'
      - 'tools/finish_ui14.py'
      - 'tools/ui14/**'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: ui92-runtime146-quiet14
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HETU_TEST_KEYSTORE: /home/runner/.android/hetu-ui10-debug.jks
      RUN_ID: ${{ github.run_id }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply only reviewed UI14 changes on delivered UI13
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p integration-evidence
          git merge-base --is-ancestor 2150e2dcae0921d418e8bd5700e39dae535c5370 HEAD
          git rev-parse HEAD > integration-evidence/input-commit.txt
          python3 tools/apply_ui14.py 2>&1 | tee integration-evidence/migration.log
          git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore UI10 through UI13 signing identity
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.android/hetu-ui10-debug.jks
          key: hetu-ui10-debug-signing-v1
          fail-on-cache-miss: true
      - name: Refuse any missing or different signer
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HETU_TEST_KEYSTORE"
          keytool -exportcert -keystore "$HETU_TEST_KEYSTORE" -alias androiddebugkey -storepass android | openssl dgst -sha256 -r | cut -d ' ' -f1 > integration-evidence/intended-signer.sha256
          grep -qx '701bbb0aaa5709cf2bebd96ff85ebd64c06cf6c3a2211ec21a9c51e534a5faad' integration-evidence/intended-signer.sha256
      - name: Prepare unchanged Android tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Restore exact original146 runtime from verified UI13 APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download ui92-r146.13-test --repo "$GITHUB_REPOSITORY" --pattern 'Hetu-UI92-Runtime146-UI13.apk' --dir .reference-ui13
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          apk=Path('.reference-ui13/Hetu-UI92-Runtime146-UI13.apk')
          assert hashlib.sha256(apk.read_bytes()).hexdigest()=='48c90fb7921cd50842129cfbc034473a91f0a7269476d7c0851466f16e03f29b'
          expected=json.load(open('UI92_RUNTIME146_INPUTS.json'))['original146_payload']
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              for name,digest in expected.items():
                  data=z.read(name);assert hashlib.sha256(data).hexdigest()==digest,name
                  if name.startswith('lib/'):out=Path('android-app/app/src/main/jniLibs')/name.removeprefix('lib/')
                  elif name.startswith('assets/'):out=Path('android-app/app/src/main')/name
                  else:raise AssertionError(name)
                  out.parent.mkdir(parents=True,exist_ok=True)
                  if out.exists():assert out.read_bytes()==data,name
                  else:out.write_bytes(data)
          print('Original146 runtime entries verified:',len(expected))
          PY
      - name: Record actual unchanged UI dependency resolution
        working-directory: android-app
        run: |
          gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' :app:dependencies --configuration debugRuntimeClasspath > ../integration-evidence/dependencies.txt
      - name: Compile APK and run twenty UI and runtime regression suites
        working-directory: android-app
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' :app:assembleDebug :app:testDebugUnitTest --tests '*CompactHomeDashboardTest' --tests '*Runtime146ContractTest' --tests '*Ui92IntegrationTest' --tests '*NodeSelectionContinuityTest' --tests '*ProxyLatencyRegressionTest' --tests '*NativeDockUi4Test' --tests '*HomeUi5RegressionTest' --tests '*HomeUi6RegressionTest' --tests '*HomeUi7InteractionTest' --tests '*HomeUi8ExperienceTest' --tests '*HomeUi9BentoTest' --tests '*HomeUi10GridTest' --tests '*HomeUi11Test' --tests '*PanelModel11Test' --tests '*PanelUi11Test' --tests '*MotionModel12Test' --tests '*MotionUi12Test' --tests '*PanelNavigation13Test' --tests '*RuntimeCompatibility14Test' --tests '*PanelPolish14Test' --stacktrace 2>&1 | tee ../integration-evidence/build.log
      - name: Record actual compiler and test outcomes
        if: always()
        run: python3 tools/finish_ui14.py record
      - name: Verify signer identity runtime hashes and exact source scope
        shell: bash
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" > integration-evidence/apk-identity.txt
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK" > integration-evidence/apk-signature.txt
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs .reference-ui13/Hetu-UI92-Runtime146-UI13.apk > integration-evidence/ui13-signature.txt
          python3 tools/finish_ui14.py verify 2>&1 | tee integration-evidence/verification.log
      - name: Preserve actual failure evidence without publishing untested application changes
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/finish_ui14.py record
          mkdir -p docs/ci
          cp integration-evidence/attempt.json docs/ci/UI14-last-attempt.json
          git add -- docs/ci/UI14-last-attempt.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: preserve actual UI14 failure evidence [skip ci]'
            git push origin HEAD:main
          fi
      - name: Commit tested production changes and factual delivery notes
        run: |
          python3 tools/finish_ui14.py notes
          python3 tools/finish_ui14.py commit
      - name: Export source and evidence without signing or font files
        if: always()
        run: python3 tools/finish_ui14.py export
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Hetu-UI14-verified-delivery
          path: delivery/*
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hetu-UI14-actual-build-evidence
          path: delivery/Hetu-UI92-Runtime146-UI14-verification.zip
          if-no-files-found: error
      - name: Publish tested same-signer UI14 APK source and report
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create ui92-r146.14-test delivery/Hetu-UI92-Runtime146-UI14.apk delivery/Hetu-UI92-Runtime146-UI14-source.zip delivery/Hetu-UI92-Runtime146-UI14-verification.zip delivery/result.json --repo "$GITHUB_REPOSITORY" --target "$(cat integration-evidence/app-commit.txt)" --prerelease --title '河图 UI14 测试版 · 安静测速与运行兼容性' --notes-file docs/UI92_RUNTIME146_UI14.md
