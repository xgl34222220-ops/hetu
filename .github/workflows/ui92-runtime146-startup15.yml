name: UI92 Runtime146 YAML startup hotfix UI15
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ui92-runtime146-startup15.yml'
      - 'tools/apply_ui15.py'
      - 'tools/finish_ui15.py'
      - 'tools/ui15/**'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: ui92-runtime146-startup15
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HETU_TEST_KEYSTORE: /home/runner/.android/hetu-ui10-debug.jks
      RUN_ID: ${{ github.run_id }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact locally tested startup fix without changing UI
        run: |
          set -euo pipefail
          mkdir -p integration-evidence
          git merge-base --is-ancestor 0a4b0c6b1f60b5b9d8d26d2be27b46d343082ffc HEAD
          git rev-parse HEAD > integration-evidence/input-commit.txt
          python3 tools/apply_ui15.py 2>&1 | tee integration-evidence/migration.log
          git diff --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore UI10 through UI14 signing identity
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.android/hetu-ui10-debug.jks
          key: hetu-ui10-debug-signing-v1
          fail-on-cache-miss: true
      - name: Refuse missing or changed signing identity
        run: |
          set -euo pipefail
          test -s "$HETU_TEST_KEYSTORE"
          keytool -exportcert -keystore "$HETU_TEST_KEYSTORE" -alias androiddebugkey -storepass android | openssl dgst -sha256 -r | cut -d ' ' -f1 > integration-evidence/intended-signer.sha256
          grep -qx '701bbb0aaa5709cf2bebd96ff85ebd64c06cf6c3a2211ec21a9c51e534a5faad' integration-evidence/intended-signer.sha256
      - name: Prepare unchanged Android tools
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Restore and verify exact original146 runtime from UI14 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download ui92-r146.14-test --repo "$GITHUB_REPOSITORY" --pattern 'Hetu-UI92-Runtime146-UI14.apk' --dir .reference-ui14
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile
          apk=Path('.reference-ui14/Hetu-UI92-Runtime146-UI14.apk')
          assert hashlib.sha256(apk.read_bytes()).hexdigest()=='2b96461b5a1ee6752b2c742cd0f9a924410be542e89d7af41b768a4a42383d59'
          expected=json.load(open('UI92_RUNTIME146_INPUTS.json'))['original146_payload']
          with zipfile.ZipFile(apk) as z:
              assert z.testzip() is None
              for name,digest in expected.items():
                  data=z.read(name);assert hashlib.sha256(data).hexdigest()==digest,name
                  if name.startswith('lib/'):out=Path('android-app/app/src/main/jniLibs')/name.removeprefix('lib/')
                  elif name.startswith('assets/'):out=Path('android-app/app/src/main')/name
                  else:raise AssertionError(name)
                  out.parent.mkdir(parents=True,exist_ok=True)
                  if out.exists():assert out.read_bytes()==data,name
                  else:out.write_bytes(data)
          print('Verified original146 payload entries:',len(expected))
          PY
      - name: Record unchanged resolved dependencies
        working-directory: android-app
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' :app:dependencies --configuration debugRuntimeClasspath > ../integration-evidence/dependencies.txt
      - name: Compile APK and run all twenty-two regression suites
        working-directory: android-app
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx3g -Dfile.encoding=UTF-8' :app:assembleDebug :app:testDebugUnitTest --tests '*CompactHomeDashboardTest' --tests '*Runtime146ContractTest' --tests '*Ui92IntegrationTest' --tests '*NodeSelectionContinuityTest' --tests '*ProxyLatencyRegressionTest' --tests '*NativeDockUi4Test' --tests '*HomeUi5RegressionTest' --tests '*HomeUi6RegressionTest' --tests '*HomeUi7InteractionTest' --tests '*HomeUi8ExperienceTest' --tests '*HomeUi9BentoTest' --tests '*HomeUi10GridTest' --tests '*HomeUi11Test' --tests '*PanelModel11Test' --tests '*PanelUi11Test' --tests '*MotionModel12Test' --tests '*MotionUi12Test' --tests '*PanelNavigation13Test' --tests '*RuntimeCompatibility14Test' --tests '*PanelPolish14Test' --tests '*RuntimeYaml15Test' --tests '*RuntimeStartup15Test' --stacktrace 2>&1 | tee ../integration-evidence/build.log
      - name: Record actual compiler and test outcomes
        if: always()
        run: python3 tools/finish_ui15.py record
      - name: Verify signer package runtime hashes and protected source
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" > integration-evidence/apk-identity.txt
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK" > integration-evidence/apk-signature.txt
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs .reference-ui14/Hetu-UI92-Runtime146-UI14.apk > integration-evidence/ui14-signature.txt
          python3 tools/finish_ui15.py verify 2>&1 | tee integration-evidence/verification.log
      - name: Preserve real failures without publishing an unverified APK
        if: failure()
        run: |
          set -euo pipefail
          python3 tools/finish_ui15.py record
          mkdir -p docs/ci
          cp integration-evidence/attempt.json docs/ci/UI15-last-attempt.json
          git add docs/ci/UI15-last-attempt.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'ci: preserve actual UI15 startup hotfix failure [skip ci]' || true
          git push origin HEAD:main
      - name: Commit tested hotfix and exact delivery notes
        run: |
          set -euo pipefail
          python3 tools/finish_ui15.py notes
          python3 tools/finish_ui15.py commit
      - name: Export exact source and verification without credentials or font files
        if: always()
        run: python3 tools/finish_ui15.py export
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Hetu-UI15-verified-delivery
          path: delivery/*
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hetu-UI15-actual-build-evidence
          path: delivery/Hetu-UI92-Runtime146-UI15-verification.zip
          if-no-files-found: error
      - name: Publish same-signer tested UI15 startup hotfix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create ui92-r146.15-test delivery/Hetu-UI92-Runtime146-UI15.apk delivery/Hetu-UI92-Runtime146-UI15-source.zip delivery/Hetu-UI92-Runtime146-UI15-verification.zip delivery/result.json --repo "$GITHUB_REPOSITORY" --target "$(cat integration-evidence/app-commit.txt)" --title '河图 UI15 测试版 · 修复 YAML 模板启动误拦' --prerelease --notes-file docs/UI92_RUNTIME146_UI15.md
