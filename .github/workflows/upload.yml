name: hetu-2.2.2-asset-upload
on:
  push:
    branches: [hark/tmp-release-asset-2.2.2]
permissions:
  contents: write
  actions: read
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Hetu-APK-arm64
          run-id: 38565165018
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: xgl34222220-ops/hetu
          path: apk
      - name: Verify and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la apk
          echo "08e341436c25ee5e9c18b66256335f46873b0ace2d9bb310137935cec1bdd7be  apk/Hetu-2.2.2-arm64-v8a.apk" | sha256sum -c -
          curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/vnd.android.package-archive" --data-binary @apk/Hetu-2.2.2-arm64-v8a.apk "https://uploads.github.com/repos/xgl34222220-ops/hetu/releases/412807021/assets?name=Hetu-2.2.2.apk"
