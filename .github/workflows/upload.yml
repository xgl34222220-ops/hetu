name: hetu-6.6.6-release
on:
  push:
    branches: [hark/tmp-release-asset-5.0.0]
permissions:
  contents: write
  actions: read
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Hetu-APK-arm64
          run-id: 39338167000
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: xgl34222220-ops/hetu
          path: apk
      - name: Verify, create the release and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -la apk
          echo "001847b183c9334cf80b900ffe47cdeb84902b6e97a7fd2484e9f2aa9a849838  apk/Hetu-6.6.6-arm64-v8a.apk" | sha256sum -c -
          cp apk/Hetu-6.6.6-arm64-v8a.apk Hetu-6.6.6.apk
          cat > notes.md <<'NOTES'
          ## 河图 6.6.6

          外网时不时断：测速有延迟，网页、Google 却打不开。看门狗现在按核心里的真实连接发现这种情况：先断开卡住的连接让应用马上重连；同一个节点反复卡住，或者经过它的加密请求不通时，让自动组切走。

          **之前为什么一直不处理**
          - 测速、首页检测都只是经过节点请求一个空页面（generate_204），几十个字节就能通过。打开网页、Google 要传的数据多得多。你的诊断里，经过节点的连接连上以后发出了数据，却一直收不到回应，测速照样有延迟。
          - Mihomo 的「故障转移」「自动选择」只在测速网址失败、或者连接直接失败时才换节点。这种「连上了却没回应」不算失败，所以一直不换。
          - 河图的看门狗原来只测 www.gstatic.com，它按规则走 Google 组，别的组坏了看不到。

          **6.6.6 怎么处理**
          - 看门狗每 10 秒读一次核心里的连接列表，不额外产生流量，并和上一次对比。下面两种连接，持续 8 秒以上，就算「卡住」：
            - 发出了数据，一个字节都没收到；
            - 只收到握手那几 KB（不到 16 KB），之后发出请求就再没回应。
          - 网页走的 TCP 连接和 Google、YouTube 常用的 QUIC 都算。QUIC 只看第一种：QUIC 连接结束后还会在列表里留一会儿，最后一个包是手机自己发的，按第二种算会误判。已经收到过正常数据的连接也不按第二种算，免得把空闲、长轮询的连接当成卡住。
          - 某个节点同时有 3 条以上、去往 2 个以上网站的卡住连接，而它上面没有任何连接还在收数据，就判定这个节点卡住了。
          - 判定后：
            - 先经过正在用它的策略组发一次加密请求（HTTPS），看看真正的网页请求能不能通；
            - 能通、只是偶尔卡一下：只断开卡住的那几条连接，让应用马上重连，新连接通常就能过去，「断一阵」会短很多；
            - 加密请求不通，或者同一个节点 10 分钟内卡住 3 次：用到它的自动组（故障转移、自动选择）换到能用的节点，并断开经过它的连接；
              - 故障转移按组里原来的顺序取第一个能用的，自动选择取最快的；
              - 不会换成直连，也不会换成刚卡住过的节点；
              - 约 10 分钟后自动组恢复自动选择；同一个节点很快又卡住，下次固定的时间翻倍，最长 1 小时。
          - 你手动选择的策略组（比如「流媒体」），以及你自己固定的节点，河图不会替你改，只在通知里写明是哪个组在用它。
          - 整个网络都断了（直连也不通）时，什么都不改。
          - 每次处理都会写进看门狗日志：哪个节点、卡住几条连接、几个网站、加密请求通不通、10 分钟内第几次。以后导出诊断包，就能直接看到断网那几分钟发生了什么，不用另外抓日志。

          **顺带修好的两个老问题**
          - 看门狗「只断开经过坏节点的连接」这一步，对名字里带「]」的节点和组（比如「[两年]」「[无限]」）从来没有断开过一条连接，你的看门狗日志里一直是「closed 0 of …」。现在能正确匹配。
          - 「清理 Google 联网限制」里清理厂商防火墙规则的那一步，在手机自带的 awk 上一直报错（诊断里那 239 行 `awk: newline in string`），所以从来没生效。现在修好了。

          覆盖安装后请点一次代理「重启」，新的运行脚本才会生效。

          测试情况（电脑上，不是真机）：
          - 用真实的 Mihomo 1.19.31 加一个「能过测速、但其他请求都不回数据」的模拟节点，跑了完整流程，结果都符合预期：
            - 加密请求不通，两个自动组都换到了好节点，手动组没动；
            - 卡住的连接被断开，之后经过「最终兜底」能正常访问；
            - 到时间后自动组恢复了自动选择。
          - 「偶尔卡一下只断卡住的连接」「10 分钟内 3 次才切」「QUIC」「握手后没回应」这几种情况，用模拟的控制接口测过。
          - 在 Android 自带的同一种 awk（One True Awk）下也跑通了。

          另外发现、但这一版没改的一处差别：你配置里写的 `global-client-fingerprint: chrome`，河图内置的 Mihomo 1.19.31 已经不再支持。所以订阅里的节点连接时，加密握手用的是 Go 程序默认的样式，不是 Chrome 的；这一点我在电脑上抓包确认过。旧版 Mihomo 的软件还会按 Chrome 握手。它是不是断网的原因还不能确定；你已经同意补上，下一版 6.6.7 会让订阅节点按你配置的指纹握手。

          尚未在真机上验证：
          - 断网时具体卡在哪个节点、为什么卡。下次诊断包里的看门狗日志会写清楚。
          - 新的判定和处理在你手机上的实际效果。

          SHA-256: `001847b183c9334cf80b900ffe47cdeb84902b6e97a7fd2484e9f2aa9a849838`

          NOTES
          gh release create v6.6.6 Hetu-6.6.6.apk --repo xgl34222220-ops/hetu --target 2c7a8cca4fae613d887b8cc3ea337df7b2caebb4 --title '河图 6.6.6' --notes-file notes.md
          gh release view v6.6.6 --repo xgl34222220-ops/hetu --json tagName,targetCommitish,assets --jq '{tag: .tagName, target: .targetCommitish, assets: [.assets[] | {name, size, digest}]}'
