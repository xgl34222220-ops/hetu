name: hetu-4.0.0-asset-upload
on:
  push:
    branches: [hark/tmp-release-asset-4.0.0]
permissions:
  contents: write
  actions: read
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Hetu-APK-arm64
          run-id: 38995788096
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: xgl34222220-ops/hetu
          path: apk
      - name: Verify and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la apk
          echo "364526b4f6f62aee7b405ae2056837f5742069184cd1414e59dfc306ff6026ff  apk/Hetu-4.0.0-arm64-v8a.apk" | sha256sum -c -
          curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/vnd.android.package-archive" --data-binary @apk/Hetu-4.0.0-arm64-v8a.apk "https://uploads.github.com/repos/xgl34222220-ops/hetu/releases/415601002/assets?name=Hetu-4.0.0.apk"
