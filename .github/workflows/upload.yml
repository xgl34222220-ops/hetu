name: hetu-1.0.0-asset-upload
on:
  push:
    branches: [hark/tmp-release-asset-1.0.0]
permissions:
  contents: write
  actions: read
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Hetu-APK
          run-id: 38367152156
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: xgl34222220-ops/hetu
          path: apk
      - name: Verify and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la apk
          echo "93bd9b75d58a234f7f44791996a66192c7548d51d88cfcc497c50e73eab5b1f8  apk/Hetu-1.0.0.apk" | sha256sum -c -
          curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/vnd.android.package-archive" --data-binary @apk/Hetu-1.0.0.apk "https://uploads.github.com/repos/xgl34222220-ops/hetu/releases/411521280/assets?name=Hetu-1.0.0.apk"
