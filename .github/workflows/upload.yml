name: hetu-4.4.4-asset-upload
on:
  push:
    branches: [hark/tmp-release-asset-4.4.4]
permissions:
  contents: write
  actions: read
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Hetu-APK-arm64
          run-id: 39007940081
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: xgl34222220-ops/hetu
          path: apk
      - name: Verify and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la apk
          echo "0bb7b64efe8b8b73568ef4752cb94e85ba5ca72e61d7fc6a507510462fbd7eed  apk/Hetu-4.4.4-arm64-v8a.apk" | sha256sum -c -
          curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/vnd.android.package-archive" --data-binary @apk/Hetu-4.4.4-arm64-v8a.apk "https://uploads.github.com/repos/xgl34222220-ops/hetu/releases/415653635/assets?name=Hetu-4.4.4.apk"
