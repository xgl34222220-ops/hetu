name: hetu-6.0.0-release
on:
  push:
    branches: [hark/tmp-release-asset-5.0.0]
permissions:
  contents: write
  actions: read
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Hetu-APK-arm64
          run-id: 39311774836
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: xgl34222220-ops/hetu
          path: apk
      - name: Verify, create the release and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -la apk
          echo "c5b6777d5f97a9e99a2ea0b07ce5dcd197f3c43544fdcd395f9475eede0def21  apk/Hetu-6.0.0-arm64-v8a.apk" | sha256sum -c -
          cp apk/Hetu-6.0.0-arm64-v8a.apk Hetu-6.0.0.apk
          cat > notes.md <<'NOTES'
          ## 河图 6.0.0

          修复「用着用着外网突然不通、国内正常、测速正常、停止重启也没用」的一种已复现原因，看门狗不再对这种状态袖手旁观；国内视频 / 语音通话和游戏的 UDP 默认不再绕道核心；ColorOS（OPPO / 一加 / realme）上 Google Play「出了点问题」的系统联网限制可以自动解除；sing-box 的「订阅」「规则集」页面可以用了；sing-box 的假 IP 缓存时间改为 1 秒。

          **外网突然不通、国内正常、测速正常**
          - 在本机用真实 Mihomo v1.19.31 复现了一种和你描述完全一致的情况：核心启动时，如果它的缓存文件 `cache.db` 正被别的进程占着（超过 1 秒），Mihomo 只记一行警告就继续运行，但整个运行期间都记不住假 IP。结果是：国内（真实 IP）正常，所有走代理的外网连接一连上就被断开，节点测速却完全正常。核心不换掉，这个状态就一直在。
          - 启动前：河图检查有没有进程占着这个文件。是河图自己遗留的核心或配置检查进程，就结束它；是别的进程，就把旧文件改名保存为 `cache.db.held-时间`（不删除），让核心用新文件启动，并在启动结果里说明。sing-box 遇到同样情况会直接启动失败，现在也能正常启动。
          - App 的配置检查改为 `exec` 运行，超时时结束的是检查进程本身，不会再留下占着缓存文件的进程。
          - 看门狗（运行中）：以前「外网测试失败，但每个策略组测速都正常」时它不做任何处理，这正是你遇到的状态。现在它会继续查：
            - 同一个域名再解析一次。拿到不同的假 IP，或核心日志里有缓存文件打不开的记录，就是假 IP 记录丢了：立即重启核心（受原有的重启次数上限约束），并发通知说明。
            - 再从核心自带的本机入口直接请求同一个网址（走核心自己的规则和节点，不经过透明代理和假 IP）：
              - 这样能通 → 问题在「请求进不了核心」，按原有步骤重查透明代理规则、再重启核心；仍不行就通知你，并列出在线的其他 VPN / TUN。
              - 这样也不通 → 问题在规则或节点。核心日志里写明走了哪个节点组时，按坏节点处理（重测自动选择组，只断开经过它的连接）；如果规则把外网分到了直连（DIRECT）、拒绝（REJECT）或空的节点组，河图不改你的配置，只发通知写明是哪条规则、哪个策略组。
            - 有走代理的下载还在收数据时不下结论，不会打断下载。
          - 首页：看门狗判断外网异常时，状态卡显示提醒并说明河图在做什么。核心自带入口能通不再显示成「出口已验证」，因为它不代表 App 的流量能通。

          **国内视频通话、游戏卡**
          - 以前默认所有应用的 UDP（视频 / 语音通话的音视频数据、游戏、P2P）都要先进河图核心，在核心里转一手再直连出去。「中国 IP 内核直连」要手动打开，而且依赖 ipset，ColorOS 这类没有 ipset 的系统上打开了也不生效。
          - 现在默认开启「国内 UDP 内核直连」：发往国内 IP 的 UDP 在内核里直接放行，不经过核心。TCP 仍经过核心按规则处理；DNS 接管、按域名分流、DNS 层广告过滤都不变。
          - 没有 ipset 的系统（如 ColorOS）改用河图自带的 eBPF 程序匹配国内 IP。每条规则链只多一条规则，不会像 iptables 规则树那样拖慢系统。手动打开的「中国 IP 内核直连」在这些系统上也因此能真正生效。
          - 两种方式内核都不支持时，自动不启用，UDP 照旧经过核心，不报错。
          - 开关在「工具 › CNIP 设置 ›『国内 UDP 内核直连』」，可以关掉；改动重启代理后生效。
          - 代价：发往国内 IP 的 UDP（含 QUIC）广告连接不再经过核心里的广告规则，只靠 DNS 层拦截。

          **Google Play / Google 服务（ColorOS）**
          - 据开源项目 oplus-gms-ebpf-unlock 的分析，ColorOS 在透明代理（TPROXY）运行时，会把 Google Play 服务、Play 商店、GSF、ConfigUpdater 写进系统内核的 eBPF 联网限制名单（`map_oplus-netd_app_*_socket_uid_limit_map`）。iptables 看不到这张表，网络变化后系统还会重新写入。这和「打开别的 Root 透明代理模块后能好一阵」的情况一致。
          - 设置 › 高级代理配置 › 「厂商防火墙」里的开关改名为「清理 Google 联网限制」。打开后，河图在启动时清理一次，运行中约每 12 秒检查一次，只删除这四个 Google 应用的条目。你给其它应用设的「禁止使用 WLAN / 移动数据」开关不受影响。原有的 OPPO / 一加 / 中兴 iptables 规则链清理照旧。
          - 开关关闭时只做只读检测。如果发现 Google 服务正被这张表限制，开关下方会提示你打开。
          - 这项清理默认关闭，打开后需要重启代理才生效。

          **sing-box 订阅 / 规则集**
          - sing-box 的控制接口没有订阅和规则集接口，以前这两页只显示「不支持」。现在显示河图启动 sing-box 时自己下载、部署的内容：
            - 订阅：节点数、更新时间，以及机场提供的流量和到期时间。
            - 规则集：规则条数（含 .srs 二进制规则集）和更新时间。
          - 规则集「更新」立即生效，无需重启：河图重新下载后替换规则文件，sing-box 会自动重新加载。
          - 订阅「更新」会重新下载节点列表。sing-box 不能在运行中替换节点，更新后会提示你「重启代理」。
          - 首页与概览的订阅流量 / 到期提醒，现在 sing-box 也有了。

          **断网相关**
          - sing-box 的假 IP 应答缓存时间从 600 秒改为 1 秒（与 Mihomo 一致；用 sing-box 1.14.3 实测）。停止或重启代理后，应用不会再拿着已经失效的假 IP 继续连接最长 10 分钟。转换来的配置和你自己的 sing-box 配置都适用；规则里自己写了 `rewrite_ttl` 的保持不变。

          覆盖安装后请点一次代理「重启」，新的运行脚本才会生效。

          尚未在真机上验证：
          - 你手机上「外网突然不通」是不是这个原因，我没有你手机上的日志，不能确定。这一版能自动处理已复现的这种情况；如果是规则或其他原因，看门狗会通过通知和首页提醒告诉你查到的结果。
          - ColorOS 的 Google 限制清理能否在你的手机上解除 Play「出了点问题」。
          - 视频通话在你手机上是否明显变流畅；ColorOS 的内核和 SELinux 是否允许河图加载 eBPF 程序（不允许时自动不启用，UDP 照旧经过核心）。

          SHA-256: `c5b6777d5f97a9e99a2ea0b07ce5dcd197f3c43544fdcd395f9475eede0def21`

          NOTES
          gh release create v6.0.0 Hetu-6.0.0.apk --repo xgl34222220-ops/hetu --target 33a195742e559ee428b4cabcd071fcc666bd1c29 --title '河图 6.0.0' --notes-file notes.md
