name: hetu-3.3.3-asset-upload
on:
  push:
    branches: [hark/tmp-release-asset-3.3.3]
permissions:
  contents: write
  actions: read
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Hetu-APK-arm64
          run-id: 38822076835
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: xgl34222220-ops/hetu
          path: apk
      - name: Verify and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la apk
          echo "c23db058bfdc2bebeae0f80686afa1481f8ba35eddd3659a687f68b40ae47e6c  apk/Hetu-3.3.3-arm64-v8a.apk" | sha256sum -c -
          curl -sSf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/vnd.android.package-archive" --data-binary @apk/Hetu-3.3.3-arm64-v8a.apk "https://uploads.github.com/repos/xgl34222220-ops/hetu/releases/414477925/assets?name=Hetu-3.3.3.apk"
