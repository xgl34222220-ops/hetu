name: Visual workspace export
on:
  workflow_dispatch:
  push:
    branches: [feature/hetu-rebrand-root-app]
    paths: [.github/workflows/visual-workspace.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package checked-out source and public Android tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/visual-workspace"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/visual-workspace/source.tar.gz"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          TOOLS=$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          test -x "$TOOLS/apksigner"
          tar -C "$TOOLS" -czf "$RUNNER_TEMP/visual-workspace/android-sign-tools.tar.gz" aapt zipalign apksigner lib lib64
          git rev-parse HEAD > "$RUNNER_TEMP/visual-workspace/commit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: Hetu-Visual-Workspace
          path: ${{ runner.temp }}/visual-workspace/
          retention-days: 1
          if-no-files-found: error
