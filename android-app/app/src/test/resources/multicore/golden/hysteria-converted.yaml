# Hetu: Hysteria 2 client generated from Clash/Mihomo node "KR Hy2"
server: "hy2.example.com:8443"
auth: "hpw"
tls:
  sni: "hy2.example.com"
  insecure: false
obfs:
  type: "salamander"
